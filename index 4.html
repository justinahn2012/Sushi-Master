function makeSignature(bId, tId, fId) {
  const b = SIG.base.find((x) => x.id === bId), t = SIG.tech.find((x) => x.id === tId), f = SIG.finish.find((x) => x.id === fId);
  const fitT = t.fit[b.kind] || 0;
  const fitF = f.fit ? (f.fit[b.kind] != null ? f.fit[b.kind] : 0.35) : 0.8;
  const harmony = fitT * 0.6 + fitF * 0.4;
  const respect = (t.edo * 0.5 + f.edo * 0.3 + (b.kind === 'meat' ? 0 : b.kind === 'salmon' ? 0.1 : 0.2));
  const flash = f.flash + (b.kind === 'meat' ? 0.4 : 0);
  const name = (t.id === 'raw' ? '' : t.en.split(' (')[0] + ' ') + b.en.toLowerCase().replace(/^a5/, 'A5').replace(/^ō/, 'ō') + ' with ' + f.en;
  return { id: 'sig', sec: 'nigiri', t: { white: 1, fatwhite: 1, silver: 2, red: 3, fat: 4, shell: 5, salmon: 3, meat: 4, uni: 7 }[b.kind], en: name.charAt(0).toUpperCase() + name.slice(1), jp: '名物', d: 'your signature', s: [], c: b.c + f.c, sk: t.sk || 'slice', sig: { b: bId, t: tId, f: fId, harmony, respect, flash } };
}

/* ---------- scoring the menu ---------- */
const TUNA_IDS = ['zuke', 'chutoro', 'otoro', 'torotaku', 'negitoro', 'kama'];
/* which Toyosu trade a dish is bought from. Brokers there specialise by trade: tuna (大物), the
   specialty trade for premium sushi tane (特種物), shellfish and uni houses within it, everyday fresh
   fish (鮮魚), and prawns and octopus. Exactly which broker carries a given species varies. */
const CAT_IDS = {
  special: ['hirame', 'madai', 'kasugo', 'kinmedai', 'engawa', 'kohada', 'shinko', 'anago', 'usuzukuri', 'aged', 'nodoguro', 'ankimo', 'shirako', 'kani'],
  shell: ['akagai', 'hotate', 'kobashira', 'awabi', 'hamamushi', 'nihama', 'ushio', 'uni', 'uniflight', 'ikura'],
  fresh: ['aji', 'saba', 'iwashi', 'sayori', 'sanma', 'katsuo', 'warayaki', 'buri', 'kanpachi', 'shimaaji', 'sawaraya', 'shirauo', 'kawahagi', 'hotaruika', 'sabazushi', 'ika', 'sashimi', 'mozukutsu'],
  prawn: ['ebi', 'ebiten', 'tako'],
};
function fishCat(d) {
  if (d.sig) { const b = d.sig.b; return ['akami', 'otoro'].includes(b) ? 'tuna' : b === 'uni' ? 'shell' : b === 'ebi' ? 'prawn' : ['katsuo', 'salmon'].includes(b) ? 'fresh' : b === 'wagyu' ? null : 'special'; }
  if (TUNA_IDS.includes(d.id)) return 'tuna';
  for (const c of Object.keys(CAT_IDS)) if (CAT_IDS[c].includes(d.id)) return c;
  return null;
}
function dishById(id, sig) { return id === 'sig' ? sig : DISHES.find((d) => d.id === id); }
function inSeason(d, season) { return !d.s || !d.s.length || d.s.includes(season); }

/* menu = { style, season, items: [ids in order], sig, price }  skills = station skills 0-100 */
function scoreMenu(menu, loc, skills, opts = {}) {
  const style = STYLES.find((s) => s.id === menu.style) || STYLES[1];
  const items = menu.items.map((id) => dishById(id, menu.sig)).filter(Boolean);
  const by = (sec) => items.filter((d) => d.sec === sec);
  const nig = by('nigiri'), tsu = by('tsumami');
  const notes = [];
  // order: sections in sequence, nigiri tiers rising
  let inv = 0;
  const secIdx = (d) => SECTIONS.findIndex((s) => s.id === d.sec);
  for (let i = 1; i < items.length; i++) if (secIdx(items[i]) < secIdx(items[i - 1])) inv += 2;
  for (let i = 0; i < nig.length; i++) for (let j = i + 1; j < nig.length; j++) if (nig[i].t > nig[j].t) inv += nig[i].t - nig[j].t >= 2 ? 1.5 : 0.7;
  const flowS = U.clamp(100 - inv * 8, 0, 100);
  if (inv > 2) notes.push({ k: 'flow', t: 'The order fights itself: fatty tuna before white fish flattens everything after it.' });
  // season
  const seasonal = items.filter((d) => d.s && d.s.length);
  const shun = seasonal.filter((d) => d.s.includes(menu.season)).length, off = seasonal.length - shun;
  const seasonS = U.clamp(55 + shun * 9 - off * 14, 0, 100);
  if (off) notes.push({ k: 'season', t: off + (off > 1 ? ' dishes are' : ' dish is') + ' out of season: dearer, and the regulars notice.' });
  if (shun >= 4) notes.push({ k: 'shun', t: 'Strongly seasonal. Critics love a menu that tells them the month.' });
  // balance of nigiri groups
  const groups = new Set(nig.map((d) => d.t));
  const balS = U.clamp(groups.size / 6 * 100, 0, 100) - Math.max(0, Math.max(0, ...[1, 2, 3, 4, 5, 6, 7].map((g) => nig.filter((d) => d.t === g).length)) - 4) * 10;
  if (!nig.some((d) => d.id === 'kohada' || d.id === 'shinko')) notes.push({ k: 'kohada', t: 'No kohada. In Tokyo that is the piece people judge an Edomae shop by.' });
  // length against the style
  const wN = style.want.nigiri, wT = style.want.tsumami;
  const lenS = U.mean([U.band(nig.length, (wN[0] + wN[1]) / 2, (wN[1] - wN[0]) / 2, (wN[1] - wN[0]) / 2 + 6), U.band(tsu.length, (wT[0] + wT[1]) / 2, (wT[1] - wT[0]) / 2, (wT[1] - wT[0]) / 2 + 4)]);
  const pieces = items.length;
  if (nig.length < wN[0]) notes.push({ k: 'short', t: 'A short nigiri run for the price. Guests count pieces.' });
  if (pieces > 26) notes.push({ k: 'long', t: pieces + ' courses is a marathon. People get full and tired.' });
  const closers = ['tamago', 'owan'].filter((sec) => by(sec).length).length;
  // execution: your skills on each dish
  const sk = (st) => skills && skills[st] != null ? skills[st] : 70;
  // tuna quality depends on who sells it to you (opts.tuna from your broker)
  // the fish is only as good as who sells it to you (opts.sup: exec and cost by fishmonger)
  const SUP = opts.sup || {};
  const supOf = (d) => { const c = fishCat(d); return c && SUP[c] ? SUP[c] : { exec: 0, cost: 1 }; };
  const exec = items.length ? Math.min(100, U.mean(items.map((d) => { let e = sk(d.sk); if (d.need && e < d.need) e -= (d.need - e) * 1.5; if (d.edo) e -= Math.max(0, 80 - sk('rice')) * 0.3; e += supOf(d).exec; return U.clamp(e, 0, 100); })) + (opts.execB || 0)) : 0;
  const catN = (c) => items.filter((d) => fishCat(d) === c).length;
  const SUPNOTE = { tuna: ['Your tuna broker cuts you the best bluefin of the week. Regulars notice the toro before anything else.', 'Distributor tuna: fine, never memorable.'],
    special: ['Your specialty broker keeps the best hirame and kohada for you; the white fish sing.', 'Your premium tane comes from whoever has it. It shows next to a serious counter\'s.'],
    shell: ['Your shellfish and uni house sends you the boxes and the live shellfish it does not show anyone else.', 'Ordinary uni and shellfish: a little tired.'],
    fresh: ['Your fresh-fish broker saves you the best aji and saba of the morning, still stiff.', 'Your everyday fish is whatever was left.'],
    prawn: ['Live kuruma-ebi from a dealer who knows you: sweet, still kicking.', 'Your prawns are fine, never alive and kicking.'] };
  Object.keys(SUPNOTE).forEach((c) => { const sp = SUP[c]; if (!sp || !catN(c)) return; if (sp.exec >= 6) notes.push({ k: 'sup_' + c, t: SUPNOTE[c][0] }); else if (sp.exec < 0 && catN(c) >= 3) notes.push({ k: 'suplow_' + c, t: SUPNOTE[c][1] }); });
  // signature
  let sigS = 0, sigFlash = 0, sigNote = null;
  if (menu.sig && menu.items.includes('sig')) {
    const g = menu.sig.sig;
    const skillOk = U.clamp(sk(menu.sig.sk) / 85, 0.4, 1.1);
    const tokyoTaste = g.harmony * (0.5 + g.respect) * skillOk - g.flash * 0.55;
    const seattleTaste = g.harmony * (0.6 + g.respect * 0.6 + g.flash * 0.3) * skillOk - (menu.sig.sig.f === 'gold' ? 0.25 : 0);
    sigS = (loc === 'tokyo' ? tokyoTaste : seattleTaste) * 100;
    sigFlash = g.flash;
    sigNote = g.harmony < 0.5 ? 'Your signature does not hold together. ' + (g.flash > 0.5 ? 'The topping is doing all the talking.' : 'The technique fights the fish.')
      : g.flash > 0.6 && loc === 'tokyo' ? 'The signature looks like a show for cameras. Tokyo critics roll their eyes; tourists post it.'
      : g.flash > 0.6 ? 'The signature is a showstopper. Seattle posts it everywhere; a few critics call it a gimmick.'
      : g.respect > 0.8 ? 'Your signature reads as craft: an Edomae idea pushed one step further.' : 'Your signature is a pleasant idea.';
    notes.push({ k: 'sig', t: sigNote });
  }
  const creativeAdj = sigS * 0.1;
  // luxury: the luxury style needs it, purists punish piling it on
  const lux = items.filter((d) => d.lux).length + (menu.sig && menu.items.includes('sig') ? menu.sig.sig.flash : 0);
  let luxAdj = 0;
  if (style.luxWant) { luxAdj = lux >= style.luxWant ? 6 : -(style.luxWant - lux) * 5; if (lux < style.luxWant) notes.push({ k: 'thinlux', t: 'A "luxury" course with too little luxury on it. Guests paying for caviar want to see caviar.' }); }
  else if (lux > 5) { luxAdj = loc === 'tokyo' ? -(lux - 5) * 4 : -(lux - 5) * 1.5; notes.push({ k: 'chalk', t: 'Luxury on luxury. Critics call this "chalkboard omakase": a template of caviar and toro instead of the day\'s fish.' }); }
  const torch = items.filter((d) => /aburi/i.test(d.en) || (d.sig && d.sig.t === 'aburi')).length;
  if (torch > 2) { luxAdj -= (torch - 2) * 4; notes.push({ k: 'torch', t: 'The blowtorch comes out again and again. Constant searing is the tell of a templated menu.' }); }
  // the rice
  const sh = SHARI.find((x) => x.id === (menu.shari || 'akazu')) || SHARI[0];
  let shariAdj = 0;
  if (sh.id === 'akazu') shariAdj = loc === 'tokyo' ? 4 : 2;
  if (sh.id === 'blend') { const r = sk('rice'); shariAdj = r >= 88 ? 8 : -(88 - r) * 0.5; notes.push({ k: 'blend', t: r >= 88 ? 'Two shari, red and white, each matched to its fish. Few counters can do it.' : 'Two shari every night is too much for your rice hand yet: both come out uneven.' }); }
  const wasabi = menu.wasabi || (loc === 'tokyo' ? 'real' : 'real');
  let wasabiC = 0;
  if (wasabi === 'kona') { shariAdj -= loc === 'tokyo' ? 12 : 5; wasabiC = -0.9; notes.push({ k: 'kona', t: 'Powdered horseradish wasabi at an omakase counter. Anyone who knows, knows.' }); }
  if (style.id === 'nigiri') { const hand = Math.min(sk('rice'), sk('nigiri')); shariAdj += (hand - 88) * 0.8; if (hand < 88) notes.push({ k: 'bare', t: 'Nigiri only leaves nowhere to hide: every flaw in your rice and your hands is on the plate.' }); }
  if (menu.okonomi) notes.push({ k: 'okonomi', t: 'Guests can order extra pieces after the course. Regulars love it; it adds to the bill and the evening.' });
  const fishK = FISH_K[loc] || 1;
  const food = items.reduce((s, d) => s + d.c * (inSeason(d, menu.season) ? 1 : 1.4) * supOf(d).cost, 0) * fishK + (3.4 + sh.c + wasabiC + (opts.riceCost || 0)) * fishK; // + rice, nori, wasabi grated to order (about $200 a pound), gari
  const minutes = Math.round(style.minutes * U.clamp(pieces / (style.id === 'nigiri' ? 20 : style.id === 'kappo' ? 24 : 18), 0.7, 1.35)) + (menu.okonomi ? 12 : 0);
  const menuS = U.clamp(flowS * 0.25 + seasonS * 0.2 + balS * 0.15 + lenS * 0.2 + (closers * 50) * 0.08 + 60 * 0.12 + creativeAdj + luxAdj + shariAdj, 0, 100);
  const quality = U.clamp(exec * 0.6 + menuS * 0.4, 0, 100);
  return { style, items, food, minutes, pieces, nigiri: nig.length, tsumami: tsu.length, flowS, seasonS, balS, lenS, exec, menuS, quality, lux, sigS, sigFlash, shari: sh, okonomi: !!menu.okonomi, notes };
}

/* drinks = { list, pairing, price, n, pour, whisky, beerPrice, somm, cert, corkage } */
function scoreDrinks(drinks, loc, foodPrice) {
  const L = BEV.lists.find((x) => x.id === drinks.list) || BEV.lists[0];
  const P = BEV.pours.find((x) => x.id === drinks.pour) || BEV.pours[0];
  const W = BEV.whisky.find((x) => x.id === drinks.whisky) || BEV.whisky[0];
  const cm = BEV.sakeCostMl[loc];
  const notes = [];
  const expert = drinks.somm ? 1 : drinks.cert ? 0.6 : 0;
  let rev = 0, cost = 0, take = 0, ratingAdj = 0, party = 0, risk = 0;
  const unlimited = drinks.pairing && P.id === 'unlimited';
  if (drinks.pairing) {
    const ml = unlimited ? 420 : drinks.n * P.ml; // guests on unlimited average a little over two gō
    const per = ml * cm;
    const rel = drinks.price / Math.max(1, foodPrice);
    take = U.clamp((unlimited ? 0.7 : 0.36) - (rel - BEV.refRel[loc] * (unlimited ? 0.8 : 1)) * 0.9 + L.pull + expert * 0.06, 0.04, 0.9);
    rev = take * drinks.price; cost = take * per * (unlimited ? 1.25 : 1);
    const pourCost = per / Math.max(1, drinks.price);
    const value = (ml / 60) / Math.max(0.5, drinks.price / BEV.fairPour[loc]);
    ratingAdj += U.clamp((value - 1) * 0.12, -0.18, 0.12) + P.rate * 0.5 + expert * 0.06;
    if (P.id === 'mokkiri') notes.push({ k: 'pour', t: 'The overflowing pours become the thing people mention first.' });
    if (unlimited) { party = 1; risk = loc === 'seattle' ? 0.12 : 0.05; ratingAdj -= 0.08; notes.push({ k: 'unl', t: 'Unlimited sake fills the counter with birthday groups. Critics stay away, and someone always overdoes it.' + (loc === 'seattle' ? ' Washington holds you liable for serving anyone obviously drunk.' : '') }); }
    if (!unlimited && drinks.n * P.ml < 250) notes.push({ k: 'stingy', t: 'A thin pairing: ' + drinks.n + ' small pours. Reviews call it stingy.' });
    if (!unlimited && value < 0.7) notes.push({ k: 'dear', t: 'The pairing is priced well above what the pours are worth. Many skip it.' });
    if (pourCost < 0.18 && !unlimited) notes.push({ k: 'margin', t: 'A fat margin on the pairing: ' + Math.round(pourCost * 100) + '% pour cost (bars average about 20%).' });
    if (pourCost > 0.4 && !unlimited) notes.push({ k: 'thin', t: 'You are pouring away your margin: ' + Math.round(pourCost * 100) + '% pour cost.' });
  }
  // everyone else buys some sake by the gō, beer or tea
  const others = 1 - take;
  const beerP = drinks.beerPrice || BEV.beer[loc].price;
  const beerAdj = U.clamp(1 - (beerP / BEV.beer[loc].price - 1) * 0.8, 0.4, 1.3);
  const alaCarte = others * foodPrice * BEV.drinkShare[loc] * (1 + L.pull + expert * 0.04);
  const beerPer = (loc === 'tokyo' ? 2 : 3) * beerAdj;
  rev += alaCarte + others * beerPer;
  cost += alaCarte * 0.3 + others * beerPer * BEV.beer[loc].cost * (BEV.beer[loc].price / beerP);
  if (W.id !== 'none') { rev += W.perGuest[loc] * (1 + expert * 0.1); cost += W.perGuest[loc] * W.cost; ratingAdj += W.pull * 0.5; }
  if (drinks.corkage) { rev += 0.04 * BEV.corkage[loc] - 0.04 * alaCarte; ratingAdj += 0.02; }
  ratingAdj += L.cred * 0.6;
  if (L.id === 'small' && drinks.pairing) notes.push({ k: 'list', t: 'A pairing from an eight-label list repeats itself by the fifth pour.' });
  if (beerP > BEV.beer[loc].price * 1.4) notes.push({ k: 'beer', t: 'Beer at ' + U.usd(beerP) + ' a bottle gets a mention in every review.' });
  if (W.id === 'rare') notes.push({ k: 'whisky', t: 'Rare Japanese whisky pulls in collectors, but Yamazaki 18 costs you half of what you charge.' });
  const stock = L.stock[loc] + (W.stock ? W.stock[loc] : 0);
  const labor = drinks.somm ? BEV.somm[loc] : 0;
  return { rev, cost, costPct: rev ? cost / rev : 0, take, ratingAdj: U.clamp(ratingAdj, -0.3, 0.3), party, risk, stock, license: BEV.license[loc], labor, unlimited, notes };
}

/* ---------- guest rating ----------
   Tokyo diners read Tabelog (3.5 is good, 4.0 is top tier); Seattle reads Google stars
   (good counters sit between 4.5 and 4.9). Both come from the same 0-5 opinion here. */
function fairPrice(loc, fmt, quality, fame) {
  const base = fmt.check;
  return base * (0.7 + 0.6 * quality / 100) * (1 + Math.min(fmt.premium || 0, Math.max(0, fame - 0.5) * (fmt.premium || 0) * 2));
}
function guestRating(loc, m, d, price, fair) {
  const value = fair / Math.max(1, price);
  let r = 3.0 + 1.8 * U.clamp((m.quality - 55) / 40, -1, 1) + U.clamp((value - 1) * 1.2, -0.6, 0.2) + (d ? d.ratingAdj : 0);
  if (m.minutes > 160) r -= 0.1;
  r = U.clamp(r, 2.5, 5);
  const shown = loc === 'tokyo' ? U.clamp(3.0 + (r - 3.3) * 0.75, 2.9, 4.6) : U.clamp(3.7 + (r - 3.3) * 0.72, 3.4, 4.9);
  return { r, shown: Math.round(shown * 100) / 100, label: loc === 'tokyo' ? 'Tabelog' : 'Google', value };
}

/* review lines guests leave, picked from what you built */
function reviewLines(loc, m, d, rating, price, fair) {
  const out = [];
  const good = rating.r >= 4.2;
  if (m.exec >= 85) out.push(['5', 'The shari was perfect, body warm and falling apart on the tongue.']);
  else if (m.exec < 65) out.push(['3', 'Pieces fell apart, and the rice was uneven from piece to piece.']);
  m.notes.forEach((n) => {
    if (n.k === 'shun') out.push(['5', 'You could tell the month from the menu. Everything at its peak.']);
    if (n.k === 'season') out.push(['3', 'Some of the fish clearly was not in season.']);
    if (n.k === 'flow') out.push(['3', 'Odd order: the otoro came early and the white fish after tasted of nothing.']);
    if (n.k === 'kohada' && loc === 'tokyo') out.push(['3', 'No kohada? At this price?']);
    if (n.k === 'short') out.push(['3', 'Delicious, but I left hungry.']);
    if (n.k === 'long') out.push(['4', 'Wonderful but endless. By the uni I could not taste anything.']);
  });
  if (m.sigS > 60) out.push(['5', loc === 'tokyo' ? 'The chef\'s own piece was the one I keep thinking about.' : 'That signature bite. I have told everyone.']);
  else if (m.sigFlash > 0.6) out.push([loc === 'tokyo' ? '2' : '4', loc === 'tokyo' ? 'Gold leaf and caviar on sushi. For the photos, not for the fish.' : 'Came for the caviar toro I saw online. Worth it for the picture.']);
  if (d) d.notes.forEach((n) => {
    if (n.k === 'pour') out.push(['5', 'The sake overflowed into the masu every time. Felt like being a regular.']);
    if (n.k === 'unl') out.push(['4', 'Unlimited sake! Loud and fun. Not a quiet dinner.']);
    if (n.k === 'stingy') out.push(['3', 'The sake pairing was a few thimbles.']);
    if (n.k === 'dear') out.push(['3', 'Skip the pairing; it costs as much as the food.']);
    if (n.k === 'beer') out.push(['3', 'Beer priced like wine.']);
  });
  if (rating.value < 0.85) out.push(['3', 'Very good, but not ' + U.usd(price) + ' good.']);
  else if (rating.value > 1.15) out.push(['5', 'For this quality the price is a steal. Book now before it goes up.']);
  if (!out.length) out.push([good ? '5' : '4', good ? 'A serious counter. I will be back.' : 'Solid sushi. Nothing to complain about.']);
  return U.shuffle(out).slice(0, 4);
}

function seasonOf(i) { return SEASONS[((i % 4) + 4) % 4]; }

/* skills now: station scores pulled toward what the road years taught you */
function shopSkills(s) {
  const sk = {}; STATIONS.forEach((st) => { sk[st.id] = skillOf(st.id); });
  const m = U.mean(Object.values(sk)), target = s.road ? s.road.skill : m;
  Object.keys(sk).forEach((k) => { sk[k] = U.clamp(Math.round(sk[k] + (target - m) * 0.7), 0, 100); });
  // rolls are their own skill: academies drill them, casual kitchens build them, Edomae shops barely teach them
  sk.rolls = Math.round(s.road && s.road.rolls != null ? s.road.rolls : s.rolls != null ? s.rolls : sk.rice * 0.55);
  return sk;
}

/* a sensible starting menu for a style and season */
function presetMenu(styleId, season) {
  const luxury = styleId === 'luxury';
  const rank = (a, b, prefer) => (inSeason(b, season) - inSeason(a, season)) || ((prefer && prefer.includes(b.id)) - (prefer && prefer.includes(a.id))) || (luxury ? (!!b.lux - !!a.lux) : (!!a.lux - !!b.lux));
  const pick = (sec, n, prefer) => DISHES.filter((d) => d.sec === sec).sort((a, b) => rank(a, b, prefer)).slice(0, n).map((d) => d.id);
  const nig = [];
  const perTier = styleId === 'nigiri' ? { 1: 3, 2: 3, 3: 2, 4: 2, 5: 3, 6: 2, 7: 2 } : { 1: 2, 2: 2, 3: 1, 4: 2, 5: 2, 6: 1, 7: 2 };
  [1, 2, 3, 4, 5, 6, 7].forEach((t) => {
    DISHES.filter((d) => d.sec === 'nigiri' && d.t === t).sort((a, b) => rank(a, b, ['kohada', 'zuke', 'anago'])).slice(0, perTier[t]).forEach((d) => nig.push(d.id));
  });
  const nTsu = { nigiri: 0, tsumami: 5, kappo: 8, luxury: 4 }[styleId] || 5;
  const items = [];
  if (styleId !== 'nigiri') items.push(...pick('saki', 1), ...pick('tsumami', nTsu, luxury ? ['kani', 'nodoguro', 'awabi'] : ['chawan', 'ankimo', 'sashimi', 'tako', 'aged']));
  items.push(...nig, ...pick('owan', 1, ['akadashi']), ...pick('maki', 1, luxury ? ['torotaku'] : ['kanpyo']), ...pick('tamago', 1, ['dashimaki']));
  if (styleId !== 'nigiri') items.push(...pick('mizu', 1, luxury ? ['melon', 'mango'] : ['monaka']));
  return items;
}

/* swap out-of-season dishes for in-season ones from the same section and tier */
function seasonalSwap(menu, season) {
  const used = new Set(menu.items);
  menu.items = menu.items.map((id) => {
    if (id === 'sig') return id;
    const d = DISHES.find((x) => x.id === id);
    if (!d || inSeason(d, season)) return id;
    const alt = DISHES.find((x) => x.sec === d.sec && (d.t == null || x.t === d.t) && !used.has(x.id) && x.s && x.s.includes(season))
      || DISHES.find((x) => x.sec === d.sec && (d.t == null || x.t === d.t) && !used.has(x.id) && inSeason(x, season));
    if (!alt) return id;
    used.add(alt.id); used.delete(id); return alt.id;
  });
  return menu;
}

/* what one season would look like (expected values, no randomness): for the planner */
function seasonPreview(s, sh) {
  return simSeason(s, sh, () => 0.5, { dry: true });
}

/* your master introduces you to his brokers; a noren-wake branch inherits them */
function startSup(r, o) {
  const noren = o && o.offer && o.offer.kind === 'noren', master = r.lineage === 'master';
  const sup = {};
  SHOP.sup.cats.forEach((c) => { sup[c.id] = { tier: 'dist', trust: 0 }; });
  if (master || noren) { ['tuna', 'special', 'fresh', 'rice'].forEach((c) => { sup[c] = { tier: 'broker', trust: noren ? 55 : 35 }; }); ['shell', 'prawn'].forEach((c) => { sup[c] = { tier: 'broker', trust: noren ? 40 : 15 }; }); }
  return sup;
}
function ensureSup(sh, s) {
  if (!sh.sup) { sh.sup = startSup(s.road, s.road.opened); if (sh.tuna) sh.sup.tuna = { tier: sh.tuna === 'elite' ? 'top' : sh.tuna, trust: sh.trust || 0 }; }
  const o = sh.sup;
  if (o.fish) { o.special = o.special || Object.assign({}, o.fish); o.fresh = o.fresh || Object.assign({}, o.fish); delete o.fish; }
  if (o.uni) { const oldShell = o.shell; o.shell = Object.assign({}, o.uni); if (oldShell && !o.prawn) o.prawn = Object.assign({}, oldShell); delete o.uni; }
  SHOP.sup.cats.forEach((c) => { if (!o[c.id]) o[c.id] = { tier: 'dist', trust: 0 }; });

}
function supName(loc, cat, tier) { const N = SHOP.sup.names[loc]; if (tier === 'dist') return cat === 'rice' ? (loc === 'tokyo' ? 'Bulk rice from a wholesaler' : 'Calrose from a distributor') : N.dist; return N[tier][cat]; }
function supOk(s, sh, cat, tierId) {
  const T = SHOP.sup.tiers.find((x) => x.id === tierId);
  const tr = (ensureSup(sh, s)[cat] || {}).trust || 0;
  if (cat === 'rice' && tierId === 'broker') return { ok: true }; // anyone can buy a dealer's blend
  if (tr < T.need.trust) return { ok: false, why: 'trust ' + T.need.trust + ' needed, you have ' + Math.round(tr) };
  if (s.road.rep < T.need.rep && s.road.lineage !== 'master') return { ok: false, why: 'reputation ' + T.need.rep + ' needed' };

}
/* the first category matching a test, in a fixed order, for events */
function supPick(sh, test) { const c = SHOP.sup.cats.find((x) => sh.sup && sh.sup[x.id] && test(sh.sup[x.id], x.id)); return c ? c.id : null; }
const SUPCAT_EN = { tuna: 'tuna', special: 'specialty', fresh: 'fresh-fish', shell: 'uni and shellfish', prawn: 'prawn', rice: 'rice' };
function staffCost(sh) { return Object.keys(SHOP.staff).reduce((t, k) => t + (sh.staff && sh.staff[k] ? SHOP.staff[k].pay[sh.loc] : 0), 0); }

/* run one season. rnd: random source; opt.event: the event this season, opt.choice: what you chose */
function simSeason(s, sh, rnd = Math.random, opt = {}) {
  const r = s.road, loc = sh.loc;
  const fmt = ROAD.formats[loc].find((f) => f.id === sh.fmt);
  const P = SHOP.policies.find((p) => p.id === sh.policy);
  const season = seasonOf(sh.q).id;
  sh.menu.season = season;
  const skills = shopSkills(s);
  const ev = opt.event || null, ch = opt.choice;
  const fx = { exec: 0, foodK: 1, cap: 1, buzz: 0, rating: 0, reg: 0, churn: 0, cash: 0, demand: 1, rep: 0, net: 0, note: null };
  if (ev && ev.apply) ev.apply(fx, ch, sh, s);
  const st = sh.staff || {};
  const sup = ensureSup(sh, s), supOpt = {};
  const am = sh.am && sh.am.q === sh.q ? sh.am : null; // what you did at the market this season
  SHOP.sup.cats.forEach((c) => { const T = SHOP.sup.tiers.find((x) => x.id === sup[c.id].tier) || SHOP.sup.tiers[0]; supOpt[c.id] = { exec: T.exec + ((fx.supB && fx.supB[c.id]) || 0) + (am ? am.supB[c.id] || 0 : 0) + (sh.market && (c.id === 'fresh' || c.id === 'special') ? 1 : 0), cost: T.cost * ((fx.supCost && fx.supCost[c.id]) || 1) * (am ? am.supCost[c.id] || 1 : 1) }; });
  const riceT = { dist: { exec: -1, cost: 0 }, broker: { exec: 1, cost: 0.4 }, top: { exec: 3, cost: 0.8 } }[sup.rice.tier];
  const m = scoreMenu(sh.menu, loc, skills, { sup: supOpt, riceCost: riceT.cost, execB: riceT.exec + (st.nibante ? 2 : 0) + (st.junior ? 1 : 0) - (sh.branches || 0) * 4 - (sh.media ? 2 : 0) - (sh.market && !st.nibante ? 1 : 0) });
  m.exec = U.clamp(m.exec + fx.exec, 0, 100);
  // a second chef keeps the pace; alone, everything takes longer
  m.minutes = Math.round(m.minutes * (st.nibante ? 0.92 : 1) * (!st.nibante && !st.junior ? 1.08 : 1));
  const quality = U.clamp(m.exec * 0.6 + m.menuS * 0.4 + (opt.dry ? 0 : (rnd() - 0.5) * 6), 0, 100);
  const fame = fameOf(s);
  const fair = fairPrice(loc, fmt, quality, fame + sh.stars * 0.15) * (m.style.fairK || 1) * (sh.intl && loc === 'tokyo' ? SHOP.intlFair : 1);
  const d = scoreDrinks(sh.drinks, loc, sh.price);
  const rt = guestRating(loc, Object.assign({}, m, { quality }), d, sh.price, fair);
  // Tokyo diners ask "which shop, how many years": no lineage costs you with the critics there
  const pedigree = loc === 'tokyo' && !['master'].includes(r.lineage) && !r.retrained && !(r.opened.offer && r.opened.offer.kind === 'noren') ? -0.15 : 0;
  const hosting = st.okami ? 0.02 : -0.08;
  const twoTierHit = sh.twoTier && sh.intl && loc === 'tokyo' ? -0.06 : 0;
  let rSeason = U.clamp(rt.r + fx.rating + pedigree + hosting + twoTierHit + (sh.menu.okonomi ? 0.03 : 0) + (opt.dry ? 0 : (rnd() - 0.5) * 0.12), 2.5, 5);
  // seats
  const turns = m.minutes <= 60 ? 3 : m.minutes <= 100 ? 2.5 : 2;
  const capacity = Math.round(fmt.seats * turns * fmt.nights * SHOP.weeks * fx.cap);
  // regulars first
  const regWant = sh.regulars * SHOP.visits * SHOP.party;
  const regSeats = Math.min(regWant, capacity * P.regCap);
  // the public: fame, rating, price, buzz, mystique
  const shownR = sh.rating != null ? sh.rating : rSeason;
  const priceTerm = Math.pow(fair / Math.max(1, sh.price), 2);
  const counter = fmt.id === 'omakase';
  // counters live on the chef's name; neighbourhood and casual places live on location, value and walk-ins
  const pull = counter ? SHOP.demandK * Math.pow(0.1 + fame, 1.2) * Math.exp((shownR - 4.0) * 1.5) * (1 + sh.buzz)
    : SHOP.walkK * (0.75 + 0.35 * fame) * Math.exp((shownR - 3.9) * 0.9) * (1 + sh.buzz * 0.5);
  const intl = sh.intl && loc === 'tokyo';
  const pubWant = capacity * pull * P.mystique * fx.demand * (sh.stars ? 1 + sh.stars * 0.5 : 1) * (sh.deposit ? SHOP.depositDemand : 1) * (intl ? SHOP.intlLift : 1);
  const left = capacity - regSeats;
  let pubSeats = Math.min(pubWant, capacity * P.publicCap, left);
  // seats regulars did not take are released late, and only partly filled
  if (P.id !== 'open' && left > pubSeats) pubSeats += Math.min(left - pubSeats, Math.max(0, pubWant - pubSeats)) * (P.id === 'few' ? 0.5 : 0);
  const intro = Math.min(capacity - regSeats - pubSeats, sh.regulars * P.intro * 1.8 * (0.6 + 0.4 * P.mystique) * (st.okami ? 1.1 : 1));
  const noShow = pubSeats * P.noShow[loc] * (sh.deposit || intl ? SHOP.depositNoShow : 1) * (st.okami ? 0.7 : 1);
  const covers = Math.max(0, Math.round(regSeats + pubSeats + intro - noShow));
  const occ = capacity ? covers / capacity : 0;
  // regulars won and lost
  const conv = (0.015 + 0.035 * U.clamp((rSeason - 3.8) / 0.9, 0, 1) + r.net / 100 * 0.01) * (P.id === 'few' ? 1.25 : 1) * (intl ? 0.6 : 1); // tourists rarely come back
  const gained = pubSeats * conv / SHOP.party + intro * 0.3 / SHOP.party + fx.reg;
  const hike = Math.max(0, sh.price / Math.max(1, sh.lastPrice) - 1);
  const churnRate = U.clamp(SHOP.churn + Math.max(0, 4.1 - rSeason) * 0.08 + hike * 0.35 - (P.id === 'regulars' ? 0.01 : 0) + fx.churn + (sh.year >= 4 ? 0.01 : 0) - (st.okami ? 0.006 : 0) + (intl ? 0.008 : 0), 0.01, 0.5);
  const lost = sh.regulars * churnRate;
  // money
  const regShare = covers ? (regSeats + intro) / Math.max(1, regSeats + pubSeats + intro) : 0;
  const bevPer = d.rev * (m.style.bevK || 1) * (1 + (SHOP.regBevLift - 1) * regShare) * (st.okami ? 1.05 : 1);
  const okonomi = sh.menu.okonomi ? sh.price * 0.08 * (0.6 + 0.8 * regShare) : 0; // extra pieces ordered after the course
  const tourists = intl ? pubSeats * 0.6 : 0;
  const foodRev = covers * (sh.price + okonomi) + (sh.twoTier && intl ? tourists * sh.price * 0.2 : 0), bevRev = covers * bevPer;
  const foodCost = covers * (counter ? m.food + okonomi * 0.4 : sh.price * fmt.food) * fx.foodK, bevCost = covers * d.cost * (m.style.bevK || 1) * (1 + (SHOP.regBevLift - 1) * regShare);
  // base crew (dishwashing, a server) plus the people you chose to hire
  const labor = fmt.labor * fmt.seats * fmt.turns * fmt.nights * 52 * 0.85 * fmt.check / 4 * 0.55 * (0.6 + 0.4 * turns / fmt.turns) + d.labor / 4 + staffCost(sh) / 4;
  const rent = fmt.rent * (sh.rentK || 1) / 4, other = fmt.other * (foodRev + bevRev);
  const debt = r.opened.pj.debtService / 4;
  const other2 = SHOP.overhead[loc] * (foodRev + bevRev) + 0.04 * bevRev + (intl ? tourists * sh.price * 0.05 : 0);
  const side = (sh.media ? (loc === 'tokyo' ? 6000 : 9000) : 0) + (sh.branchProfit || 0) * (sh.branches || 0) + (sh.licensed ? sh.licenseFee || 0 : 0);
  const profit = foodRev + bevRev - foodCost - bevCost - labor - rent - other - other2 - debt + fx.cash + side;
  const share = r.opened.offer && r.opened.offer.equity ? 1 - r.opened.offer.equity : 1;
  const ownerTake = profit > 0 ? profit * (1 - SHOP.tax[loc]) * share : profit;
  // reviews: public guests write far more than regulars do
  const newReviews = pubSeats * 0.05 + (regSeats + intro) * 0.008 + 1;
  const tabelogShut = loc === 'tokyo' && P.id === 'regulars' ? -0.06 : 0;
  const reviewR = rSeason + (regShare > 0.6 ? 0.06 : 0) + tabelogShut;
  // buzz: scarcity, signature photos, events; fades every season
  const scarcity = pubWant / Math.max(1, capacity * P.publicCap + (P.publicCap ? 0 : 1));
  const buzz = U.clamp(sh.buzz * 0.78 + (scarcity > 1.5 ? 0.08 * Math.log(scarcity) : 0) + m.sigFlash * (loc === 'seattle' ? 0.1 : 0.06) + (P.id === 'regulars' && sh.regulars > 120 ? 0.05 : 0) + fx.buzz, 0, 1.6);
  const res = {
    season, year: sh.year, q: sh.q, m, d, quality, fair, rSeason, rt, capacity, covers, occ, regSeats: Math.round(regSeats), pubSeats: Math.round(pubSeats), intro: Math.round(intro), noShow: Math.round(noShow),
    pubWant: Math.round(pubWant), gained: Math.round(gained), lost: Math.round(lost), foodRev, bevRev, bevPer, foodCost, bevCost, labor, rent, other: other + other2, debt, profit, ownerTake,
    newReviews: Math.round(newReviews), reviewR, buzz, turns, fx, am: am && am.lines.length ? am.lines : null,
  };
  if (opt.dry) return res;
  // commit
  sh.regulars = Math.max(0, sh.regulars + gained - lost);
  sh.ratingSum += reviewR * newReviews; sh.reviews += newReviews;
  const avg = sh.ratingSum / sh.reviews;
  sh.rating = avg;
  sh.buzz = buzz;
  sh.lastPrice = sh.price;
  s.savings += ownerTake;
  r.rep = U.clamp(r.rep + (rSeason - 3.9) * 5 + fx.rep + sh.stars * 1.5, 0, 100);
  r.net = U.clamp(r.net + sh.regulars / 200 + fx.net, 0, 100);

  // trust with each fishmonger: years of buying, turning up at the market, paying on time
  SHOP.sup.cats.forEach((c) => {
    const x = sup[c.id];
    let g = x.tier === 'dist' ? 0 : x.tier === 'top' ? 4 : 6;
    if (g && sh.market) g = g * 1.5 + (skills.market >= 80 ? 1 : 0);
    x.trust = U.clamp(x.trust + g + ((fx.trustC && fx.trustC[c.id]) || 0) + (fx.trustAll || 0) - (s.savings < 0 ? 10 : 0), 0, 100);

}

function pickEvent(s, sh, rnd = Math.random) {
  if (rnd() < 0.35) return null;
  const pool = SHOP_EVENTS.filter((e) => e.when(s, sh));
  const tot = pool.reduce((t, e) => t + e.w, 0); let x = rnd() * tot;
  for (const e of pool) { x -= e.w; if (x <= 0) return e; }
  return null;
}

/* the critic's verdict, after the season is run */
function criticVerdict(s, sh, res) {
  if (!res.fx.critic) return null;
  if (sh.loc === 'tokyo') {
    if (sh.policy === 'regulars') return { good: false, text: 'The inspectors could not get a seat. A counter the public cannot book is "out of our scope", the guide said of Jiro and Saito in 2019.' };
    const need = [88, 93, 96][sh.stars];
    if (sh.stars < 3 && res.quality >= need && res.m.exec >= need - 2 && res.rSeason >= 4.2) { sh.stars++; sh.buzz = Math.min(1.6, sh.buzz + 0.5); return { good: true, text: 'The Michelin Guide Tokyo gives ' + sh.name + ' ' + (sh.stars === 1 ? 'one star' : sh.stars + ' stars') + '.' }; }
    return { good: false, text: 'The guide comes out. ' + sh.name + ' is not in it this year.' };
  }
  if (res.quality >= 86 && res.rSeason >= 4.3) { sh.award = sh.award ? 'beard' : 'times'; sh.buzz = Math.min(1.6, sh.buzz + 0.4); return { good: true, text: sh.award === 'beard' ? sh.name + ' is a James Beard semifinalist for Outstanding Restaurant.' : 'The Seattle Times review is a rave: "the most serious sushi in the city".' }; }
  return { good: false, text: 'The review calls ' + sh.name + ' "very good, not yet essential".' };
}

/* =====================================================================
   Morning at the market (朝の仕入れ). Once a season you walk your own
   brokers' stalls. Toyosu brokers "cast" fish to the chefs they know:
   one chef's rice acidity, another's preferred firmness. They hold a

   unsold stock. Chefs who come in person, judge fish well and say
   honestly how last week's fish ate end up with the better fish.
   Pure logic first (also used by tools/shopsim.js), then the screen.
   ===================================================================== */
const AM = {
  houses: [['Marukō', '丸幸'], ['Yamasan', '山三'], ['Kanemasa', '金政'], ['Daisho', '大正'], ['Ichimaru', '一丸'], ['Uoshin', '魚新'], ['Marusei', '丸清'], ['Kitamura', '北村'], ['Yamamitsu', '山光'], ['Maruhide', '丸秀'], ['Hokuyō', '北洋'], ['Daiichi', '大一']],
  riceHouses: [['Matsuya', '松屋'], ['Komeyoshi', '米善'], ['Echigoya', '越後屋']],
  people: [['Hayashi', 0], ['Ōta', 0], ['Mori', 0], ['Kanda', 0], ['Sugimoto', 0], ['Noda', 1], ['Ishikawa', 0], ['Okabe', 1], ['Fujii', 0], ['Sakai', 0], ['Imai', 1], ['Kudō', 0]],
  seattle: {
    tuna: { broker: ['Ken', 'at a Toyosu tuna exporter', 'wa', 0], top: ['Aya', 'exporter for a top Toyosu tuna house', 'wa', 1] },
    special: { broker: ['Mai', 'at a Toyosu specialty exporter', 'wa', 1], top: ['Sho', 'exporter for a top specialty house', 'wa', 0] },
    fresh: { broker: ['Ray', 'skipper of the Northern Dawn', 'dock', 0], top: ['Ingrid', 'skipper of the Kestrel', 'dock', 1] },
    shell: { broker: ['Dana', 'a sea urchin diver', 'dive', 1], top: ['Hiro', 'at a live shellfish house', 'wa', 0] },
    prawn: { broker: ['Lena', 'on a spot prawn boat', 'dock', 1], top: ['Tomas', 'first pick off the prawn boats', 'dock', 0] },
    rice: { broker: ['Yuki', 'at a Japanese rice importer', 'wa', 1], top: ['Kobayashi-san', 'a Tokyo rice master who ships to you', 'wa', 0] },
  },
  catShort: { tuna: 'tuna', special: 'specialty fish', fresh: 'everyday fish', shell: 'uni and shellfish', prawn: 'prawns and octopus', rice: 'rice' },
};

function amHash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const amCap = (t) => t.charAt(0).toUpperCase() + t.slice(1);

/* a face for a broker: deterministic from a seed */
function amFace(seed, woman, wear) {
  const r = seeded(seed);
  const pick = (a) => a[Math.floor(r() * a.length)];
  const skin = pick(['#f3d2b3', '#eec39c', '#e3b38c', '#f5d9c0', '#d9a57e']);
  const hair = woman ? pick(['#2b2420', '#3a2b22', '#5a4636']) : pick(['#2b2420', '#3a332e', '#8d877f', '#a8a29a']);
  const hats = wear === 'bib' ? ['beanie', 'beanie', 'cap'] : wear === 'wet' ? ['hood'] : wear === 'shirt' ? [null] : woman ? [null, null, 'cap'] : ['cap', 'cap', 'towel', null];
  return { skin, hair, woman: !!woman, wear: wear || 'rubber', hat: pick(hats), hatC: pick(['#26355e', '#2f5a3f', '#7a2e2a', '#e9e4d6', '#c45a2a']), glasses: r() < 0.3, stubble: !woman && r() < 0.4, pencil: wear === 'rubber' && r() < 0.5 };
}

/* your broker in a trade at a tier: a named person, kept for the life of the shop */
function amBroker(sh, cat, tier) {
  sh.brokers = sh.brokers || {};
  const key = cat + ':' + tier;
  if (sh.brokers[key]) return sh.brokers[key];
  let b;
  if (tier === 'dist') {
    b = sh.loc === 'tokyo' ? { name: 'The clerk', short: 'The wholesaler', sub: cat === 'rice' ? 'a bulk rice wholesaler' : 'a general wholesaler', ch: 'stall', face: amFace(amHash(key + sh.name), 0, 'rubber') }
      : { name: 'Jeff', short: 'Jeff', sub: 'a sales rep at the distributor', ch: 'door', face: amFace(amHash('jeff' + sh.name), 0, 'shirt') };
  } else if (sh.loc === 'seattle') {
    const [name, role, ch, w] = AM.seattle[cat][tier];
    b = { name, short: name, sub: role, ch, face: amFace(amHash(name + cat), w, ch === 'wa' ? 'shirt' : ch === 'dive' ? 'wet' : 'bib') };
  } else {
    const used = Object.values(sh.brokers);
    const pool = AM.people.filter((p) => !used.some((u) => u.name === p[0] + '-san'));
    const hpool = (cat === 'rice' ? AM.riceHouses : AM.houses).filter((h) => !used.some((u) => u.house === h[0]));
    const r = seeded(amHash(key + sh.name));
    const p = pool.length ? pool[Math.floor(r() * pool.length)] : AM.people[0];
    const h = hpool.length ? hpool[Math.floor(r() * hpool.length)] : AM.houses[0];
    b = { name: p[0] + '-san', short: h[0], house: h[0], kanji: h[1], sub: h[0] + ' ' + h[1], ch: 'stall', face: amFace(amHash(p[0] + key), p[1], cat === 'rice' ? 'shirt' : 'rubber') };
  }
  sh.brokers[key] = b;
  return b;
}

/* which fish (or box) a trade shows you this season */
function amKind(cat, season, rnd) {
  if (cat === 'tuna') return 'tuna';
  if (cat === 'shell') return 'uni';
  if (cat === 'prawn') return rnd() < 0.5 ? 'ebi' : 'tako';
  if (cat === 'special') return { spring: 'madai', summer: 'kohada', autumn: 'kohada', winter: 'kinmedai' }[season];
  return { spring: 'katsuo', summer: rnd() < 0.5 ? 'aji' : 'iwashi', autumn: 'saba', winter: 'buri' }[season];
}
function amEn(kind) { return { tuna: 'tuna', uni: 'uni', ebi: 'kuruma-ebi', tako: 'octopus' }[kind] || kind; }

/* what can happen at a stall. fx: t trust, b execution on that trade's dishes this season, c cost multiplier */

/* the outcome of an eye test: you picked the best, the middle or the tired one */
function amEyeFx(c, role, noticed) {
  const tuna = c.kind === 'tuna', uni = c.kind === 'uni';
  if (c.tier === 'dist') {
    if (role === 'best') return noticed
      ? { fx: { t: 6, b: 2 }, mood: 'pleased', after: c.loc === 'tokyo' ? 'A broker from two aisles over watched you choose. "You have an eye. Come and see me."' : 'Word gets around: a broker at an exporter hears about the chef who sends back cases. "Call me."', sum: 'picked the best on the ice and got noticed' }
      : { fx: { b: 2 }, mood: 'neutral', after: c.loc === 'tokyo' ? 'You take the best fish on the ice. Nobody here notices.' : 'You keep the good case and send two back.', sum: 'picked the best of the delivery' };
    if (role === 'mid') return { fx: {}, mood: 'neutral', after: 'Fine. Not the best one there.', sum: 'picked a decent one' };
    return { fx: { b: -2 }, mood: 'neutral', after: c.loc === 'tokyo' ? 'Nobody stops you buying a tired fish here.' : 'Jeff is happy to leave the tired case.', sum: 'took a tired one' };
  }
  if (role === 'best') return { fx: { t: 4, b: 3 }, mood: 'pleased', after: '"Good eye. I would have picked the same one."', sum: 'picked the best one at a glance' };
  if (role === 'mid') return { fx: { t: 1 }, mood: 'neutral', after: '"Not bad." A finger taps another one. "This one was better, though."', sum: 'picked a decent one' };
  return { fx: { t: -2, b: -1 }, mood: 'stern', after: tuna ? '"That one has yake. Look at the grey." Your block comes from a better fish.' : uni ? '"That box is three days old." You get another one.' : '"That one? Look at the eye." It gets swapped for a better one without another word.', sum: 'picked a tired one and got corrected' };
}

/* the line under a broker's name */
function amRole(b, st) {
  if (st.tier === 'dist' || !b.house) return amCap(b.sub);
  const noun = { tuna: 'tuna', special: 'specialty fish', fresh: 'fresh-fish', shell: 'shellfish and uni', prawn: 'prawn and octopus', rice: 'rice' }[st.cat];
  return b.house + ', ' + (st.tier === 'top' ? 'the top ' + noun + ' dealer' : 'your ' + noun + ' broker');
}

function amCtx(sh, st) {
  const x = ensureSup(sh, S)[st.cat];
  const b = amBroker(sh, st.cat, st.tier);
  return { sh, loc: sh.loc, cat: st.cat, tier: st.tier, trust: x.trust, kind: st.kind, b, ch: b.ch, storm: st.storm, season: seasonOf(sh.q).id };
}

/* plan this season's morning: which stalls, and what happens at each */
function amStart(sh, rnd = Math.random) {
  const season = seasonOf(sh.q).id;
  const sup = ensureSup(sh, S);
  const count = {};
  sh.menu.items.map((id) => dishById(id, sh.menu.sig)).filter(Boolean).forEach((d) => { const c = fishCat(d); if (c) count[c] = (count[c] || 0) + 1; });
  let cats = ['tuna', 'special', 'fresh', 'shell', 'prawn'].filter((c) => count[c] && !(c === 'prawn' && sup[c].tier === 'dist'));
  if (!cats.length) cats = ['fresh'];
  const picked = cats.includes('tuna') ? ['tuna'] : [];
  const rest = cats.filter((c) => c !== 'tuna');
  while (picked.length < 3 && rest.length) {
    const tot = rest.reduce((s, c) => s + (count[c] || 1), 0);
    let r = rnd() * tot, i = 0;
    for (; i < rest.length - 1; i++) { r -= count[rest[i]] || 1; if (r <= 0) break; }
    picked.push(rest.splice(i, 1)[0]);
  }
  const storm = rnd() < (season === 'autumn' ? 0.35 : season === 'summer' ? 0.18 : 0.08);
  let stormLeft = storm;
  const used = {};
  const stops = picked.map((cat) => {
    const x = sup[cat];
    const st = { cat, tier: x.tier, kind: amKind(cat, season, rnd), seed: Math.floor(rnd() * 1e6), storm: stormLeft };
    const c = amCtx(sh, st);
    const ok = Object.keys(AM_SIT).filter((k) => (used[k] || 0) < (k === 'eye' ? (c.tier === 'dist' ? 3 : 2) : 1) && AM_SIT[k].ok(c));
    let sit;
    if (!ok.length) sit = AM_SIT.eye.ok(c) ? 'eye' : 'help';
    else if (stormLeft && ok.includes('storm')) sit = 'storm';
    else {
      const ws = ok.map((k) => Math.max(0, AM_SIT[k].w(c))), tot = ws.reduce((s, v) => s + v, 0);
      let r = rnd() * tot; sit = ok[ok.length - 1];
      for (let i = 0; i < ok.length; i++) { r -= ws[i]; if (r <= 0 && ws[i] > 0) { sit = ok[i]; break; } }
    }
    if (sit === 'storm') stormLeft = false;
    st.storm = sit === 'storm';
    used[sit] = (used[sit] || 0) + 1;
    st.sit = sit;
    return st;
  });
  return { q: sh.q, stops, i: 0, supB: {}, supCost: {}, lines: [], done: false, storm };
}

/* apply a choice: trust now, fish and cost for this season */
function amApply(sh, st, res) {
  const am = sh.am, fx = res.fx || {};
  const x = ensureSup(sh, S)[st.cat];
  const mk = sh.market ? 1 : 0.75; // brokers warm faster to a face they see every day
  const t = fx.t > 0 ? Math.round(fx.t * mk) : (fx.t || 0);
  const before = Math.round(x.trust);
  x.trust = U.clamp(x.trust + t, 0, 100);
  if (fx.b) am.supB[st.cat] = U.clamp((am.supB[st.cat] || 0) + fx.b, -4, 6);
  if (fx.c) am.supCost[st.cat] = (am.supCost[st.cat] || 1) * fx.c;
  const b = amBroker(sh, st.cat, st.tier);
  const parts = [];
  if (t) parts.push('trust ' + (t > 0 ? '+' : '') + t);
  if (fx.b) parts.push(AM.catShort[st.cat] + (fx.b > 0 ? ' better' : ' weaker') + ' this season');
  if (fx.c && fx.c !== 1) parts.push(Math.round(Math.abs(fx.c - 1) * 100) + '% ' + (fx.c > 1 ? 'dearer' : 'cheaper'));
  am.lines.push({ who: st.tier === 'dist' ? b.short : b.name, cat: st.cat, text: amCap(res.sum || ''), fx: parts.join(', '), t, before, after: Math.round(x.trust) });
  am.i++;
  if (am.i >= am.stops.length) am.done = true;
  return { t, before, after: Math.round(x.trust), parts };
}

/* a typical player's morning, for the simulator */
function amAuto(sh, rnd) {
  sh.am = amStart(sh, rnd);
  sh.am.stops.forEach((st) => {
    const c = amCtx(sh, st);
    if (st.sit === 'eye') { const r = rnd(); amApply(sh, st, amEyeFx(c, r < 0.5 ? 'best' : r < 0.85 ? 'mid' : 'worst', rnd() < 0.4)); }
    else { const m = AM_SIT[st.sit].make(c); amApply(sh, st, rnd() < 0.75 ? m.choices[0] : m.choices[1]); }
  });
}

/* ===================================================================== pictures */
function amIce(ctx, w, h, seed) {
  ctx.fillStyle = '#dfe8ec'; ctx.fillRect(0, 0, w, h);
  const r = seeded(seed); ctx.fillStyle = 'rgba(255,255,255,.75)';
  for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.ellipse(r() * w, r() * h, 5 + r() * 9, 3 + r() * 5, r() * 3, 0, 7); ctx.fill(); }
}
function amTail(ctx, cx, cy, R, t) {
  ctx.fillStyle = '#2b3138'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(246,226,214,' + (0.6 + t.fat * 0.4) + ')'; ctx.beginPath(); ctx.arc(cx, cy, R * 0.93, 0, 7); ctx.fill();

  ctx.fillStyle = 'rgb(' + rr + ',' + gg + ',' + bb + ')'; ctx.beginPath(); ctx.arc(cx, cy, meat, 0, 7); ctx.fill();

  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(cx, cy, meat * (0.4 + i * 0.15), 0.3 + i, 2.6 + i); ctx.stroke(); }
  const rs = seeded(t.seed);
  if (t.yake) { ctx.fillStyle = 'rgba(170,150,150,' + (0.5 * t.yake) + ')'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(cx + (rs() - 0.5) * meat, cy + (rs() - 0.5) * meat, meat * 0.22, meat * 0.15, rs() * 3, 0, 7); ctx.fill(); } }
  ctx.fillStyle = '#e9e1d6'; ctx.beginPath(); ctx.arc(cx, cy, R * 0.08, 0, 7); ctx.fill();
}
function amBlock(ctx, w, h) {
  ctx.fillStyle = '#3a3330'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#f3efe6'; ctx.beginPath(); ctx.ellipse(w / 2, h / 2 + 8, w * 0.36, h * 0.36, 0, 0, 7); ctx.fill();
  const x = w / 2 - 82, y = h / 2 - 24, bw = 164, bh = 48;
  const g = ctx.createLinearGradient(x, 0, x + bw, 0); g.addColorStop(0, '#b52f3d'); g.addColorStop(1, '#e38a91');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, bw, bh, 6) : ctx.rect(x, y, bw, bh); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, bw, bh); ctx.clip();
  ctx.strokeStyle = 'rgba(255,240,236,.55)'; ctx.lineWidth = 1.6;
  for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(x + 30 + i * 16, y - 4); ctx.quadraticCurveTo(x + 22 + i * 16, y + bh / 2, x + 34 + i * 16, y + bh + 4); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(39,33,28,.5)'; ctx.lineWidth = 1.2; ctx.strokeRect(x, y, bw, bh);
}
function amUni(ctx, w, h, f, seed) {
  ctx.fillStyle = '#2e3a4f'; ctx.fillRect(0, 0, w, h);
  const bx = w * 0.12, by = h * 0.12, bw = w * 0.76, bh = h * 0.76;
  ctx.fillStyle = '#c9a46e'; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#e6cfa1'; ctx.fillRect(bx + 6, by + 6, bw - 12, bh - 12);
  const r = seeded(seed || 5);
  const col = (k) => { const a = [245, 160, 40], b = [176, 112, 58]; return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',') + ')'; };
  const k = U.clamp((0.95 - f) / 0.55, 0, 1);
  if (k > 0.2) { ctx.fillStyle = 'rgba(140,80,30,' + (0.28 * k) + ')'; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.ellipse(bx + 20 + r() * (bw - 40), by + 14 + r() * (bh - 28), 22, 9, 0, 0, 7); ctx.fill(); } }
  const rows = 3, per = 7, cw = (bw - 20) / per, ch = (bh - 16) / rows;
  for (let row = 0; row < rows; row++) for (let i = 0; i < per; i++) {
    const cx = bx + 10 + cw * (i + 0.5) + (row % 2 ? cw * 0.18 : 0), cy = by + 8 + ch * (row + 0.5);
    const rx = cw * 0.52 * (1 + k * 0.12), ry = ch * 0.42 * (1 - k * 0.28);
    ctx.save(); ctx.translate(cx, cy + k * 3); ctx.rotate(-0.35);
    ctx.fillStyle = col(k * (0.8 + r() * 0.4));
    ctx.beginPath();
    for (let a = 0; a <= 24; a++) { const t = a / 24 * Math.PI * 2; const wob = 1 + (k * 0.18) * Math.sin(t * 3 + r() * 6); ctx.lineTo(Math.cos(t) * rx * wob, Math.sin(t) * ry * wob); }
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 * Math.max(0, f - 0.5)) + ')'; ctx.beginPath(); ctx.ellipse(-rx * 0.3, -ry * 0.35, rx * 0.25, ry * 0.18, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
}
function amPrawns(ctx, w, h, seed) {

    ctx.fillStyle = '#a88e6c'; ctx.beginPath(); ctx.ellipse(-26, 4, 10, 7, 0.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7a6550'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-32, 6); ctx.quadraticCurveTo(-60, 20, -70, -10); ctx.moveTo(-32, 8); ctx.quadraticCurveTo(-55, 30, -50, 40); ctx.stroke();
    ctx.fillStyle = '#5b6aa0'; ctx.beginPath(); ctx.moveTo(26, 8); ctx.lineTo(36, 18); ctx.lineTo(22, 20); ctx.closePath(); ctx.fill();

}
function amTako(ctx, w, h, seed) {

  for (let i = 0; i < 8; i++) {
    const a = Math.PI * (0.08 + i * 0.12), R = i % 2 ? 92 : 118;
    const ex = cx + Math.cos(a) * R, ey = cy + 18 + Math.sin(a) * 34;
    ctx.strokeStyle = '#a8443e'; ctx.lineWidth = 8 - Math.abs(i - 3.5) * 0.9;
    ctx.beginPath(); ctx.moveTo(cx + (i - 3.5) * 5, cy + 12);
    ctx.bezierCurveTo(cx + (ex - cx) * 0.3, cy + 52, cx + (ex - cx) * 0.85, ey + 16, ex, ey - 8); ctx.stroke();
    ctx.fillStyle = '#e9b8a8'; for (let k = 1; k < 5; k++) { const t = k / 5; ctx.beginPath(); ctx.arc(cx + (ex - cx) * t, cy + 30 + (ey - cy - 30) * t + 6 * Math.sin(t * 3), 1.6, 0, 7); ctx.fill(); }
  }
  ctx.fillStyle = '#b5524a'; ctx.beginPath(); ctx.ellipse(cx, cy - 8, 30, 26, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(cx - 9, cy - 18, 9, 6, -0.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#2a211c'; ctx.beginPath(); ctx.arc(cx - 10, cy + 6, 2.2, 0, 7); ctx.arc(cx + 10, cy + 6, 2.2, 0, 7); ctx.fill();

/* one picture for a stall. kind: species key, tuna, uni, ebi, tako. mode: one, many, block, storm. f: freshness */
function amCanvas(kind, mode, f, seed, tunaT, W = 320, H = 132) {
  const cv = el('canvas', { class: 'amcv', width: W * 2, height: H * 2 });
  const ctx = cv.getContext('2d'); ctx.scale(2, 2);
  if (kind === 'tuna') { if (tunaT) { ctx.fillStyle = '#3a3330'; ctx.fillRect(0, 0, W, H); amTail(ctx, W / 2, H / 2, Math.min(W, H) * 0.4, tunaT); } else amBlock(ctx, W, H); }
  else if (kind === 'uni') amUni(ctx, W, H, f, seed);
  else if (kind === 'ebi') amPrawns(ctx, W, H, seed);
  else if (kind === 'tako') amTako(ctx, W, H, seed);
  else {
    const sp = SPECIES[kind] || SPECIES.aji;
    amIce(ctx, W, H, seed || 1);
    if (mode === 'many') [[W * 0.36, H * 0.34, 0.5], [W * 0.66, H * 0.42, 0.5], [W * 0.5, H * 0.68, 0.52]].forEach(([x, y, k], i) => drawFish(ctx, fishGeom(x, y, W * k, sp.depth), sp, { fresh: f, seed: (seed || 1) + i }));
    else drawFish(ctx, fishGeom(W / 2, H / 2, W * 0.8, sp.depth), sp, { fresh: f, seed: seed || 1 });
  }
  if (mode === 'storm') {
    ctx.fillStyle = 'rgba(30,40,60,.35)'; ctx.fillRect(0, 0, W, H);
    const r = seeded(seed || 2); ctx.strokeStyle = 'rgba(220,230,245,.55)'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 40; i++) { const x = r() * W, y = r() * H; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 5, y + 12); ctx.stroke(); }
  }
  return cv;
}

/* =====================================================================
   Volume sushi (数の寿司): roll houses, all-you-can-eat, conveyor belts,
   hand-roll bars, standing bars. Pure model. Here the money comes from
   throughput, labour, food cost and location more than from your knife:
   a good chef helps, but a rice robot and a tight menu help more.
   ===================================================================== */
const VOL = {
  grades: [
    { id: 'value', en: 'Value fish', desc: 'Imitation crab, farmed salmon, frozen tuna saku. Cheap and consistent.', costK: 0.85, q: -8 },
    { id: 'standard', en: 'Standard', desc: 'Decent farmed and frozen fish from a big distributor.', costK: 1, q: 0 },
    { id: 'premium', en: 'Premium', desc: 'Fresh local salmon and better tuna. Guests notice; your margin notices more.', costK: 1.35, q: 10 },
  ],
  /* Suzumo list prices at a US dealer: nigiri machine $19,300 (3,000-4,800 pieces an hour), rice-sheet
     machine for rolls $18,200. Kura Sushi USA cut labour from 34.8% to 30.7% of sales with automation. */
  robot: { cost: { tokyo: 28000, seattle: 37500 }, speed: 1.25, labor: 0.08 },
  /* DoorDash 15/25/30%, Uber Eats 20/25/30%; Seattle caps delivery commissions at 15% (2022 law),
     but its driver-pay law pushed customer fees up. Uber Eats Japan takes 35%. Delivery was 5% of US
     full-service traffic and 9% of quick-service in 2024, with a third of full-service places on the
     apps: about 15% extra for a shop that signs up. Japan's delivery market is ¥824B (2025), a few
     percent of eating out. Sushi boxes cost cents each. */
  delivery: { commission: { tokyo: 0.35, seattle: 0.15 }, pack: 0.8, share: { tokyo: 0.15, seattle: 0.15 }, check: 0.85 },
  happy: { traffic: 1.1, discount: 0.25, share: 0.3 },                          // a quarter off for the third of guests who come 3-6 pm
  chefWage: { tokyo: 25000, seattle: 50000 },                                    // a line sushi chef a year
  walkK: 0.55,
  coversPerChef: 55,                                                             // covers one chef can turn out in a day
};

/* volume menu: rolls on (ids), price index (1 = normal), grade, chefs, robot, delivery, happy, marketing */
function volDefaults(fmt, loc) {
  const menu = fmt.menu;
  const ids = menu ? rollsFor(loc, fmt).map((r) => r.id) : loc === 'tokyo' ? ['nami', 'jo', 'chirashi', 'tekka', 'kappa', 'futomaki'] : ['cali', 'spicy', 'philly', 'tempura', 'dragon', 'rainbow', 'kappa'];
  return { rolls: ids, priceK: 1, grade: 'standard', chefs: Math.max(2, Math.round(fmt.seats / 14)), robot: !!fmt.robot, delivery: false, happy: false, marketing: 0 };
}

function volScore(sh, loc, skills, fmt) {
  const v = sh.vol;
  const G = VOL.grades.find((g) => g.id === v.grade) || VOL.grades[1];
  const rolls = rollsFor(loc, fmt).filter((r) => v.rolls.includes(r.id));
  const n = rolls.length;
  const notes = [];
  const sk = (st) => (skills && skills[st] != null ? skills[st] : 65);
  // execution: rice and slicing still matter, a robot evens it out
  let exec = loc === 'tokyo' ? sk('rice') * 0.4 + sk('nigiri') * 0.35 + sk('slice') * 0.25 : sk('rolls') * 0.5 + sk('rice') * 0.3 + sk('slice') * 0.2;
  if (fmt.id === 'bar') exec = sk('nigiri') * 0.35 + sk('rice') * 0.3 + sk('slice') * 0.2 + sk('rolls') * 0.15;
  if (fmt.menu === 'bou' || fmt.menu === 'piece') exec = sk('nigiri') * 0.4 + sk('rice') * 0.35 + sk('slice') * 0.25;
  if (v.robot) exec = Math.max(exec, 74) * 0.9 + 74 * 0.1;
  // menu: variety helps up to about 10 rolls; beyond that the kitchen slows and waste climbs
  const varietyS = U.clamp(40 + n * 8 - Math.max(0, n - 10) * 10, 0, 100);
  if (n < 5) notes.push({ k: 'thin', t: 'A short roll list. Groups drift to the place down the street with forty rolls.' });
  if (n > 10) notes.push({ k: 'wide', t: 'A long menu slows the line and fills the bin with waste.' });
  const special = rolls.filter((r) => r.top).length;
  if (special >= 2) notes.push({ k: 'special', t: 'Specialty rolls carry the margin: sauce and toppings cost little and sell for twice the price.' });
  const quality = U.clamp(exec * 0.55 + varietyS * 0.25 + 60 * 0.2 + G.q, 0, 100);
  // the format's own check and food-cost share are the anchor; your menu shifts them from there
  const avgOf = (list, f) => { const w = list.reduce((s2, r) => s2 + r.pop, 0) || 1; return list.reduce((s2, r) => s2 + f(r) * r.pop, 0) / w; };
  const ref = rollsFor(loc, fmt).filter((r) => volDefaults(fmt, loc).rolls.includes(r.id));
  const refP = avgOf(ref, (r) => rollPrice(r, loc)), refC = avgOf(ref, (r) => rollCost(r, loc) / rollPrice(r, loc));
  const myP = n ? avgOf(rolls, (r) => rollPrice(r, loc)) : refP, myC = n ? avgOf(rolls, (r) => rollCost(r, loc) / rollPrice(r, loc)) : refC;
  const check = fmt.check * v.priceK * (fmt.ayce ? 1 : myP / refP);
  const food = fmt.check * (fmt.ayce ? 1 : myP / refP) * fmt.food * (myC / refC) * G.costK * (fmt.ayce && v.leftover ? 0.94 : 1);
  if (fmt.ayce) notes.push({ k: 'ayce', t: v.leftover ? 'A leftover fee (50 cents a piece) keeps plates clean and waste down; a few guests feel policed.' : 'All-you-can-eat guests order more than they eat. Rice-heavy rolls and tiered menus keep it in check.' });
  if (v.grade === 'value') notes.push({ k: 'value', t: 'Value fish keeps food cost low. Reviews mention the imitation crab.' });
  if (v.grade === 'premium') notes.push({ k: 'premium', t: 'Premium fish: the reviews say "fresher than it needs to be".' });
  return { quality, exec, varietyS, check, food, n, notes, grade: G };
}

/* one season for a volume shop (the same commit rules as a counter) */
function simVolSeason(s, sh, rnd = Math.random, opt = {}) {
  const r = s.road, loc = sh.loc;
  const fmt = ROAD.formats[loc].find((f) => f.id === sh.fmt);
  const v = sh.vol;
  const skills = shopSkills(s);
  const ev = opt.event || null;
  const fx = { exec: 0, foodK: 1, cap: 1, buzz: 0, rating: 0, reg: 0, churn: 0, cash: 0, demand: 1, rep: 0, net: 0, note: null };
  if (ev && ev.apply) ev.apply(fx, opt.choice, sh, s);
  const vs = volScore(sh, loc, skills, fmt);
  const rush = opt.rush != null ? opt.rush : null; // your own score in the Friday rush, if you worked it
  const quality = U.clamp(vs.quality + fx.exec * 0.5 + (rush != null ? (rush - 60) * 0.1 : 0) + (opt.dry ? 0 : (rnd() - 0.5) * 6), 0, 100);
  const fair = fmt.check * (0.75 + 0.5 * quality / 100);
  const value = fair / Math.max(1, vs.check);
  // seats and kitchen
  const days = fmt.days || 7;
  const capacity = Math.round(fmt.seats * (fmt.turnsDay || 2) * days * SHOP.weeks * fx.cap);
  const kitchen = Math.round(v.chefs * VOL.coversPerChef * (fmt.chefK || 1) * days * SHOP.weeks * (v.robot ? VOL.robot.speed : 1) * (0.75 + 0.5 * vs.exec / 100) * (rush != null ? 0.9 + rush / 500 : 1));
  // demand: location, value, rating, buzz, marketing
  const shownR = sh.rating != null ? sh.rating : 3.9;
  const mk = Math.log10(1 + (v.marketing || 0) / 1000) * 0.12;
  const want = capacity * VOL.walkK * (0.85 + 0.25 * fameOf(s)) * Math.exp((shownR - 3.9) * 0.9) * Math.pow(U.clamp(value, 0.4, 1.6), 1.6) * (1 + sh.buzz * 0.5 + mk) * (v.happy ? VOL.happy.traffic : 1) * fx.demand;
  const deliveryWant = v.delivery ? want * VOL.delivery.share[loc] : 0;
  const dine = Math.min(want, capacity, kitchen);
  const deliv = Math.min(deliveryWant, Math.max(0, kitchen - dine));
  const lost = Math.max(0, want - dine) + Math.max(0, deliveryWant - deliv);
  const covers = Math.round(dine + deliv);
  const occ = capacity ? dine / capacity : 0;
  const slow = kitchen < Math.min(want, capacity) ? (Math.min(want, capacity) - kitchen) / Math.max(1, kitchen) : 0;
  // rating
  let rSeason = 3.0 + 1.6 * U.clamp((quality - 50) / 40, -1, 1) + U.clamp((value - 1) * 1.2, -0.6, 0.35) - Math.min(0.5, slow * 0.8) + fx.rating + (opt.dry ? 0 : (rnd() - 0.5) * 0.12);
  if (v.delivery) rSeason -= 0.04; // soggy tempura in a box
  if (fmt.ayce && v.leftover) rSeason -= 0.04;
  rSeason = U.clamp(rSeason, 2.4, 5);
  // money
  const disc = v.happy ? VOL.happy.discount * VOL.happy.share : 0;
  const bevPer = (fmt.bev || 4) * (loc === 'tokyo' ? 0.8 : 1);
  const foodRev = dine * vs.check * (1 - disc) + deliv * vs.check * VOL.delivery.check * (1 - VOL.delivery.commission[loc]);
  const bevRev = dine * bevPer;
  const foodCost = (dine + deliv * VOL.delivery.check) * vs.food * fx.foodK + deliv * VOL.delivery.pack;
  const bevCost = bevRev * 0.28;
  // front of house, dishwashers and a manager scale with the room; sushi chefs are your call
  const labor = fmt.labor * fmt.seats * (fmt.turnsDay || 2) * days * 52 * 0.7 * fmt.check / 4 * 0.75 * (v.robot ? 1 - VOL.robot.labor : 1) + v.chefs * VOL.chefWage[loc] / 4;
  const rent = fmt.rent * (sh.rentK || 1) / 4, other = (fmt.other + (fmt.share || 0) + SHOP.overhead[loc]) * (foodRev + bevRev) + (v.marketing || 0);
  const debt = r.opened.pj.debtService / 4;
  const side = (sh.media ? (loc === 'tokyo' ? 6000 : 9000) : 0) + (sh.branchProfit || 0) * (sh.branches || 0) + (sh.licensed ? sh.licenseFee || 0 : 0);
  const profit = foodRev + bevRev - foodCost - bevCost - labor - rent - other - debt + fx.cash + side;
  const share = r.opened.offer && r.opened.offer.equity ? 1 - r.opened.offer.equity : 1;
  const ownerTake = profit > 0 ? profit * (1 - SHOP.tax[loc]) * share : profit;
  const res = { vol: true, season: seasonOf(sh.q).id, year: sh.year, q: sh.q, vs, quality, fair, value, capacity, kitchen, want: Math.round(want), covers, dine: Math.round(dine), deliv: Math.round(deliv), lost: Math.round(lost), occ, slow, rSeason,
    foodRev, bevRev, foodCost, bevCost, labor, rent, other, debt, profit, ownerTake, fx, check: vs.check };
  if (opt.dry) return res;
  const newReviews = dine * 0.02 + deliv * 0.01 + 1;
  sh.ratingSum += rSeason * newReviews; sh.reviews += newReviews;
  sh.rating = sh.ratingSum / sh.reviews;
  sh.regulars = Math.max(0, sh.regulars * (1 - 0.08) + dine * 0.004 * U.clamp((rSeason - 3.5), 0, 1.5));
  sh.buzz = U.clamp(sh.buzz * 0.75 + mk * 0.5 + fx.buzz, 0, 1.2);
  s.savings += ownerTake;
  r.rep = U.clamp(r.rep + (rSeason - 4.0) * 2 + fx.rep, 0, 100);
  r.skill = Math.min(90, r.skill + Math.max(0, (85 - r.skill) * 0.02));
  if (sh.history.length + 1 >= 20 && !sh.milestone) sh.milestoneDue = true;
  res.shown = shownRating(loc, sh.rating);
  res.lines = volReviewLines(loc, res, sh);

/* =====================================================================
   People (人物): every face in the game in one illustrated style.
   Lantern-lit chibi with woodblock linework: warm key light from the
   upper left, a cool rim on the right, one cel shadow per material.
   All busts share a 120-unit box: head centred near (60, 55), shoulders
   along the bottom edge, so they sit right in the round portrait frames.
   masterSVG, apprenticeSVG, brokerSVG and guestSVG are thin wrappers
   around ppBust(), which assembles a figure from parts.
   ===================================================================== */
let PP_N = 0;
const PP = {
  ink: '#2a211c',
  rim: '#9fb3e6',
  id(p) { return 'pp' + p + (++PP_N).toString(36); },
};
function ppMix(a, b, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

const ppF = (n) => Math.round(n * 10) / 10;

/* ---------- head geometry ---------- */
const PP_FACE = {
  round: 'M31 53 C31 33 44 22 60 22 C76 22 89 33 89 53 C89 66 86 75 79.5 81.5 C73.5 87 67 89 60 89 C53 89 46.5 87 40.5 81.5 C34 75 31 66 31 53 Z',
  long: 'M32.5 52 C32.5 32 45 21 60 21 C75 21 87.5 32 87.5 52 C87.5 67 85 78 78.5 85 C73 90 66.5 92 60 92 C53.5 92 47 90 41.5 85 C35 78 32.5 67 32.5 52 Z',
  square: 'M30.5 52 C30.5 32 44 21 60 21 C76 21 89.5 32 89.5 52 C89.5 64 89 73 84 80.5 C78 87.5 69 89.5 60 89.5 C51 89.5 42 87.5 36 80.5 C31 73 30.5 64 30.5 52 Z',
  soft: 'M30 54 C30 33 44 22 60 22 C76 22 90 33 90 54 C90 68 85 78 78 83.5 C72 88 66 89.5 60 89.5 C54 89.5 48 88 42 83.5 C35 78 30 68 30 54 Z',
};
const PP_SHADE = 'M64 16 C86 20 95 40 94 58 C93 77 82 91 60 96 C74 85 80.5 71 81 55 C81.5 40 77 26 64 16 Z';
const PP_TORSO = 'M13 121 C15 106 27 97.6 43 94.6 L77 94.6 C93 97.6 105 106 107 121 Z';

/* ---------- the parts ---------- */
function ppEar(o, side) {
  const k = o.earK || 1, x = side < 0 ? 31.5 : 88.5, s = o.skin;
  const ear = 'M0 -7 C-6.5 -9 -9 -1 -7.6 4 C-6.6 7.6 -3.4 9 -0.6 7.4';
  const inner = 'M-2.4 -3.6 C-5 -3.8 -5.8 0.4 -4.4 2.8';
  const tf = 'translate(' + x + ' 60) scale(' + (side < 0 ? k : -k) + ' ' + k + ')';
  return '<g transform="' + tf + '"><path d="' + ear + ' Z" fill="' + (side < 0 ? s.base : s.shade) + '" stroke="' + PP.ink + '" stroke-width="2.2" stroke-linejoin="round"/><path d="' + inner + '" fill="none" stroke="' + s.line + '" stroke-width="1.3" stroke-linecap="round"/></g>';
}

function ppBlob(x, y, r, seed) {
  let a = seed * 9301 + 49297; const rnd = () => { a = (a * 9301 + 49297) % 233280; return a / 233280; };
  const n = 7; let d = '';
  for (let i = 0; i <= n; i++) {
    const t = (i % n) / n * Math.PI * 2, rr = r * (0.7 + rnd() * 0.55);
    const px = x + Math.cos(t) * rr, py = y + Math.sin(t) * rr * 0.85;
    d += (i ? ' L' : 'M') + ppF(px) + ' ' + ppF(py);

}

/* eyes: style big | adult | old; ex: open, happy, flat, narrow, glare, half, wide */
function ppEye(o, ex, side, ids) {

    if (st !== 'old') s += '<ellipse cx="' + cx + '" cy="' + ppF(cy + dy + ry * 0.46) + '" rx="' + ppF(rx * 0.7) + '" ry="' + ppF(ry * 0.38) + '" fill="' + ppMix(o.irisC[1], '#ffcf8a', 0.45) + '" opacity=".6"/>' +
      '<ellipse cx="' + cx + '" cy="' + ppF(cy + dy + ry * 0.12) + '" rx="' + ppF(rx * 0.44) + '" ry="' + ppF(ry * 0.48) + '" fill="#140c08"/>' +
      '<ellipse cx="' + cx + '" cy="' + ppF(cy + dy) + '" rx="' + ppF(rx) + '" ry="' + ppF(ry) + '" fill="none" stroke="' + ink + '" stroke-width=".9" opacity=".55"/>';
    s += '<circle cx="' + ppF(cx - rx * 0.36) + '" cy="' + ppF(cy + dy - ry * 0.34) + '" r="' + ppF(Math.max(0.8, rx * 0.36)) + '" fill="#fff"/>';
    if (st !== 'old') s += '<circle cx="' + ppF(cx + rx * 0.38) + '" cy="' + ppF(cy + dy + ry * 0.5) + '" r="' + ppF(rx * 0.17) + '" fill="#fff" opacity=".85"/>';
    return s;
  };

  if (ex === 'happy') return L('M' + ppF(cx - P.sp) + ' ' + ppF(cy + 1.4) + ' Q' + cx + ' ' + ppF(cy - 4.8) + ' ' + ppF(cx + P.sp) + ' ' + ppF(cy + 1.4), P.w) + flick;
  if (ex === 'flat') return L('M' + ppF(cx - P.sp) + ' ' + ppF(cy + 0.4) + ' Q' + cx + ' ' + ppF(cy + 2.8) + ' ' + ppF(cx + P.sp) + ' ' + ppF(cy + 0.4), P.w - 0.2) + (o.fem ? L('M' + ppF(cx + side * (P.sp - 0.4)) + ' ' + ppF(cy + 0.6) + ' l' + ppF(side * 1.8) + ' -0.8', 1.3) : '');
  if (ex === 'wide') {
    return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + ppF(P.rx + 1.8) + '" ry="' + ppF(P.ry + 1.4) + '" fill="#fffdf6" stroke="' + ink + '" stroke-width="1.5"/>' +
      '<circle cx="' + cx + '" cy="' + ppF(cy + 0.4) + '" r="' + ppF(Math.max(1.6, P.rx * 0.5)) + '" fill="#1c120d"/><circle cx="' + ppF(cx - 0.8) + '" cy="' + ppF(cy - 0.6) + '" r=".7" fill="#fff"/>';

  let s = '';
  if (st === 'old') {

    s += '<ellipse cx="' + cx + '" cy="' + ppF(cy - 1.2) + '" rx="7.6" ry="4.2" fill="' + o.skin.shade + '" opacity=".55"/>';
    if (ex === 'open' || ex === 'half' || ex === 'narrow' || ex === 'glare') {
