<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161a30">
<title>Sushi Apprentice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Train from apprentice to itamae in a Tokyo sushi-ya, then open and run your own counter: menu, sake, regulars and reviews.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout concept: a lantern-lit sushi-ya at night. The night outside is indigo; everything you
   touch is hinoki wood or washi paper under warm lantern light. Vermilion is reserved for the
   master's seal. The Oyakata's face is the one bold element; everything else stays quiet. */
:root {
  --yoru: #161a30;        /* night outside */
  --yoru-2: #1f2542;      /* raised night panel */
  --line: #34406c;        /* hairlines on night */
  --noren: #263463;       /* indigo cloth */
  --kinari: #f5ecda;      /* unbleached cotton text */
  --kinari-dim: #b7bbcf;  /* secondary text on night */
  --hinoki: #f0dfbd;      /* counter wood */
  --hinoki-2: #dcc293;    /* pressed wood */
  --hinoki-3: #b99662;    /* wood edge / shadow */
  --washi: #f7eedc;       /* paper */
  --sumi: #2a211c;        /* ink */
  --sumi-dim: #6e5e4c;    /* faded ink */
  --lantern: #f6a54c;     /* lantern glow */
  --lantern-hi: #ffd08a;  /* lantern highlight */
  --shu: #d9452b;         /* hanko vermilion */
  --wasabi: #8fbf5a;      /* good */
  --yuzu: #e9b949;        /* caution */
  --beni: #e36f5c;        /* fault */
  --sakura: #f6c3cf;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
  --f-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, -apple-system, sans-serif;
  --f-body: var(--f-ui);
  --f-mono: var(--f-ui);
  --r: 12px;
  --paper: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .22  0 0 0 0 .12  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 60% at 50% -12%, rgba(246,165,76,.16), rgba(246,165,76,0) 62%), var(--yoru);
  background-attachment: fixed;
  color: var(--kinari);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  font-variant-numeric: tabular-nums;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
.mono { font-variant-numeric: tabular-nums; font-family: var(--f-ui); font-weight: 700; }
.jp { font-family: var(--f-display); }
:focus-visible { outline: 3px solid var(--lantern-hi); outline-offset: 2px; }

#app {
  min-height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 28px;
  display: flex;
  flex-direction: column;
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: rgba(22,26,48,.92); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px;
  padding-block: 10px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--yoru); }
.topbar .shop { font-family: var(--f-display); font-weight: 800; font-size: 18px; flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
.topbar .shop .mini { width: 26px; height: 26px; border-radius: 50%; background: var(--hinoki); display: grid; place-items: center; overflow: hidden; flex: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--f-ui); font-weight: 500; font-size: 12.5px; padding: 3px 10px; border-radius: 99px; background: var(--yoru-2); border: 1px solid var(--line); color: var(--kinari-dim); white-space: nowrap; }
.chip b { font-weight: 700; color: var(--kinari); }
.chip.warn b { color: var(--yuzu); }
.chip.bad b { color: var(--beni); }
button.chip { cursor: pointer; }

/* ---------- buttons: wood you can press ---------- */
.btn {
  appearance: none; border: 0; border-radius: var(--r); padding: 11px 16px; min-height: 46px;
  font-family: var(--f-ui); font-weight: 700; font-size: 15px; letter-spacing: .01em;
  background: var(--yoru-2); color: var(--kinari); box-shadow: inset 0 0 0 1.5px var(--line), 0 3px 0 #0e1124;
  cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  transition: transform .06s, box-shadow .06s, background .15s;
}
.btn:active, .btn.held { transform: translateY(2px); box-shadow: inset 0 0 0 1.5px var(--line), 0 1px 0 #0e1124; }
.btn.wood { background: linear-gradient(#f4e5c6, var(--hinoki)); color: var(--sumi); box-shadow: inset 0 0 0 1px rgba(160,120,60,.35), 0 3px 0 var(--hinoki-3); }
.btn.wood:active, .btn.wood.held { background: var(--hinoki-2); box-shadow: inset 0 0 0 1px rgba(160,120,60,.35), 0 1px 0 var(--hinoki-3); }
.btn.primary { background: linear-gradient(var(--lantern-hi), var(--lantern)); color: #3a1f0c; box-shadow: 0 3px 0 #b8682a, 0 0 18px rgba(246,165,76,.35); }
.btn.primary:active, .btn.primary.held { box-shadow: 0 1px 0 #b8682a, 0 0 10px rgba(246,165,76,.3); }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.ghost:active { box-shadow: inset 0 0 0 1.5px var(--kinari-dim); }
.btn.danger { background: transparent; color: var(--beni); box-shadow: inset 0 0 0 1.5px var(--beni); }
.btn[disabled] { opacity: .4; pointer-events: none; box-shadow: none; }
.btn small { font-weight: 500; opacity: .75; font-size: 12px; }
.btn.on { background: linear-gradient(#b7dc8a, var(--wasabi)); color: #1d2a10; box-shadow: 0 3px 0 #5d8a32; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 0; min-width: 0; }

/* ---------- title ---------- */
.hero { position: relative; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.storefront { display: block; width: 100%; height: auto; max-height: 52vh; }
.storefront .flap { transform-box: fill-box; transform-origin: top; animation: sway 5s ease-in-out infinite; }
.storefront .f1 { animation-delay: .4s; } .storefront .f2 { animation-delay: .8s; } .storefront .f3 { animation-delay: 1.2s; }
@keyframes sway { 0%, 100% { transform: skewX(0deg); } 50% { transform: skewX(1.6deg); } }
.storefront .lantern { animation: flicker 3.2s ease-in-out infinite; }
.storefront .l1 { animation-delay: 1.1s; }
@keyframes flicker { 0%, 100% { opacity: 1; } 45% { opacity: .9; } 50% { opacity: .97; } 70% { opacity: .88; } }
.storefront .petal { animation: fall 12s linear infinite; }
.storefront .p1 { animation-duration: 15s; } .storefront .p2 { animation-duration: 10s; }
@keyframes fall { 0% { transform: translate(0, 0) rotate(0); } 100% { transform: translate(-40px, 330px) rotate(540deg); } }
.title-block { padding-block: 18px 6px; display: grid; gap: 8px; }
.title-block h1 { font-size: 40px; line-height: 1.02; }
.title-block .sub { font-family: var(--f-display); color: var(--lantern-hi); font-size: 17px; letter-spacing: .06em; }
.lede { color: var(--kinari-dim); max-width: 60ch; }
.paths { display: grid; gap: 14px; margin-top: 18px; }
.path {
  position: relative; display: grid; gap: 8px; text-align: left; padding: 18px 18px 16px; border: 0; border-radius: 8px;
  background: var(--paper), linear-gradient(#f4e5c6, var(--hinoki)); color: var(--sumi); cursor: pointer;
  box-shadow: 0 4px 0 var(--hinoki-3), 0 10px 24px rgba(0,0,0,.35);
}
.path::before { content: ""; position: absolute; top: -9px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--yoru); box-shadow: 0 0 0 3px var(--hinoki-3); }
.path:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--hinoki-3), 0 6px 16px rgba(0,0,0,.35); }
.path h3 { font-size: 22px; }
.path .k { font-family: var(--f-display); color: var(--shu); font-size: 15px; }
.path .lede { color: var(--sumi-dim); }
.path dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 4px 0 0; font-size: 13.5px; }
.path dt { color: var(--sumi-dim); }
.path dd { margin: 0; font-weight: 700; }
.field { display: grid; gap: 6px; margin-top: 18px; }
.field label { font-size: 13px; color: var(--kinari-dim); }
.field input { font: inherit; padding: 12px 14px; border-radius: var(--r); border: 0; background: var(--yoru-2); color: var(--kinari); min-height: 46px; box-shadow: inset 0 0 0 1.5px var(--line); }
.fineprint { font-size: 12.5px; color: var(--kinari-dim); margin-top: 16px; }
.sound-toggle { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 10px; }

/* ---------- the master and his speech ---------- */
.portrait { flex: none; width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #ffe2b0, var(--lantern) 120%); display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 3px rgba(255,208,138,.35); }
.portrait svg { transform: translateY(6px); }
.bubble { display: flex; gap: 10px; align-items: flex-start; }
.bubble .say { position: relative; flex: 1; min-width: 0; background: var(--washi); background-image: var(--paper); color: var(--sumi); border-radius: 14px; padding: 10px 13px; font-size: 14.5px; line-height: 1.5; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.bubble .say::before { content: ""; position: absolute; left: -7px; top: 18px; border: 7px solid transparent; border-right-color: var(--washi); border-left: 0; }
.bubble .say em { font-style: normal; font-weight: 700; color: #a2401f; }
.bubble .say b { font-family: var(--f-display); }

/* ---------- ladder ---------- */
.shopfront { position: relative; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); margin-top: -14px; margin-bottom: 12px; }
.interior { display: block; width: 100%; height: 132px; }
.shopfront .oyakata { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: -6px; }
.shopfront .bubble { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 96px); right: max(14px, env(safe-area-inset-right, 0px)); top: 12px; }
.shopfront .bubble .say { font-size: 13.5px; }
.status { display: grid; gap: 6px; margin-bottom: 14px; }
.status .line { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--kinari-dim); }
.meter { height: 10px; border-radius: 99px; background: var(--yoru-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, #b7dc8a, var(--wasabi)); border-radius: 99px; transition: width .5s; }
.meter.warn i { background: linear-gradient(90deg, #f5d27a, var(--yuzu)); }
.meter.bad i { background: linear-gradient(90deg, #f29a89, var(--beni)); }
.ladder { display: grid; gap: 14px; }
.plaque {
  position: relative; border-radius: 6px; padding: 14px 12px 14px 14px; color: var(--sumi);
  display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center;
  background: var(--paper), repeating-linear-gradient(91deg, rgba(150,110,50,.06) 0 2px, transparent 2px 11px), linear-gradient(#f4e5c6, var(--hinoki));
  box-shadow: 0 3px 0 var(--hinoki-3), 0 8px 18px rgba(0,0,0,.28);
}
.plaque::before, .plaque::after { content: ""; position: absolute; top: -14px; width: 2px; height: 14px; background: rgba(245,236,218,.35); }
.plaque::before { left: 22%; } .plaque::after { right: 22%; }
.plaque.now { box-shadow: 0 3px 0 var(--hinoki-3), 0 0 0 2px var(--lantern-hi), 0 0 28px rgba(246,165,76,.45); }
.plaque.locked { filter: grayscale(.5) brightness(.62); }
.plaque .num { font-size: 11.5px; color: var(--sumi-dim); text-align: center; line-height: 1.1; }
.plaque .num { display: grid; justify-items: center; gap: 3px; }
.plaque .num .ico { position: relative; width: 54px; height: 54px; display: block; filter: drop-shadow(0 2px 0 rgba(90,60,25,.35)); }
.plaque .num .ico svg { display: block; }
.plaque .num .ico b { position: absolute; right: -5px; bottom: -3px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 99px; display: grid; place-items: center; font-family: var(--f-display); font-size: 13.5px; font-weight: 800; color: var(--washi); background: var(--sumi); box-shadow: 0 0 0 2px #f4e5c6; }
.plaque.now .num .ico b { background: var(--shu); }
.plaque .body { min-width: 0; display: grid; gap: 3px; }
.plaque h3 { font-size: 17.5px; line-height: 1.2; }
.plaque .meta { font-size: 13px; color: var(--sumi-dim); }
.plaque .bar { height: 6px; background: rgba(42,33,28,.12); border-radius: 99px; overflow: hidden; margin-top: 3px; }
.plaque .bar i { display: block; height: 100%; background: var(--sumi); border-radius: 99px; }
.plaque .survive { font-size: 12px; color: var(--sumi-dim); }
.plaque .act { display: grid; gap: 6px; justify-items: end; }
.plaque .btn { min-height: 42px; padding: 8px 14px; background: var(--sumi); color: var(--hinoki); box-shadow: 0 3px 0 #000; }
.plaque.now .btn { background: linear-gradient(var(--lantern-hi), var(--lantern)); color: #3a1f0c; box-shadow: 0 3px 0 #b8682a; }
.hanko {
  width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid var(--shu); color: var(--shu);
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 21px;
  transform: rotate(-8deg); opacity: .94; background: rgba(217,69,43,.05);
}
.hanko.small { width: 40px; height: 40px; font-size: 17px; }
.hanko.big { width: 108px; height: 108px; font-size: 48px; border-width: 4px; }
.stamp-in { animation: stamp .5s cubic-bezier(.2,1.6,.4,1) both; animation-delay: .9s; }
@keyframes stamp { from { transform: scale(2.4) rotate(-22deg); opacity: 0; } to { transform: scale(1) rotate(-8deg); opacity: .94; } }
.ladder-foot { display: grid; gap: 10px; margin-top: 20px; }
.notes { margin-top: 20px; display: grid; gap: 8px; padding: 16px; border-radius: 8px; background: var(--paper), var(--washi); color: var(--sumi); box-shadow: 0 3px 0 var(--hinoki-3); }
.notes h2 { font-size: 18px; color: var(--sumi); }
.note { font-size: 13.5px; color: var(--sumi); border-left: 2px solid var(--hinoki-2); padding-left: 10px; }
.note b { color: var(--sumi-dim); font-weight: 700; font-size: 12px; margin-right: 6px; }

/* ---------- game screen ---------- */
.game { display: flex; flex-direction: column; gap: 10px; }
.game-head { display: flex; align-items: center; gap: 10px; }
.game-head h2 { font-size: 21px; flex: 1; min-width: 0; }
.game-head h2 .jp { color: var(--lantern-hi); font-size: 15px; margin-left: 6px; font-weight: 700; }
.steps { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.steps span { font-size: 12px; padding: 4px 10px; border-radius: 99px; color: var(--kinari-dim); background: var(--yoru-2); white-space: nowrap; }
.steps span.done { color: #cfe8b0; background: rgba(143,191,90,.16); }
.steps span.now { color: #3a1f0c; background: linear-gradient(var(--lantern-hi), var(--lantern)); font-weight: 700; }
.stage { position: relative; width: 100%; }
.stage::after { content: ""; position: absolute; inset: auto 8% -14px; height: 22px; background: radial-gradient(closest-side, rgba(0,0,0,.45), transparent); z-index: -1; }
canvas.board { display: block; width: 100%; border-radius: 10px; touch-action: none; background: var(--hinoki); box-shadow: 0 0 0 3px #3a2a20, 0 0 0 5px rgba(255,208,138,.18), 0 14px 30px rgba(0,0,0,.4); }
.game[data-scene="dawn"] canvas.board { box-shadow: 0 0 0 3px #2b3a52, 0 0 0 5px rgba(160,200,230,.25), 0 14px 30px rgba(0,0,0,.4); }
.hint { display: flex; gap: 10px; align-items: flex-start; min-height: 3em; }
.hint .portrait { width: 42px; height: 42px; }
.hint .say { position: relative; flex: 1; min-width: 0; background: var(--washi); background-image: var(--paper); color: var(--sumi); border-radius: 14px; padding: 9px 12px; font-size: 14px; line-height: 1.5; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.hint .say::before { content: ""; position: absolute; left: -7px; top: 14px; border: 7px solid transparent; border-right-color: var(--washi); border-left: 0; }
.hint .say em { font-style: normal; font-weight: 700; color: #a2401f; }
.controls { display: grid; gap: 9px; }
.readout { display: flex; gap: 6px; flex-wrap: wrap; }
.slider { display: grid; gap: 4px; background: var(--yoru-2); box-shadow: inset 0 0 0 1.5px var(--line); border-radius: var(--r); padding: 10px 14px; }
.slider .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.slider .top .mono { color: var(--lantern-hi); }
.slider input[type=range] { width: 100%; accent-color: var(--lantern); min-height: 30px; }
.slider .help { font-size: 12.5px; color: var(--kinari-dim); }
.ghost-hand { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }

/* market */
.slip { background: var(--paper), var(--washi); color: var(--sumi); border-radius: 6px; padding: 11px 13px; display: grid; gap: 2px; box-shadow: 0 3px 0 var(--hinoki-3); }
.slip .t { font-family: var(--f-display); font-weight: 800; font-size: 16.5px; }
.slip .s { font-size: 13px; color: var(--sumi-dim); }
.stalls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stall { background: var(--yoru-2); border: 0; border-radius: 10px; padding: 8px; display: grid; gap: 4px; text-align: left; cursor: pointer; min-width: 0; box-shadow: inset 0 0 0 1.5px var(--line), 0 3px 0 #0e1124; }
.stall:active { transform: translateY(2px); }
.stall canvas { width: 100%; height: auto; display: block; border-radius: 6px; }
.stall .n { font-weight: 700; font-size: 13.5px; }
.stall .p { font-size: 12px; color: var(--kinari-dim); }
.stall.checked { box-shadow: inset 0 0 0 2px var(--lantern), 0 3px 0 #0e1124; }
.findings { display: grid; gap: 5px; font-size: 13.5px; }
.findings div { padding: 7px 11px; background: var(--paper), var(--washi); color: var(--sumi); border-radius: 8px; }
.findings b { color: #a2401f; font-weight: 700; margin-right: 6px; }

/* order list (omakase) */
.order { display: grid; gap: 7px; }
.order .item { display: grid; grid-template-columns: 18px 46px 1fr auto auto; gap: 8px; align-items: center; background: var(--paper), linear-gradient(#f4e5c6, var(--hinoki)); color: var(--sumi); border-radius: 6px; padding: 6px 8px; box-shadow: 0 2px 0 var(--hinoki-3); }
.order .item .i { font-weight: 700; font-size: 12.5px; color: var(--sumi-dim); text-align: center; }
.order .item .nm { font-weight: 700; font-size: 14.5px; min-width: 0; }
.order .item .nm small { display: block; font-weight: 500; font-size: 12px; color: var(--sumi-dim); }
.order .item button { min-width: 42px; min-height: 42px; border-radius: 10px; border: 0; background: var(--hinoki-2); color: var(--sumi); font-weight: 700; cursor: pointer; box-shadow: 0 2px 0 var(--hinoki-3); }
.order .item button:active { transform: translateY(2px); box-shadow: none; }

/* ---------- result sheet: the master's evaluation slip ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,26,.66); display: flex; align-items: flex-end; justify-content: center; animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto;
  background: var(--paper), var(--washi); color: var(--sumi); border-radius: 20px 20px 0 0;
  padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; animation: rise .35s cubic-bezier(.2,.9,.3,1.1) both;
  box-shadow: 0 -10px 40px rgba(0,0,0,.4);
}
.sheet.shake { animation: rise .35s cubic-bezier(.2,.9,.3,1.1) both, shake .3s 1.05s; }

<body>
<div id="app"></div>
<script>
/* =====================================================================
   Career rules. Pure logic, shared by the game and the calibration
   simulator, so the difficulty lives in one place.

   Calibration targets (estimates built from the evidence below):
   - Japan MHLW, March 2022 graduates in accommodation & food service:
     high-school grads 33.6% quit in year 1, 53.3% within 2 years,
     64.7% within 3 years (all industries: 37.9%).
   - Yearly quit rate among those still in falls about 5 points a year,
     carried forward to roughly 12% a year by years 7–10.
   - So of 100 who start: ~66 left after year 1, ~35 after year 3,
     ~19 after year 6, ~11 after year 10 (the usual length of training).
   The rules below were tuned with a simulated population of apprentices
   (sim.js) until the game thins them out on roughly that curve.
   ===================================================================== */
const STATIONS = [
  { id: 'market', en: 'Market run', jp: '仕入れ', yomi: 'shiire', when: 'Years 1–2', desc: 'Follow the master to the market at dawn and learn to read a fish before you pay for it.' },
  { id: 'fillet', en: 'Fish breakdown', jp: '三枚おろし', yomi: 'sanmai oroshi', when: 'Years 2–4', desc: 'Scale, clean and fillet a sea bream with the deba. Meat left on the bone is money lost.' },
  { id: 'rice', en: 'Sushi rice', jp: 'シャリ', yomi: 'shari', when: 'Years 3–5', desc: '"Three years to cook the rice." Wash, cook, season and cool it. Everything else sits on it.' },
  { id: 'tamago', en: 'Tamagoyaki', jp: '玉子焼き', yomi: 'tamago', when: 'Years 4–6', desc: 'Daisuke Nakazawa made tamago about 200 times before Jiro Ono said it was good enough.' },
  { id: 'slice', en: 'Slicing neta', jp: '柳刃', yomi: 'yanagiba', when: 'Years 5–7', desc: 'One long pull of the yanagiba per slice, every slice the same weight.' },
  { id: 'nigiri', en: 'Nigiri', jp: '握り', yomi: 'nigiri', when: 'Years 6–9', desc: '"Eight years to learn to press." Shari by feel, shaped in a few moves before the fish warms.' },
  { id: 'omakase', en: 'The counter', jp: 'お任せ', yomi: 'omakase', when: 'Years 8–11', desc: 'Plan the course and serve two guests at their own pace. The last test before your own counter.' },
];

const RULES = {
  apprentice: {
    startSavings: 15000,
    monthlyNet: 350,            // allowance minus costs; room and meals at the shop
    firstYearMonths: 12,        // floors, dishes, towels, deliveries
    resolveStart: 100,
    firstYearResolve: 50,       // what year one takes out of the ones who stay
    bar: { market: 80, fillet: 82, rice: 83, tamago: 84, slice: 83, nigiri: 85, omakase: 85 },
    streak: { market: 2, fillet: 2, rice: 3, tamago: 4, slice: 2, nigiri: 3, omakase: 2 },
    monthsPerTry: { market: 2, fillet: 2, rice: 2, tamago: 2, slice: 2, nigiri: 3, omakase: 3 },
    duesAfter: { market: 3, fillet: 5, rice: 3, tamago: 3, slice: 3, nigiri: 5, omakase: 0 },
    failResolve: { base: 2.5, perPoint: 0.15 }, // a rejected try: base + per point below the bar
    failScale: [1, 1, 0.85, 0.7, 0.6, 0.5, 0.45], // later stations sting less: sunk years keep people in
    passResolve: 2,             // a good try that is not approval yet
    approveResolve: 26,
    drain: [0, 2.5, 0.9, 0.7, 0.7, 0.7, 0.7, 0.7, 0.7, 0.7, 0.7, 0.7], // resolve lost per month, by year of training
    // share of 100 starters who reach each station (from the simulation, rounded)
    survive: { market: 66, fillet: 31, rice: 19, tamago: 14, slice: 10, nigiri: 10, omakase: 9, done: 9 },
  },
  academy: {
    startSavings: 15000,
    tuition: 11000,
    dailyCost: 70,
    totalDays: 84,
    daysPerTry: { market: 2, fillet: 3, rice: 3, tamago: 2, slice: 2, nigiri: 3, omakase: 4 },
    bar: 65,
  },
};

/* New-year events: the grind that makes most apprentices leave.
   Negative ones hit harder in the early years. */
const YEAR_EVENTS = [
  { d: -7, t: 'Your school friends are on their second promotion. You are still wringing hot towels.' },
  { d: -6, t: 'Your parents ask, again, when you will get a real job.' },
  { d: -6, t: 'The apprentice who started after you quit after three days. His work is now yours.' },
  { d: -5, t: 'You burned your forearm on the tamago pan for the third time this month.' },
  { d: -8, t: 'The master threw your work in the bin in front of a guest.' },
  { d: -4, t: 'Fourteen-hour days, six days a week. You fell asleep on the train and missed your stop twice.' },
  { d: 5, t: 'A regular asked who made today\'s rice. The master said nothing, but he did not say it was bad.' },
  { d: 6, t: 'The master handed you his old deba. "Do not ruin it."' },
  { d: 4, t: 'New Year: three days off, the first in a year.' },
];

function clockLabel(s) {
  if (s.path === 'academy') { const w = Math.floor(s.days / 7) + 1; return 'Week ' + Math.min(12, w) + ', day ' + ((s.days % 7) + 1); }
  const y = Math.floor(s.months / 12) + 1, m = (s.months % 12) + 1;
  return 'Year ' + y + ', month ' + m;
}
function stationIndex(id) { return STATIONS.findIndex((s) => s.id === id); }

function newCareer(name, path) {
  const R = RULES[path];
  const st = {};
  STATIONS.forEach((s, i) => { st[s.id] = { tries: [], streak: 0, approved: false, open: i === 0 }; });
  const s = { v: 1, name, path, stations: st, notes: [], ended: null, savings: R.startSavings, months: 0, days: 0, resolve: 100, created: Date.now() };
  if (path === 'apprentice') {
    s.months = R.firstYearMonths;
    s.savings += R.monthlyNet * R.firstYearMonths;
    s.resolve = R.resolveStart - R.firstYearResolve;
    s.notes.push({ at: clockLabel(s), text: 'Year one: floors, dishes, deliveries and hot towels. A third of the people who start in this trade are gone by now. The master finally says: "Tomorrow you come to the market."' });
  } else {
    s.savings -= R.tuition;
    s.notes.push({ at: clockLabel(s), text: 'Paid tuition. Twelve weeks, one module after another, and a pass mark of ' + RULES.academy.bar + ' on each.' });
  }
  return s;
}

/* time passes in the shop: allowance in, resolve slowly out, a new-year event each January */
function passMonths(s, n, rnd) {
  const R = RULES.apprentice, ev = [];
  for (let i = 0; i < n; i++) {
    const year = Math.floor(s.months / 12) + 1;
    s.resolve -= R.drain[Math.min(year, R.drain.length) - 1];
    s.savings += R.monthlyNet;
    s.months++;
    if (s.months % 12 === 0) {
      const e = YEAR_EVENTS[Math.floor(rnd() * YEAR_EVENTS.length)];
      const y = s.months / 12;
      const d = e.d < 0 ? Math.round(e.d * Math.max(0.55, 1.15 - 0.08 * (y - 1))) : e.d;
      s.resolve += d;
      ev.push({ at: clockLabel(s), text: e.t, d });
    }
    s.resolve = Math.min(100, s.resolve);
  }
  return ev;
}

/* record one try; mutates the career and returns what happened */
function applyTry(s, id, score, rnd = Math.random) {
  const st = s.stations[id], idx = stationIndex(id);
  const out = { verdict: 'none', stamp: null, nextOpened: null, events: [], quit: false };
  st.tries.push({ score, at: clockLabel(s), stats: {} });
  if (s.path === 'apprentice') {
    const R = RULES.apprentice, bar = R.bar[id];
    out.events = passMonths(s, R.monthsPerTry[id], rnd);
    if (st.approved) out.verdict = 'practice';
    else if (score >= bar) {
      st.streak += 1; s.resolve += R.passResolve;
      if (st.streak >= R.streak[id]) {
        st.approved = true; out.verdict = 'approved'; out.stamp = '認';
        s.resolve += R.approveResolve;
        out.events = out.events.concat(passMonths(s, R.duesAfter[id], rnd));
        if (STATIONS[idx + 1]) { s.stations[STATIONS[idx + 1].id].open = true; out.nextOpened = STATIONS[idx + 1]; }
      } else out.verdict = 'streak';
    } else {
      st.streak = 0; out.verdict = 'rejected';
      s.resolve -= (R.failResolve.base + R.failResolve.perPoint * (bar - score)) * R.failScale[idx];
    }
    s.resolve = Math.max(0, Math.min(100, s.resolve));
    out.quit = s.resolve <= 0;
  } else {
    const R = RULES.academy;
    const left = R.totalDays - s.days;
    const d = Math.min(R.daysPerTry[id], Math.max(0, left));
    s.days += d; s.savings -= R.dailyCost * d;
    if (score >= R.bar) { out.verdict = 'passed'; if (!st.tries.slice(0, -1).some((t) => t.score >= R.bar)) out.stamp = '合'; }
    else out.verdict = 'failed';
    if (STATIONS[idx + 1] && !s.stations[STATIONS[idx + 1].id].open) { s.stations[STATIONS[idx + 1].id].open = true; out.nextOpened = STATIONS[idx + 1]; }
  }
  return out;
}

if (typeof module !== 'undefined') module.exports = { STATIONS, RULES, YEAR_EVENTS, newCareer, applyTry, passMonths, clockLabel };

'use strict';
/* =====================================================================
   Sushi Apprentice — core: utilities, state, career rules, screens
   ===================================================================== */

const U = {
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  lerp: (a, b, t) => a + (b - a) * t,
  rand: (a, b) => a + Math.random() * (b - a),
  irand: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: (a) => a[Math.floor(Math.random() * a.length)],

function el(tag, props, ...kids) {

/* ---------- canvas stage ---------- */
function Stage(container, opts = {}) {
  const aspect = opts.aspect || 0.75;
  const c = el('canvas', { class: 'board' });
  container.append(c);
  const ctx = c.getContext('2d');
  const s = { c, ctx, w: 0, h: 0, dpr: 1, onresize: null };
  function size() {
    const w = Math.max(200, container.clientWidth);
    let h = Math.round(w * aspect);
    const maxH = Math.max(240, Math.round(window.innerHeight * (opts.maxVh || 0.52)));
    if (h > maxH) h = maxH;
    s.dpr = Math.min(2, window.devicePixelRatio || 1);
    c.style.height = h + 'px';
    c.width = Math.round(w * s.dpr); c.height = Math.round(h * s.dpr);
    ctx.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);

}

/* single-pointer tracker in canvas CSS pixels */

  const up = (e) => { if (e.pointerId !== active) return; active = null; h.up && h.up(pos(e), e); };
  target.addEventListener('pointerdown', down);
  target.addEventListener('pointermove', move);
  target.addEventListener('pointerup', up);
  target.addEventListener('pointercancel', up);

    if (knifeFor && kit[knifeFor].sharp < 50) return { mood: 'stern', text: 'Your ' + knifeFor + ' is dull. Sharpen it before you touch fish.' };
    return { mood: last && last.score >= bar ? 'pleased' : 'neutral', text: st ? 'Today\'s module: <b>' + st.en + '</b>. Pass mark ' + bar + '. ' + academyLeft() + ' days left.' : 'Pick a module.' };
  }
  if (!S.months) return { mood: 'stern', text: 'So you are the new one. Market at <em>five</em>. You carry, you watch, you keep your mouth shut. Fish comes later.' };
  if (!nowId && S.stations.omakase.approved) return { mood: 'proud', text: 'Your place at the counter is waiting. Do not keep the guests waiting.' };
  if (kit.coat > 0.55) return { mood: 'angry', text: 'Look at your <em>coat</em>. Guests see your whites before they see your fish. Wash it.' };
  if (knifeFor && kit[knifeFor].sharp < 45) return { mood: 'stern', text: 'You cut with a <em>' + knifeFor + '</em> like that? Whetstone. Tonight.' };
  if (S.resolve < 25) return { mood: 'surprised', text: 'You look pale. …Eat something before service. <em>Then</em> back to work.' };
  if (last && last.score >= bar) return { mood: 'neutral', text: st.en + ' again. Once is luck. Show me <em>' + RULES.apprentice.streak[nowId] + ' in a row</em>.' };
  if (last) return { mood: 'stern', text: st.en + '. Yesterday was not good enough. ' + U.pick(['Again.', 'Do it until your hands know.', 'I am not watching for effort. I am watching the fish.']) };
  return { mood: 'neutral', text: st ? 'From today you start on <b>' + st.en + '</b>. Watch first. Then do it my way.' : 'Back to work.' };
}

/* ---------- levels: the master hands you harder work once you pass ---------- */
function stationLevel(id) {
  if (S.road && S.road.audition) return 3;
  const st = S.stations[id];
  const bar = S.path === 'apprentice' ? RULES.apprentice.bar[id] : RULES.academy.bar;
  return Math.min(4, 1 + st.tries.filter((t) => t.score >= bar).length);
}

/* ---------- small sound and haptics kit (starts on the first touch) ---------- */
const Sfx = {
  ctx: null, on: (() => { try { return localStorage.getItem('sushi-sound') !== 'off'; } catch (_) { return true; } })(), last: 0,
  wantAmb: false,
  wake() { if (!this.on) return; try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (_) { this.ctx = null; } if (this.wantAmb) this.ambience(true); },
  scene(amb) { this.wantAmb = amb; this.ambience(amb); },
  toggle() { this.on = !this.on; try { localStorage.setItem('sushi-sound', this.on ? 'on' : 'off'); } catch (_) {} if (!this.on) this.ambience(false); return this.on; },
  tone(freq, dur, gain, type) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq; g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, gain) {
    if (!this.on || !this.ctx) return;
    const n = Math.floor(this.ctx.sampleRate * dur), b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = gain; src.buffer = b; src.connect(g); g.connect(this.ctx.destination); src.start();
  },
  buzz(ms) { try { if (this.on && navigator.vibrate) navigator.vibrate(ms); } catch (_) {} },
  tick() { const n = performance.now(); if (n - this.last < 45) return; this.last = n; this.tone(2400 + Math.random() * 600, 0.025, 0.05, 'triangle'); this.buzz(4); },
  crunch() { const n = performance.now(); if (n - this.last < 90) return; this.last = n; this.noise(0.07, 0.25); this.buzz(25); },
  pop() { this.tone(900, 0.06, 0.06, 'sine'); },
  ok() { this.tone(660, 0.08, 0.05); setTimeout(() => this.tone(990, 0.1, 0.05), 70); },
  filtered(dur, gain, freq, q) {
    if (!this.on || !this.ctx) return;
    const n = Math.floor(this.ctx.sampleRate * dur), b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) { const k = i / n; d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * k); }
    const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 0.8; g.gain.value = gain;
    src.buffer = b; src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start();
  },
  cloth() { this.filtered(0.32, 0.22, 1400, 0.6); },
  stamp() { this.tone(110, 0.18, 0.22, 'sine'); this.noise(0.05, 0.18); this.buzz(40); },
  chime() { [1568, 2350, 3136].forEach((f, i) => this.tone(f * (1 + Math.random() * 0.01), 1.6 - i * 0.3, 0.025 / (i + 1), 'sine')); },
  /* rain on the eaves and a wind chime now and then, very quiet */
  amb: null,
  ambience(on) {
    if (!this.ctx || !this.on || !on) { if (this.amb) { try { this.amb.src.stop(); } catch (_) {} clearInterval(this.amb.t); this.amb = null; } return; }
    if (this.amb) return;
    const len = this.ctx.sampleRate * 3, b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0);
    let v = 0; for (let i = 0; i < len; i++) { v = v * 0.96 + (Math.random() * 2 - 1) * 0.04; d[i] = v + (Math.random() < 0.0006 ? (Math.random() - 0.5) * 0.6 : 0); }
    const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    src.buffer = b; src.loop = true; f.type = 'lowpass'; f.frequency.value = 1800; g.gain.value = 0.16;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start();
    this.amb = { src, t: setInterval(() => { if (Math.random() < 0.35) this.chime(); }, 9000) };
  },
};

function totalScore(items) {
  const w = items.reduce((s, i) => s + (i.w || 1), 0);
  return Math.round(items.reduce((s, i) => s + U.clamp(i.score, 0, 100) * (i.w || 1), 0) / w);
}

function masterLine(id, score, items, verdict) {
  const worst = items.slice().sort((a, b) => (100 - b.score) * (b.w || 1) - (100 - a.score) * (a.w || 1))[0];
  if (verdict === 'approved') return U.pick(['…Fine. From tomorrow you do this for the shop.', 'Mm. That is what I have been waiting for. Next.', 'Good. Do not get proud. Next station tomorrow.']);
  if (score >= 95) return 'Mm. Again tomorrow. Exactly the same.';
  if (score >= (S.path === 'apprentice' ? RULES.apprentice.bar[id] : RULES.academy.bar)) return U.pick(['Not bad. Once is luck. Again.', 'Good. Now do it every day.', 'Acceptable. Again.']) + (worst && worst.score < 80 ? ' ' + worst.tip : '');
  return worst ? worst.tip : 'Again.';
}

function finishGame(id, res) {
  if (current && current.destroy) current.destroy();
  current = null;
  const items = res.items;
  const kit = ensureKit(S);
  // your tools and your whites count too
  if (id === 'fillet' || id === 'slice') {
    const kind = id === 'fillet' ? 'deba' : 'yanagiba', kf = knifeFx(kind);
    const wsum = items.reduce((s, i) => s + (i.w || 1), 0);
    const gate = res.gate == null ? 1 : U.clamp(res.gate, 0, 1); // a sharp edge earns nothing on a butchered fish
    items.push({ label: 'Your ' + kind, detail: kf.name + (kf.sharp < 45 ? ', dull' : kf.sharp < 65 ? ', losing its edge' : ', sharp') + (gate < 0.85 ? ', wasted on this' : ''), value: 'edge ' + Math.round(kf.sharp), score: U.clamp(kf.sharp + 12 + kf.bonus * 2, 0, 100) * gate, w: wsum * 0.07,
      tip: gate < 0.85 ? 'A good knife in careless hands just cuts more damage.' : 'A dull ' + kind + ' tears what a sharp one slices. Whetstone, every night.' });
    wearKnife(kind);
  }
  if ((id === 'omakase' || id === 'nigiri') && kit.coat > 0.45) items.push({ label: 'Your coat', detail: 'stained whites at the counter', value: '', score: Math.round(100 - kit.coat * 70), w: 4, tip: 'Guests look at your coat before your fish. Wash it.' });
  let score = totalScore(items);
  if (res.cap != null && score > res.cap) score = res.cap;
  if ({ fillet: 0.22, slice: 0.12, tamago: 0.1, rice: 0.06, nigiri: 0.08 }[id]) stainCoat({ fillet: 0.22, slice: 0.12, tamago: 0.1, rice: 0.06, nigiri: 0.08 }[id] * U.clamp((100 - score) / 30, 0.3, 1.6));
  if (S.road && S.road.audition) return finishAudition(id, score, items);
  const st = S.stations[id];
  const isApp = S.path === 'apprentice';
  const before = { months: S.months, days: S.days, savings: S.savings, resolve: S.resolve };
  const lvBefore = stationLevel(id);
  const out = applyTry(S, id, score);
  if (kit.tied && out.verdict === 'rejected' && S.resolve < before.resolve && !out.quit) { const back = (before.resolve - S.resolve) / 2; S.resolve += back; res.tiedNote = 'The hachimaki steadied you: you lost ' + Math.round(before.resolve - S.resolve) + ' resolve instead of ' + Math.round(before.resolve - S.resolve + back) + '.'; }
  kit.tied = false;
  if (isApp && out.verdict === 'approved') {
    if (id === 'nigiri' && kit.apron === 'plain') { kit.apron = 'shop'; res.gift = 'The master hands you an indigo maekake with 鶴岡 dyed on it. From today you wear the shop\'s name at the counter.'; }
    if (id === 'omakase') { if (KIT.yanagiba.findIndex((x) => x.id === kit.yanagiba.grade) < 2) kit.yanagiba = { grade: 'blue2', sharp: 98, mei: true }; else kit.yanagiba.mei = true; res.gift = 'The master unwraps a yanagiba wrapped in cloth, your name engraved on the blade. "This one is yours. Look after it."'; }
  }
  const lvAfter = stationLevel(id);
  if (lvAfter > lvBefore && GAMES[id].levelName) res.levelUp = 'Next time the master gives you level ' + lvAfter + ': ' + GAMES[id].levelName(lvAfter) + (GAMES[id].levelNote ? '. ' + GAMES[id].levelNote(lvAfter).replace(/[^.!?]$/, (m) => m + '.') : '.');
  st.tries[st.tries.length - 1].stats = res.stats || {};
  const line = res.capLine && res.cap != null && score >= res.cap ? res.capLine : masterLine(id, score, items, out.verdict);
  out.events.forEach((e) => S.notes.push({ at: e.at, text: e.text + ' (resolve ' + (e.d >= 0 ? '+' : '') + e.d + ')' }));
  S.notes.push({ at: clockLabel(S), text: STATIONS[stationIndex(id)].en + ', try ' + st.tries.length + ': ' + score + '. ' + (out.verdict === 'approved' ? 'Approved. ' : '') + '"' + line + '"' });
  save();
  showResult(id, score, items, res, out.verdict, out.stamp, line, before, out.nextOpened, isApp && out.quit, out.events);
}

/* ---------- career summary (output for the business sim) ---------- */
function careerProfile() {
  const skills = {}; STATIONS.forEach((s) => { skills[s.id] = skillOf(s.id); });
  const q = Math.round(skills.rice * 0.25 + skills.nigiri * 0.2 + skills.slice * 0.15 + skills.fillet * 0.1 + skills.tamago * 0.1 + skills.market * 0.1 + skills.omakase * 0.1);
  const fy = S.stations.fillet.tries.slice(-3).map((t) => t.stats.yieldPct).filter((v) => v != null);
  const sw = S.stations.nigiri.tries.slice(-3).map((t) => t.stats.shariSd).filter((v) => v != null);

  const passed = STATIONS.filter((s) => bestOf(s.id) >= RULES.academy.bar).length;
  const formats = [];
  if (skills.omakase >= 80 && skills.nigiri >= 80 && skills.rice >= 80) formats.push('omakase counter');
  if (skills.nigiri >= 60 && skills.rice >= 60) formats.push('à la carte nigiri bar');
  if (skills.rice >= 45) formats.push('casual rolls and takeout');
  if (!formats.length) formats.push('none yet: rice is not good enough to sell');
  return {
    game: 'sushi-apprentice', version: 1,
    chef: S.name, path: S.path, outcome: S.ended ? S.ended.how : 'in training',
    trainedYears: +yearsTrained(S).toFixed(2),

    formatsUnlocked: formats,
    rollSkill: S.road && S.road.rolls != null ? S.road.rolls : S.rolls != null ? S.rolls : null,
  };
}

/* the master's face for a score */
function masterMood(score, bar, verdict) {
  if (verdict === 'approved') return 'proud';
  if (score >= 95) return 'pleased';
  if (score >= bar) return 'neutral';
  if (score >= bar - 15) return 'stern';
  return 'angry';
}

    const tag = (txt, x, y, right) => { ctx.font = '700 12px ' + font; const tw = ctx.measureText(txt).width + 16; const X = right ? x - tw : x; ctx.fillStyle = 'rgba(22,26,48,.85)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(X, y - 14, tw, 21, 10) : ctx.rect(X, y - 14, tw, 21); ctx.fill(); ctx.fillStyle = '#f5ecda'; ctx.fillText(txt, X + 8, y); };
    tag(P.grit + ' stone', 8, 20);
    tag('water ' + Math.round(water * 100) + '%', w - 8, 20, true);
    const sc = section();
    tag(P.id === 'ura' ? 'the back, flat' : sc.en + ' of the edge', 8, h - 10);
    tag(P.id === 'ura' ? 'square across' : 'about 45°', w - 8, h - 10, true);
    // the knife. Bevel down for the front: you see its flat back, at 45 degrees across the stone,
    // handle toward your right hand, edge toward you. For the back it lies square across the stone.
    const Gk = Tools.geo[kind], s = kind === 'deba' ? Math.min(1.9, G.sw / 34) : Math.min(1.55, G.sw / 52);
    const fx = p ? p.x : laneX(), fy = p ? p.y : sy0 + G.sh * 0.55;
    const ura = P.id === 'ura';
    const ang = ura ? Math.PI : -Math.PI * 0.75, mir = ura ? 1 : -1;
    const f = ura ? 0.5 : sc.f;
    const lx = -f * Gk.len, ly = (Gk.bot - 1.5) * Math.min(1, f * 3) * mir;  // a point just inside the edge, under your fingers
    const cs = Math.cos(ang), sn = Math.sin(ang);
    const tx = fx - (cs * lx * s - sn * ly * s), ty = fy - (sn * lx * s + cs * ly * s);
    ctx.save(); ctx.translate(tx, ty); ctx.rotate(ang); ctx.scale(1, mir);
    if (kind === 'deba') Tools.deba(ctx, 0, 0, 0, s); else Tools.yanagiba(ctx, 0, 0, 0, s);
    ctx.restore();
    // your left fingertips pressing the blade where it is being ground
    const fw = 7 * Math.max(0.8, s / 1.4);
    [[-1.1, -0.6], [0, 0], [1.1, 0.6]].forEach(([u, v], i) => {
      const along = u * fw * 1.25, px = fx + Math.cos(ang) * along * (ura ? 1 : 1) - Math.sin(ang) * v * fw * 0.2, py = fy + Math.sin(ang) * along + Math.cos(ang) * v * fw * 0.2;
      ctx.fillStyle = 'rgba(42,33,28,.22)'; ctx.beginPath(); ctx.ellipse(px + 1.5, py + 2, fw * 0.62, fw * 0.5, ang, 0, 7); ctx.fill();
      const g = ctx.createRadialGradient(px - fw * 0.2, py - fw * 0.2, 1, px, py, fw * 0.7); g.addColorStop(0, '#fbe3cc'); g.addColorStop(1, '#e0a77f');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(px, py, fw * 0.6, fw * 0.48, ang, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(42,33,28,.65)'; ctx.lineWidth = 1.1; ctx.stroke();
      ctx.fillStyle = 'rgba(253,233,223,.95)'; ctx.beginPath(); ctx.ellipse(px - Math.cos(ang) * fw * 0.18, py - Math.sin(ang) * fw * 0.18, fw * 0.28, fw * 0.2, ang, 0, 7); ctx.fill();
    });
  }
  draw(null);
  setTimeout(() => { if (!done) draw(lastP); }, 160);
  setTimeout(() => { const G = geo(); Demo.show(stage, st.c, 'whetstone2', [{ x: laneX(), y: G.sy0 + G.sh * 0.2 }, { x: laneX(), y: G.sy0 + G.sh * 0.8 }, { x: laneX(), y: G.sy0 + G.sh * 0.2 }, { x: laneX(), y: G.sy0 + G.sh * 0.8 }]); }, 300);
  function finish() {
    done = true; off();
    const acc = total ? inBand / total : 0;
    const before = k.sharp;
    k.sharp = Math.round(U.clamp(40 + acc * 58, k.sharp, 98) * (water > 0 ? 1 : 0.95));
    save();
    say('Sharpness ' + Math.round(before) + ' → <em>' + k.sharp + '</em>. ' + (acc > 0.85 ? 'A clean, even bevel.' : acc > 0.6 ? 'Uneven in places. Hold the angle.' : 'You rounded it. Again tomorrow.'));
    hint.firstChild.innerHTML = masterSVG(acc > 0.85 ? 'pleased' : acc > 0.6 ? 'neutral' : 'stern', 52);
    controls.innerHTML = '';
    controls.append(el('button', { class: 'btn primary', type: 'button', onclick: () => go(() => screenKit(back)) }, 'Back to your kit'));
  }
  current = { destroy() { off(); st.destroy(); } };
}

/* =====================================================================
   Fish geometry and the food-art kit shared by the stations: fish,
   eyes, the hinoki board, crushed ice, tuna tail cuts, nigiri.
   Static textures are painted once into offscreen canvases (fdCache)
   and reused every frame; the live parts are drawn on top.
   ===================================================================== */
function seeded(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* species: colours for the body (back, mid, belly), fins, eye size, plus rendering hints:
   iri iridescence, sc scale size, iris eye colour, tail fork depth, edge dark tail margin */
const SPECIES = {

  aji: { key: 'aji', en: 'Aji', jp: '鯵', note: 'horse mackerel', depth: 0.27, back: '#4f6f7a', mid: '#a3b5b1', belly: '#e8ece9', fin: '#c2b98a', eyeR: 0.042, kg: [0.16, 0.28], ppk: 1500, iri: 0.75, sc: 0.95, iris: '#d9c28a', fork: 1 },
  saba: { key: 'saba', en: 'Saba', jp: '鯖', note: 'mackerel', depth: 0.23, back: '#2a6470', mid: '#88adb0', belly: '#e8ecee', fin: '#7a9894', eyeR: 0.034, kg: [0.45, 0.8], ppk: 1300, iri: 1, sc: 0.7, iris: '#c8c2a0', fork: 1.1, finlets: true },

  katsuo: { key: 'katsuo', en: 'Katsuo', jp: '鰹', note: 'skipjack', depth: 0.30, back: '#232f4b', mid: '#6c84a3', belly: '#e9edf0', fin: '#46536d', eyeR: 0.03, kg: [2, 4], ppk: 1600, iri: 0.6, sc: 0.55, iris: '#c9c6b4', fork: 1.2, finlets: true },

function cubic(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return { x: u * u * u * p0.x + 3 * u * u * t * p1.x + 3 * u * t * t * p2.x + t * t * t * p3.x, y: u * u * u * p0.y + 3 * u * u * t * p1.y + 3 * u * t * t * p2.y + t * t * t * p3.y };
}

function fishGeom(cx, cy, L, depth) {
  const H = L * depth, l = cx - L / 2;
  const P = (x, y) => ({ x, y });
  const snout = P(l, cy + 0.02 * H);
  const dTop = P(cx + 0.05 * L, cy - 0.48 * H);
  const pedT = P(cx + 0.36 * L, cy - 0.10 * H);
  const dBot = P(cx - 0.05 * L, cy + 0.48 * H);
  const pedB = P(cx + 0.36 * L, cy + 0.10 * H);
  const top = [], bot = [];
  const segs = [
    [snout, P(l + 0.08 * L, cy - 0.42 * H), P(cx - 0.10 * L, cy - 0.54 * H), dTop, top],
    [dTop, P(cx + 0.20 * L, cy - 0.42 * H), P(cx + 0.30 * L, cy - 0.16 * H), pedT, top],
    [snout, P(l + 0.06 * L, cy + 0.30 * H), P(cx - 0.25 * L, cy + 0.48 * H), dBot, bot],
    [dBot, P(cx + 0.15 * L, cy + 0.48 * H), P(cx + 0.30 * L, cy + 0.16 * H), pedB, bot],
  ];
  segs.forEach(([a, b, c, d, arr], i) => { for (let k = (i % 2 ? 1 : 0); k <= 30; k++) arr.push(cubic(a, b, c, d, k / 30)); });
  const interp = (arr, x) => {
    if (x <= arr[0].x) return arr[0].y;
    for (let i = 1; i < arr.length; i++) if (arr[i].x >= x) { const a = arr[i - 1], b = arr[i]; return a.y + (b.y - a.y) * ((x - a.x) / Math.max(1e-6, b.x - a.x)); }
    return arr[arr.length - 1].y;
  };
  const g = {
    cx, cy, L, H, l, r: cx + L / 2, top, bot,
    topY: (x) => interp(top, x), botY: (x) => interp(bot, x),
    xGill: cx - 0.28 * L, xTailBase: cx + 0.36 * L, xVent: cx + 0.08 * L,
    eye: P(l + 0.12 * L, cy - 0.12 * H),
  };
  g.spineY = (x) => { const t = g.topY(x), b = g.botY(x); return t + (b - t) * 0.42; };
  g.outline = () => {
    const pts = top.slice();
    pts.push(P(cx + 0.5 * L, cy - 0.36 * H), P(cx + 0.44 * L, cy), P(cx + 0.5 * L, cy + 0.36 * H));
    for (let i = bot.length - 1; i >= 0; i--) pts.push(bot[i]);
    return pts;
  };
  g.path = (ctx) => { const pts = g.outline(); ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath(); };
  g.inside = (x, y) => x > g.l && x < g.xTailBase && y > g.topY(x) && y < g.botY(x);
  return g;
}

/* ---------- food-art kit: caching and colour helpers ---------- */
const FD_CACHE = new Map();
/* an offscreen canvas painted once per key (w, h in CSS px, painted at dpr) */
function fdCache(key, w, h, dpr, paint) {
  let c = FD_CACHE.get(key);
  if (c) { FD_CACHE.delete(key); FD_CACHE.set(key, c); return c; }
  c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * dpr)); c.height = Math.max(1, Math.ceil(h * dpr));
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  paint(x, w, h);
  FD_CACHE.set(key, c);
  while (FD_CACHE.size > 40) FD_CACHE.delete(FD_CACHE.keys().next().value);
  return c;
}
/* the device-pixel scale of whatever transform a context is using */
function fdDpr(ctx) { const m = ctx.getTransform ? ctx.getTransform() : null; return m ? U.clamp(Math.round(Math.hypot(m.a, m.b) * 4) / 4, 1, 3) : 1; }
function fdRgb(hex) { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
/* lighten (k > 0) or darken (k < 0) a hex colour; optional alpha */
function fdShade(hex, k, a) {
  const c = fdRgb(hex).map((v) => Math.round(k >= 0 ? v + (255 - v) * k : v * (1 + k)));
  return a == null ? 'rgb(' + c.join(',') + ')' : 'rgba(' + c.join(',') + ',' + a + ')';
}
function fdMix(a, b, t) { const x = fdRgb(a), y = fdRgb(b); return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',') + ')'; }
/* a soft elliptical shadow */
function fdShadow(x, cx, cy, rx, ry, a) {
  x.save(); x.translate(cx, cy); x.scale(1, ry / rx);
  const g = x.createRadialGradient(0, 0, 0, 0, 0, rx); g.addColorStop(0, 'rgba(30,20,15,' + a + ')'); g.addColorStop(0.6, 'rgba(30,20,15,' + (a * 0.45) + ')'); g.addColorStop(1, 'rgba(30,20,15,0)');
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, rx, 0, 7); x.fill(); x.restore();
}

/* ---------- the fish ----------
   opt: fresh 0..1, seed, scales (fn(x,y)->bool: still scaled), cutX (head removed left of it),
   sheenBoost (red lamps), noScutes (the fillet station draws aji scutes itself) */
function drawFish(ctx, g, sp, opt = {}) {
  const f = opt.fresh == null ? 0.9 : opt.fresh;
  const dpr = fdDpr(ctx);
  const padX = g.L * 0.08, padY = g.H * 0.5;
  const W = g.L + padX * 2, Hh = g.H + padY * 2;
  const ox = padX + g.L / 2, oy = padY + g.H / 2;
  const key = 'fish|' + sp.key + '|' + g.L.toFixed(1) + '|' + g.H.toFixed(1) + '|' + f.toFixed(2) + '|' + (opt.seed || 7) + '|' + (opt.sheenBoost || 1) + '|' + (opt.noScutes ? 1 : 0) + '|' + dpr;
  const img = fdCache(key, W, Hh, dpr, (x) => fdPaintFish(x, fishGeom(ox, oy, g.L, g.H / g.L), sp, f, opt));
  ctx.save();
  if (opt.cutX != null) { ctx.beginPath(); ctx.rect(opt.cutX, g.cy - g.H * 1.2, g.r - opt.cutX + g.L * 0.2, g.H * 2.4); ctx.clip(); }
  ctx.drawImage(img, g.cx - ox, g.cy - oy, W, Hh);
  ctx.restore();
  if (opt.scales) fdScaleOverlay(ctx, g, opt.scales);
  if (opt.cutX != null) fdCutFace(ctx, g, opt.cutX, sp);
}

/* the body outline without the tail (the tail is drawn as its own fin) */
function fdBodyPath(x, g) {
  x.beginPath(); x.moveTo(g.top[0].x, g.top[0].y);
  for (let i = 1; i < g.top.length; i++) x.lineTo(g.top[i].x, g.top[i].y);
  for (let i = g.bot.length - 1; i >= 0; i--) x.lineTo(g.bot[i].x, g.bot[i].y);
  x.closePath();
}
function fdTailPath(x, g, sp) {
  const { cx, cy, L, H } = g, k = sp.fork == null ? 1 : sp.fork;
  const b = cx + 0.355 * L, tipX = cx + 0.505 * L, forkX = cx + (0.5 - 0.06 * k) * L, tipY = 0.38 * H;
  x.beginPath();
  x.moveTo(b, cy - 0.105 * H);
  x.quadraticCurveTo(cx + 0.43 * L, cy - 0.16 * H, tipX, cy - tipY);
  x.quadraticCurveTo(cx + (0.47 - 0.02 * k) * L, cy - 0.12 * H, forkX, cy);
  x.quadraticCurveTo(cx + (0.47 - 0.02 * k) * L, cy + 0.12 * H, tipX, cy + tipY);
  x.quadraticCurveTo(cx + 0.43 * L, cy + 0.16 * H, b, cy + 0.105 * H);
  x.closePath();
}
/* a fin membrane: base points along the body, edge points out in the water; rays between them */
function fdFin(x, base, edge, col, lw, alpha) {
  x.save();
  x.globalAlpha = alpha == null ? 0.88 : alpha;
  const gb = base[0], ge = edge[Math.floor(edge.length / 2)];
  const gr = x.createLinearGradient(gb.x, gb.y, ge.x, ge.y);
  gr.addColorStop(0, col); gr.addColorStop(1, fdShade(col, 0.35, 0.55));
  x.fillStyle = gr;
  x.beginPath(); x.moveTo(base[0].x, base[0].y);
  edge.forEach((p) => x.lineTo(p.x, p.y));
  for (let i = base.length - 1; i >= 0; i--) x.lineTo(base[i].x, base[i].y);
  x.closePath(); x.fill();
  x.globalAlpha = 1;
  x.strokeStyle = fdShade(col, -0.35, 0.55); x.lineWidth = lw * 0.55; x.lineCap = 'round';
  const n = Math.max(edge.length, 3);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const bp = base[Math.round(t * (base.length - 1))], ep = edge[Math.round(t * (edge.length - 1))];
    x.beginPath(); x.moveTo(bp.x, bp.y); x.lineTo(U.lerp(bp.x, ep.x, 0.96), U.lerp(bp.y, ep.y, 0.96)); x.stroke();
  }
  x.strokeStyle = 'rgba(42,33,28,.45)'; x.lineWidth = lw * 0.7;
  x.beginPath(); edge.forEach((p, i) => (i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y))); x.stroke();
  x.restore();
}

function fdPaintFish(x, g, sp, f, opt) {
  const { cx, cy, L, H } = g;
  const rnd = seeded(opt.seed || 7);
  const lw = Math.max(1, L * 0.0055);
  const boost = opt.sheenBoost || 1;
  const P = (px, py) => ({ x: px, y: py });
  // contact shadow
  fdShadow(x, cx + L * 0.03, cy + H * 0.5, L * 0.44, H * 0.2, 0.2);
  // ----- fins behind the body -----
  const topAt = (px, d) => P(px, g.topY(px) + d);
  const botAt = (px, d) => P(px, g.botY(px) + d);
  if (sp.key === 'madai' || sp.key === 'kinmedai') {
    const x0 = cx - 0.18 * L, x1 = cx + 0.33 * L, n = sp.key === 'madai' ? 12 : 9;
    const base = [], edge = [];
    for (let i = 0; i <= n; i++) { const px = U.lerp(x0, x1, i / n); base.push(topAt(px, H * 0.04)); edge.push(P(px + L * 0.008, g.topY(px) - (i % 2 ? 0.07 : 0.15) * H * (1 - i / (n + 4)))); }
    fdFin(x, base, edge, sp.fin, lw);
  } else {
    const fin = (a, b, peakX, peakH) => { const base = [], edge = []; for (let i = 0; i <= 6; i++) { const px = U.lerp(a, b, i / 6); base.push(topAt(px, H * 0.04)); const t = i / 6; const hgt = t < (peakX - a) / (b - a) ? t / ((peakX - a) / (b - a)) : 1 - (t - (peakX - a) / (b - a)) / (1 - (peakX - a) / (b - a)) * 0.85; edge.push(P(px + L * 0.012 * t, g.topY(px) - peakH * H * Math.max(0.08, hgt))); } fdFin(x, base, edge, sp.fin, lw); };
    fin(cx - 0.13 * L, cx + 0.08 * L, cx - 0.07 * L, sp.key === 'katsuo' ? 0.3 : 0.22);
    fin(cx + 0.1 * L, cx + 0.3 * L, cx + 0.15 * L, 0.15);
  }
  { // anal fin
    const base = [], edge = [];
    for (let i = 0; i <= 6; i++) { const px = U.lerp(cx + 0.08 * L, cx + 0.28 * L, i / 6); base.push(botAt(px, -H * 0.04)); const t = i / 6; edge.push(P(px + L * 0.014 * t, g.botY(px) + Math.max(0.1, t < 0.22 ? t / 0.22 : 1 - (t - 0.22) * 1.05) * 0.12 * H)); }
    fdFin(x, base, edge, sp.fin, lw, 0.8);
  }
  if (sp.finlets) { // saba and katsuo carry little finlets before the tail
    x.fillStyle = fdShade(sp.fin, -0.1); x.strokeStyle = 'rgba(42,33,28,.4)'; x.lineWidth = lw * 0.5;
    for (let i = 0; i < 5; i++) { const px = cx + 0.31 * L + i * 0.011 * L; [[g.topY(px) + 1, -1], [g.botY(px) - 1, 1]].forEach(([py, s]) => { x.beginPath(); x.moveTo(px - L * 0.006, py); x.lineTo(px + L * 0.004, py + s * H * 0.05); x.lineTo(px + L * 0.006, py); x.closePath(); x.fill(); x.stroke(); }); }
  }
  { // pelvic fin (the far one, peeking out under the belly)
    const px = g.xGill + 0.07 * L;
    fdFin(x, [botAt(px, -H * 0.05), botAt(px + 0.05 * L, -H * 0.05)], [P(px + 0.06 * L, g.botY(px) + H * 0.12), P(px + 0.09 * L, g.botY(px) + H * 0.06)], sp.fin, lw, 0.75);
  }
  // ----- tail -----
  fdTailPath(x, g, sp);
  const tg = x.createLinearGradient(cx + 0.36 * L, 0, cx + 0.5 * L, 0);
  tg.addColorStop(0, fdShade(sp.fin, -0.08)); tg.addColorStop(1, fdShade(sp.fin, 0.22, 0.85));
  x.fillStyle = tg; x.fill();
  x.save(); fdTailPath(x, g, sp); x.clip();
  if (sp.edge) { x.strokeStyle = sp.edge; x.lineWidth = H * 0.06; fdTailPath(x, g, sp); x.stroke(); }
  x.strokeStyle = fdShade(sp.fin, -0.38, 0.5); x.lineWidth = lw * 0.55;
  for (let i = 0; i <= 12; i++) { const t = i / 12; const ey = cy + (t - 0.5) * 0.8 * H; const ex = cx + (0.5 - 0.06 * (1 - Math.abs(t - 0.5) * 2) * (sp.fork == null ? 1 : sp.fork)) * L; x.beginPath(); x.moveTo(cx + 0.36 * L, cy + (t - 0.5) * 0.16 * H); x.quadraticCurveTo(cx + 0.43 * L, cy + (t - 0.5) * 0.4 * H, ex, ey); x.stroke(); }
  x.restore();
  x.strokeStyle = 'rgba(42,33,28,.75)'; x.lineWidth = lw; x.lineJoin = 'round'; fdTailPath(x, g, sp); x.stroke();
  // ----- body -----

/* scales still on the fish (fillet station): bright raised scales where the predicate says so */

  const step = Math.max(5, g.L * 0.018);

  ctx.lineWidth = 1.1;
  for (let y = g.cy - g.H / 2; y < g.cy + g.H / 2; y += step * 0.8) for (let x = g.xGill; x < g.xTailBase; x += step) {
    const ox = x + ((Math.round((y - g.cy) / step) % 2) ? step / 2 : 0);

    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(ox, y, step * 0.55, -1.1, 1.1); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(ox, y, step * 0.55, -1.1, 1.1); ctx.stroke();
    ctx.strokeStyle = 'rgba(30,30,50,.14)'; ctx.beginPath(); ctx.arc(ox + 1, y + 0.6, step * 0.55, -0.9, 1.0); ctx.stroke();

/* where the head came off: flesh, the spine end and the blood behind it */

/* the eye: iris, pupil, a domed cornea that shines when fresh, haze when tired.

  const dome = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, 0, x - r * 0.35, y - r * 0.4, r * 0.9);
  dome.addColorStop(0, 'rgba(255,255,255,' + (0.35 * hl) + ')'); dome.addColorStop(1, 'rgba(255,255,255,0)');

    x.strokeStyle = dark ? 'rgba(148,104,52,' + (0.05 + r() * 0.1) + ')' : 'rgba(255,249,232,' + (0.07 + r() * 0.09) + ')';
    x.lineWidth = 0.4 + r() * 1.1;

  vg.addColorStop(0, 'rgba(70,40,15,0)'); vg.addColorStop(1, 'rgba(70,40,15,.24)');

}

/* ---------- crushed ice in a fish box ---------- */
function fdIce(ctx, w, h, seed) {
  const dpr = fdDpr(ctx);
  ctx.drawImage(fdCache('ice|' + Math.round(w) + 'x' + Math.round(h) + '|' + seed + '|' + dpr, w, h, dpr, (x) => {
    const bg = x.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#e9f2f6'); bg.addColorStop(1, '#cfdde5');
    x.fillStyle = bg; x.fillRect(0, 0, w, h);
    const r = seeded(seed || 1);
    const n = Math.round(w * h / 90);
    for (let i = 0; i < n; i++) {
      const cx = r() * w, cy = r() * h, s = 2.5 + r() * 7, k = 3 + Math.floor(r() * 3), a0 = r() * 6.28;
      x.beginPath(); for (let j = 0; j < k; j++) { const a = a0 + j / k * 6.28 + r() * 0.5, rr = s * (0.6 + r() * 0.5); j ? x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : x.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.closePath();
      x.fillStyle = r() < 0.5 ? 'rgba(255,255,255,' + (0.45 + r() * 0.4) + ')' : 'rgba(176,206,222,' + (0.25 + r() * 0.3) + ')'; x.fill();
      if (r() < 0.4) { x.strokeStyle = 'rgba(120,160,185,.25)'; x.lineWidth = 0.6; x.stroke(); }
      if (r() < 0.25) { x.fillStyle = 'rgba(255,255,255,.95)'; x.beginPath(); x.arc(cx - s * 0.25, cy - s * 0.25, 0.8, 0, 7); x.fill(); }
    }
    const lg = x.createRadialGradient(w * 0.3, 0, 0, w * 0.3, 0, Math.max(w, h)); lg.addColorStop(0, 'rgba(255,240,210,.22)'); lg.addColorStop(1, 'rgba(255,240,210,0)');
    x.fillStyle = lg; x.fillRect(0, 0, w, h);
    const vg = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.72); vg.addColorStop(0, 'rgba(40,70,100,0)'); vg.addColorStop(1, 'rgba(40,70,100,.22)');
    x.fillStyle = vg; x.fillRect(0, 0, w, h);

}

/* ---------- a bluefin tail cut: skin, fat ring, red meat in its rings, the spine, dark meat, yake ----------
   t: { color 0..1, fat 0..1, yake 0..1, seed }; light: the flashlight is on it */
function fdTunaTail(ctx, cx, cy, R, t, light) {
  const rs = seeded(t.seed || 3);
  ctx.save();
  fdShadow(ctx, cx + R * 0.08, cy + R * 0.12, R * 1.15, R * 1.0, 0.35);
  // skin
  const sk = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.4, R * 0.2, cx, cy, R);
  sk.addColorStop(0, '#5a6b84'); sk.addColorStop(0.7, '#27303f'); sk.addColorStop(1, '#141922');
  ctx.fillStyle = sk; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(200,215,235,.35)'; ctx.lineWidth = Math.max(1, R * 0.025); ctx.beginPath(); ctx.arc(cx, cy, R * 0.985, Math.PI * 1.05, Math.PI * 1.7); ctx.stroke();

  fg.addColorStop(0, 'rgba(246,230,214,' + (0.7 + t.fat * 0.3) + ')'); fg.addColorStop(1, 'rgba(232,212,196,' + (0.75 + t.fat * 0.25) + ')');
  ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(cx, cy, fr, 0, 7); ctx.fill();
  // meat
  const meat = R * (0.93 - 0.08 - t.fat * 0.12);
  const rr = Math.round(150 + t.color * 62), gg = Math.round(28 + (1 - t.color) * 52), bb = Math.round(40 + (1 - t.color) * 32);
  const mg = ctx.createRadialGradient(cx - meat * 0.25, cy - meat * 0.3, meat * 0.1, cx, cy, meat);
  mg.addColorStop(0, 'rgb(' + Math.min(255, rr + 26) + ',' + (gg + 18) + ',' + (bb + 16) + ')'); mg.addColorStop(0.7, 'rgb(' + rr + ',' + gg + ',' + bb + ')'); mg.addColorStop(1, 'rgb(' + Math.round(rr * 0.8) + ',' + Math.round(gg * 0.7) + ',' + Math.round(bb * 0.75) + ')');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(cx, cy, meat, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, meat, 0, 7); ctx.clip();

  if (t.fat > 0.45) { ctx.strokeStyle = 'rgba(255,236,226,' + (0.12 + (t.fat - 0.45) * 0.8) + ')'; ctx.lineWidth = Math.max(0.8, R * 0.011); for (let i = 0; i < 16; i++) { const a = rs() * 6.28, r0 = meat * (0.74 + rs() * 0.2); ctx.beginPath(); ctx.arc(cx, cy, r0, a, a + 0.3 + rs() * 0.5); ctx.stroke(); } }

      ctx.strokeStyle = 'rgba(255,222,214,' + ((0.1 + t.fat * 0.18) * (1 - i * 0.08)) + ')'; ctx.lineWidth = Math.max(0.7, R * (0.009 + t.fat * 0.006));
      ctx.beginPath(); ctx.ellipse(qx + sx * i * meat * 0.012, qy, rr0 * 1.12, rr0, 0, 0, 7); ctx.stroke();
    }
    ctx.restore();

  ctx.strokeStyle = 'rgba(255,236,230,.42)'; ctx.lineWidth = Math.max(0.8, R * 0.013);
  ctx.beginPath(); ctx.moveTo(cx - meat, cy + meat * 0.02); ctx.quadraticCurveTo(cx, cy - meat * 0.03, cx + meat, cy + meat * 0.02); ctx.moveTo(cx, cy - meat); ctx.quadraticCurveTo(cx + meat * 0.02, cy, cx, cy + meat); ctx.stroke();
  // dark meat (chiai) beside the spine along the lateral line
  [-1, 1].forEach((s) => { const dg = ctx.createRadialGradient(cx + s * meat * 0.3, cy, 0, cx + s * meat * 0.3, cy, meat * 0.2); dg.addColorStop(0, 'rgba(86,14,24,.85)'); dg.addColorStop(1, 'rgba(86,14,24,0)'); ctx.fillStyle = dg; ctx.beginPath(); ctx.ellipse(cx + s * meat * 0.3, cy, meat * 0.22, meat * 0.13, 0, 0, 7); ctx.fill(); });

  if (t.yake) { ctx.fillStyle = 'rgba(176,156,156,' + ((light ? 0.55 : 0.2) * t.yake) + ')'; for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.ellipse(cx + (rs() - 0.5) * meat * 1.1, cy + (rs() - 0.5) * meat * 1.1, meat * (0.16 + rs() * 0.12), meat * (0.1 + rs() * 0.08), rs() * 3, 0, 7); ctx.fill(); } }
  // gloss on the cut face
  ctx.fillStyle = 'rgba(255,255,255,' + (0.1 + t.color * 0.12) + ')'; ctx.beginPath(); ctx.ellipse(cx - meat * 0.35, cy - meat * 0.45, meat * 0.42, meat * 0.14, -0.5, 0, 7); ctx.fill();
  ctx.restore();
  // the spine at the centre
  const vr = R * 0.085;
  ctx.fillStyle = '#efe8dc'; ctx.beginPath(); for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4; ctx.ellipse(cx + Math.cos(a) * vr * 0.55, cy + Math.sin(a) * vr * 0.55, vr * 0.62, vr * 0.62, 0, 0, 7); } ctx.fill();
  ctx.fillStyle = '#e4dccd'; ctx.beginPath(); ctx.arc(cx, cy, vr, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(120,100,90,.5)'; ctx.beginPath(); ctx.arc(cx, cy, vr * 0.38, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(42,33,28,.6)'; ctx.lineWidth = Math.max(1, R * 0.02); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  // the flashlight
  if (light) { const lg = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, 2, cx, cy, R * 1.1); lg.addColorStop(0, 'rgba(255,255,232,.5)'); lg.addColorStop(1, 'rgba(255,255,232,0)'); ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(cx, cy, R * 1.1, 0, 7); ctx.fill(); }
  ctx.restore();
}

/* ---------- rice and nigiri ---------- */
/* one grain of cooked rice: plump, pearly, with a glint */
function fdGrain(x, px, py, len, a, tint, gloss) {
  const c = Math.cos(a), s = Math.sin(a);
  x.fillStyle = 'rgba(150,130,100,.22)'; x.beginPath(); x.ellipse(px + 0.5, py + 0.7, len * 0.52, len * 0.28, a, 0, 7); x.fill();
  x.fillStyle = tint || '#f8f4ea'; x.beginPath(); x.ellipse(px, py, len * 0.5, len * 0.27, a, 0, 7); x.fill();
  if (gloss) { x.fillStyle = 'rgba(255,255,255,' + gloss + ')'; x.beginPath(); x.ellipse(px - c * len * 0.12 - s * len * 0.06, py - s * len * 0.12 - len * 0.07, len * 0.2, len * 0.08, a, 0, 7); x.fill(); }
}
/* neta colours and texture, by kind */
const FD_NETA = {

  hirame: { c0: '#fbf6f0', c1: '#efe2d8', skin: null, tex: 'white' },
  kohada: { c0: '#e8edf0', c1: '#c3cfd6', skin: '#6f8592', tex: 'silver' },
  aji: { c0: '#efe2e0', c1: '#c9b7c0', skin: '#7f98a0', tex: 'silver' },
  saba: { c0: '#f0dcd8', c1: '#b9c7cc', skin: '#3f7680', tex: 'silver' },
  akami: { c0: '#b3222d', c1: '#7e1520', skin: null, tex: 'red' },
  zuke: { c0: '#9c1c27', c1: '#5e0f18', skin: null, tex: 'red', glaze: true },
  chutoro: { c0: '#e8939a', c1: '#c9606c', skin: null, tex: 'toro' },
  otoro: { c0: '#f1b9bc', c1: '#dc8f98', skin: null, tex: 'toro' },
  anago: { c0: '#c58a55', c1: '#87522b', skin: '#5b351c', tex: 'anago', glaze: true },
  ebi: { c0: '#fbf2ea', c1: '#f39a6c', skin: null, tex: 'ebi' },
  tamago: { c0: '#f6d465', c1: '#e3a93a', skin: null, tex: 'tamago' },
  hamachi: { c0: '#f6e2d6', c1: '#e9b9a8', skin: null, tex: 'white' },
  salmon: { c0: '#f59a62', c1: '#e7713e', skin: null, tex: 'salmon' },
  uni: { c0: '#f5b23f', c1: '#e08b1f', skin: null, tex: 'uni' },

/* the neta slab, draped over the rice in three-quarter view: centred at (cx, cy),
   half-length rx, half-depth ry of the top surface; the cut edge shows at the front */
function fdNeta(x, kind, cx, cy, rx, ry, seed, droop) {
  const N = FD_NETA[kind] || FD_NETA.madai, r = seeded(seed || 5);
  const th = Math.max(1.6, ry * 0.5), d = droop == null ? ry * 0.3 : droop;
  const cyT = cy - ry - d * 0.35;

  const fwd = (o) => { x.lineTo(cx + rx * 0.97, cy + d * 0.94 + ry * 0.3 + o); x.bezierCurveTo(cx + rx * 0.55, cyT + ry * 2 + o, cx - rx * 0.55, cyT + ry * 2 + o, cx - rx * 0.97, cy + d + ry * 0.3 + o); };
  const topP = () => { x.beginPath(); back(); fwd(0); x.closePath(); };

  x.strokeStyle = 'rgba(42,33,28,.45)'; x.lineWidth = Math.max(0.6, ry * 0.06); frontP(); x.stroke();

  topP();
  const g = x.createRadialGradient(cx - rx * 0.2, cy - ry * 0.5, ry * 0.2, cx, cy, rx * 1.05); g.addColorStop(0, fdShade(N.c0, 0.12)); g.addColorStop(0.65, N.c0); g.addColorStop(1, N.c1);

    x.strokeStyle = N.tex === 'red' ? 'rgba(255,170,175,.24)' : N.tex === 'salmon' ? 'rgba(255,240,225,.75)' : 'rgba(255,246,242,.72)'; x.lineWidth = Math.max(0.7, ry * (N.tex === 'red' ? 0.07 : 0.13));
    for (let i = -7; i <= 7; i++) { const px = cx + i * rx * 0.17; x.beginPath(); x.moveTo(px - rx * 0.18, cy + ry * 1.1); x.bezierCurveTo(px - rx * 0.02, cy + ry * 0.2, px + rx * 0.05, cy - ry * 0.4, px + rx * 0.2, cy - ry * 1.2); x.stroke(); }
  }
  if (N.tex === 'white') { x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = Math.max(0.6, ry * 0.06); for (let i = -6; i <= 6; i++) { const px = cx + i * rx * 0.18; x.beginPath(); x.moveTo(px - rx * 0.1, cy + ry); x.quadraticCurveTo(px + rx * 0.1, cy, px, cy - ry * 1.1); x.stroke(); } x.fillStyle = 'rgba(255,200,200,.18)'; x.beginPath(); x.ellipse(cx, cy - ry * 0.8, rx, ry * 0.3, 0, 0, 7); x.fill(); }

      x.fillStyle = 'rgba(36,48,58,.75)'; for (let i = 0; i < 11; i++) { const t = i / 10, px = cx - rx * 0.85 + t * rx * 1.7; x.beginPath(); x.arc(px, cy - ry * (0.72 + 0.12 * Math.sin(t * Math.PI)) + (i % 2) * ry * 0.16, Math.max(0.6, ry * 0.065), 0, 7); x.fill(); }
      x.strokeStyle = 'rgba(42,33,28,.4)'; x.lineWidth = Math.max(0.6, ry * 0.05); for (let i = -1; i <= 1; i++) { x.beginPath(); x.moveTo(cx + i * rx * 0.36 - ry * 0.18, cy - ry * 1.0); x.lineTo(cx + i * rx * 0.36 + ry * 0.22, cy - ry * 0.25); x.stroke(); }
    } else {
      skinLine(0, ry * 0.42, N.skin);
      skinLine(ry * 0.1, ry * 0.1, 'rgba(255,255,255,.4)');
    }
  }
  if (N.tex === 'anago') { x.strokeStyle = 'rgba(60,30,12,.5)'; x.lineWidth = Math.max(0.8, ry * 0.16); for (let i = -2; i <= 2; i++) { x.beginPath(); x.moveTo(cx + i * rx * 0.36 - ry * 0.4, cy - ry); x.lineTo(cx + i * rx * 0.36 + ry * 0.4, cy + ry); x.stroke(); } }
  if (N.tex === 'ebi') { x.strokeStyle = 'rgba(232,96,60,.85)'; x.lineWidth = Math.max(1, ry * 0.3); for (let i = -3; i <= 3; i++) { x.beginPath(); x.moveTo(cx + i * rx * 0.27, cy - ry * 1.1); x.quadraticCurveTo(cx + i * rx * 0.27 + rx * 0.08, cy, cx + i * rx * 0.27, cy + ry * 0.8); x.stroke(); } }
  if (N.tex === 'tamago') { x.fillStyle = 'rgba(165,100,30,.3)'; for (let i = 0; i < 7; i++) { x.beginPath(); x.ellipse(cx + (r() - 0.5) * rx * 1.6, cy - ry * 0.5 + r() * ry * 0.9, rx * 0.12, ry * 0.16, 0, 0, 7); x.fill(); } }
  if (N.tex === 'uni') { x.fillStyle = 'rgba(255,218,140,.65)'; for (let i = 0; i < 18; i++) { x.beginPath(); x.arc(cx + (r() - 0.5) * rx * 1.7, cy + (r() - 0.5) * ry * 1.4, Math.max(0.7, ry * 0.1), 0, 7); x.fill(); } }

  const gl = x.createLinearGradient(cx, cy - ry, cx, cy + ry * 0.3);

  x.beginPath(); x.ellipse(cx + rx * 0.18, cyC - ry * 0.18, rx * 0.07, Math.max(0.5, ry * 0.06), 0.1, 0, 7); x.fill();
  x.restore();
