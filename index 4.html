        ctx.fillStyle = '#3e3a37'; ctx.beginPath(); ctx.ellipse(cx, cy - ph * 0.12, pw * 0.6, ph * 0.12, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#5c5651'; ctx.beginPath(); ctx.ellipse(cx, cy - ph * 0.15, pw * 0.6, ph * 0.11, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(cx, cy - ph * 0.15, pw * 0.58, ph * 0.1, 0, Math.PI * 1.05, Math.PI * 1.7); ctx.stroke();
        // lid of thick planks with a handle bar
        const ly2 = cy - ph * 0.28;
        ctx.fillStyle = '#8a6438'; ctx.beginPath(); ctx.ellipse(cx, ly2 + 6, pw * 0.46, ph * 0.12, 0, 0, 7); ctx.fill();
        const lg2 = ctx.createLinearGradient(cx - pw * 0.46, 0, cx + pw * 0.46, 0); lg2.addColorStop(0, '#c99a5e'); lg2.addColorStop(0.5, '#e2bd85'); lg2.addColorStop(1, '#b08048');
        ctx.fillStyle = lg2; ctx.beginPath(); ctx.ellipse(cx, ly2, pw * 0.46, ph * 0.12, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(110,75,35,.45)'; ctx.lineWidth = 1; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(cx + i * pw * 0.15, ly2 - ph * 0.11); ctx.lineTo(cx + i * pw * 0.15, ly2 + ph * 0.11); ctx.stroke(); }
        ctx.strokeStyle = 'rgba(42,33,28,.6)'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.ellipse(cx, ly2, pw * 0.46, ph * 0.12, 0, 0, 7); ctx.stroke();
        ctx.fillStyle = '#7b5a32'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - pw * 0.28, ly2 - 10, pw * 0.56, 9, 3) : ctx.rect(cx - pw * 0.28, ly2 - 10, pw * 0.56, 9); ctx.fill(); ctx.strokeStyle = 'rgba(42,33,28,.6)'; ctx.stroke();
        // starchy foam spills at the lid while it boils
        if (cooking) { ctx.fillStyle = 'rgba(250,248,240,.85)'; for (let i = 0; i < 12; i++) { const a = Math.PI * (0.05 + i * 0.08), bx = cx + Math.cos(a) * pw * 0.47, by2 = ly2 + Math.sin(a) * ph * 0.12 + 4; ctx.beginPath(); ctx.arc(bx, by2, 2 + Math.abs(Math.sin(t * 6 + i)) * 2.5, 0, 7); ctx.fill(); } }
        const n = cooking ? 3 : Math.max(0, 3 - Math.floor(steamMin / 8));
        for (let i = 0; i < n; i++) steamCurl(ctx, cx - 30 + i * 30, ly2 - 14, i * 2, t * 1000, cooking ? 0.6 : 0.45, 0);
      });
    }

    /* ================= AWASE-ZU ================= */
    function season() {
      phase = 'season'; api.setSteps(STEPS, 3); api.clearControls();
      api.hint('Turn the rice into the hangiri and <em>pour the awase-zu while it is hot</em>. The master\'s recipe: red vinegar (akazu), salt, a little sugar. ' + (BATCH > 1 ? 'Ten gō of rice takes about <em>600 ml</em>.' : 'Five gō of rice takes about <em>300 ml</em>.') + ' Hold to pour.');
      const opened = performance.now();
      let ml = 0, pouring = false, poured = false;
      const pour = holdBtn('Hold to pour awase-zu', { cls: 'wood', start: () => { pouring = true; }, end: () => { pouring = false; if (ml > 0) { poured = true; next.disabled = false; } } });
      const next = el('button', { class: 'btn primary', type: 'button', disabled: true }, 'Start mixing');
      const tempChip = el('span', { class: 'chip' }, 'Rice ', el('b', null, '92°C'));
      api.controls.append(el('div', { class: 'readout' }, tempChip), pour, next);
      let T = 92;
      if (window.__rice) { window.__rice.ml = () => ml; window.__rice.T = () => T; }
      next.onclick = () => { R.ml = ml; R.delay = (performance.now() - opened) / 1000; cleanup(); mix(T); };
      stop = Loop((dt) => {
        T = Math.max(20, T - dt * 0.35);
        if (pouring) ml += dt * 85 * BATCH;
        tempChip.lastChild.textContent = FEEL ? feelOf(T) : Math.round(T) + '°C';
        const { ctx, w, h } = st;
        drawBoard(ctx, w, h, '#e9dcc0');
        // measuring jug: heavy glass
        const jx = w * 0.62, jy = h * 0.12, jw = w * 0.22, jh = h * 0.72;
        fdShadow(ctx, jx + jw / 2 + 5, jy + jh + 3, jw * 0.7, 8, 0.3);
        const cap = 500 * BATCH; const lvl = Math.max(0, (cap - Math.min(cap, ml + 0)) / cap);
        const vg = ctx.createLinearGradient(jx, 0, jx + jw, 0); vg.addColorStop(0, 'rgba(120,55,30,.85)'); vg.addColorStop(0.5, 'rgba(176,96,58,.78)'); vg.addColorStop(1, 'rgba(110,48,26,.88)');
        ctx.fillStyle = vg; ctx.fillRect(jx + 2, jy + jh * (1 - lvl), jw - 4, jh * lvl - 2);
        if (lvl > 0.01) { ctx.fillStyle = 'rgba(255,220,190,.45)'; ctx.fillRect(jx + 2, jy + jh * (1 - lvl), jw - 4, 2); }
        ctx.fillStyle = 'rgba(220,235,240,.18)'; ctx.fillRect(jx, jy, jw, jh);
        ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(jx + 4, jy + 6, 3, jh - 12); ctx.fillRect(jx + jw - 9, jy + 10, 1.5, jh * 0.5);
        ctx.strokeStyle = 'rgba(42,33,28,.75)'; ctx.lineWidth = 2; ctx.strokeRect(jx, jy, jw, jh);
        ctx.strokeStyle = 'rgba(42,33,28,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(jx + jw, jy + jh * 0.15); ctx.quadraticCurveTo(jx + jw + 18, jy + jh * 0.2, jx + jw + 14, jy + jh * 0.45); ctx.quadraticCurveTo(jx + jw + 10, jy + jh * 0.55, jx + jw, jy + jh * 0.55); ctx.stroke();
        ctx.lineWidth = 2;
        ctx.fillStyle = '#27211c'; ctx.font = '11px ' + font();
        for (let m = 100 * BATCH; m <= cap; m += 100 * BATCH) { const y = jy + jh - jh * m / cap; ctx.beginPath(); ctx.moveTo(jx, y); ctx.lineTo(jx + 10, y); ctx.stroke(); ctx.fillText(String(m), jx + 14, y + 4); }
        ctx.font = '600 13px ' + font(); ctx.fillText('jug started at ' + cap + ' ml', jx - 20, jy + jh + 18);
        // hangiri
        const cx = w * 0.3, cy = h * 0.55, rad = Math.min(w * 0.22, h * 0.36);
        hangiri(ctx, cx, cy, rad);
        // a hot mound of rice turned out of the pot
        const rg2 = ctx.createRadialGradient(cx - rad * 0.3, cy - rad * 0.3, rad * 0.1, cx, cy, rad); rg2.addColorStop(0, '#fffdf7'); rg2.addColorStop(1, '#e8e1d2');
        ctx.fillStyle = rg2; ctx.beginPath(); ctx.arc(cx, cy, rad * 0.96, 0, 7); ctx.fill();
        grainBed(ctx, cx, cy, rad * 0.9, rad * 0.045, '#f8f5ec', 0.55, false, 0, 2);
        if (ml > 0) { const vg2 = ctx.createRadialGradient(cx - rad * 0.1, cy, 0, cx - rad * 0.1, cy, rad * 0.65); vg2.addColorStop(0, 'rgba(170,100,60,' + Math.min(0.5, ml / 800) + ')'); vg2.addColorStop(1, 'rgba(170,100,60,0)'); ctx.fillStyle = vg2; ctx.beginPath(); ctx.ellipse(cx - rad * 0.1, cy, rad * 0.65, rad * 0.45, 0.3, 0, 7); ctx.fill(); }
        if (pouring) { ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(150,80,50,.85)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(jx, jy + 10); ctx.quadraticCurveTo(cx + rad, jy, cx, cy); ctx.stroke(); ctx.strokeStyle = 'rgba(255,220,190,.5)'; ctx.lineWidth = 1.2; ctx.stroke(); }
        const tnow = performance.now();
        for (let i = 0; i < 2; i++) steamCurl(ctx, cx - 15 + i * 30, cy - rad * 0.3, i * 3, tnow, 0.55 * U.clamp(T / 90, 0, 1), 0);
      });
      season.T = () => T;
    }

    /* ================= MIX & COOL ================= */
    function mix(T0) {
      phase = 'mix'; api.setSteps(STEPS, 4); api.clearControls();
      api.hint('<em>Cut</em> through the rice with the shamoji in quick straight strokes to spread the vinegar. Do not stir in circles or press: that mashes it. Fan it to drive off steam and bring it down to <em>body temperature</em>.');
      const G = 14; const cells = [];
      for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) { const x = (i + 0.5) / G * 2 - 1, y = (j + 0.5) / G * 2 - 1; cells.push({ x, y, in: x * x + y * y < 0.85, c: 0 }); }
      const inCells = cells.filter((c) => c.in);
      // pour pattern: a few puddles
      const blobs = [0, 1, 2].map(() => ({ x: U.rand(-0.4, 0.4), y: U.rand(-0.4, 0.4), r: U.rand(0.25, 0.45) }));
      inCells.forEach((c) => { c.c = blobs.reduce((s, b) => s + Math.exp(-((c.x - b.x) ** 2 + (c.y - b.y) ** 2) / (b.r * b.r)), 0.03); });
      const m0 = U.mean(inCells.map((c) => c.c)); inCells.forEach((c) => { c.c /= m0; });
      let T = T0, fan = false, even = 0, fanSecs = 0;
      if (window.__rice) { window.__rice.T = () => T; window.__rice.even = () => even; }
      const fanBtn = el('button', { class: 'btn wood', type: 'button' }, 'Start fanning');
      fanBtn.onclick = () => { fan = !fan; fanBtn.textContent = fan ? 'Stop fanning' : 'Start fanning'; fanBtn.classList.toggle('on', fan); };
      const doneBtn = el('button', { class: 'btn primary', type: 'button' }, 'Done, cover with a damp cloth');
      const tChip = el('span', { class: 'chip' }, FEEL ? 'Feels ' : 'Rice ', el('b', null, FEEL ? feelOf(T) : Math.round(T) + '°C'));
      const eChip = el('span', { class: 'chip' }, 'Even ', el('b', null, '0%'));
      const mChip = el('span', { class: 'chip' }, 'Mashed ', el('b', null, '0%'));
      api.controls.append(el('div', { class: 'readout' }, tChip, FEEL ? null : eChip, FEEL ? null : mChip), el('div', { class: 'row' }, fanBtn, doneBtn));
      setTimeout(() => { const { cx, cy, rad } = geom(); api.demo && api.demo('cut', [{ x: cx - rad * 0.6, y: cy - rad * 0.3 }, { x: cx + rad * 0.6, y: cy - rad * 0.3 }, { x: cx - rad * 0.6, y: cy + rad * 0.2 }, { x: cx + rad * 0.6, y: cy + rad * 0.2 }], { duration: 1500 }); }, 400);
      const evenness = () => { const m = U.mean(inCells.map((c) => c.c)); return U.clamp(1 - U.sd(inCells.map((c) => c.c)) / m, 0, 1); };
      even = evenness();
      let path = [];
      const geom = () => { const cx = st.w / 2, cy = st.h / 2, rad = Math.min(st.w, st.h) * 0.44; return { cx, cy, rad }; };
      offPtr = track(st.c, {
        down(p) { path = [p]; },
        move(p) {
          const q = path[path.length - 1]; path.push(p);
          const { cx, cy, rad } = geom();
          const k = 0.35 * U.clamp((T - 28) / 40, 0.12, 1) / (BATCH > 1 ? 1.6 : 1);
          const steps = Math.max(1, Math.ceil(U.dist(p, q) / 6));
          for (let s = 1; s <= steps; s++) {
            const x = (U.lerp(q.x, p.x, s / steps) - cx) / rad, y = (U.lerp(q.y, p.y, s / steps) - cy) / rad;
            const near = inCells.filter((c) => (c.x - x) ** 2 + (c.y - y) ** 2 < 0.05);
            if (near.length) { const m = U.mean(near.map((c) => c.c)); near.forEach((c) => { c.c = U.lerp(c.c, m, k); }); }
          }
          // spread toward global mean slowly along the stroke (cutting folds rice over)
          even = evenness();
        },
        up() {
          if (path.length > 2) {
            let len = 0; for (let i = 1; i < path.length; i++) len += U.dist(path[i], path[i - 1]);
            const chord = U.dist(path[0], path[path.length - 1]);
            const dur = (path[path.length - 1].t - path[0].t) / 1000;
            const k = st.w / 320;
            const straight = chord / Math.max(1, len);
            if (len > 40 * k && straight < 0.7) R.mash += len * 0.0011 / k;     // stirring
            if (len > 30 * k && len / Math.max(0.05, dur) < 110 * k) R.mash += len * 0.0006 / k; // pressing / dragging slowly
          }
          path = [];
          mChip.lastChild.textContent = Math.round(Math.min(99, R.mash * 100)) + '%';
        },
      });
      doneBtn.onclick = () => { R.temp = T; R.even = even; R.fanSecs = fanSecs; cleanup(); finish(); };
      stop = Loop((dt, t) => {
        T = Math.max(18, T - dt * (0.16 + (fan ? 1.45 : 0)) * (T - 18) / 30 * HUMID / (BATCH > 1 ? 1.35 : 1));
        if (fan) { fanSecs += dt; if (T > 38 && even > 0.7) R.gloss = Math.min(1, R.gloss + dt / 9); }
        tChip.lastChild.textContent = FEEL ? feelOf(T) : Math.round(T) + '°C';
        tChip.className = 'chip' + (FEEL ? '' : T < 33 ? ' bad' : T <= 41 ? '' : ' warn');
        eChip.lastChild.textContent = Math.round(even * 100) + '%';
        const { ctx, w, h } = st;
        const { cx, cy, rad } = geom();
        drawBoard(ctx, w, h, '#e9dcc0');
        hangiri(ctx, cx, cy, rad);
        const rg3 = ctx.createRadialGradient(cx - rad * 0.3, cy - rad * 0.3, rad * 0.1, cx, cy, rad); rg3.addColorStop(0, '#fbf8f0'); rg3.addColorStop(1, '#e6dfd0');
        ctx.fillStyle = rg3; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.fill();
        const cs = rad * 2 / G;
        ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.clip(); inCells.forEach((c) => { const a = U.clamp(c.c * 0.13, 0, 0.42); if (a < 0.01) return; const gx = cx + c.x * rad, gy = cy + c.y * rad; const gr = ctx.createRadialGradient(gx, gy, 0, gx, gy, cs * 1.1); gr.addColorStop(0, 'rgba(165,100,62,' + a + ')'); gr.addColorStop(1, 'rgba(165,100,62,0)'); ctx.fillStyle = gr; ctx.fillRect(gx - cs * 1.1, gy - cs * 1.1, cs * 2.2, cs * 2.2); }); ctx.restore();
        ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.clip();
        grainBed(ctx, cx, cy, rad * 0.97, rad * 0.032, '#faf6ec', 0.2 + R.gloss * 0.6, false, 0, 2);
        if (R.mash > 0.05) { ctx.fillStyle = 'rgba(235,230,215,' + Math.min(0.6, R.mash * 0.8) + ')'; ctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2); }
        if (R.gloss > 0.1) { ctx.fillStyle = 'rgba(255,255,255,' + R.gloss * 0.9 + ')'; for (let i = 0; i < 60; i++) { const gr = grains[i * 11 % grains.length]; ctx.beginPath(); ctx.arc(cx + gr.x * rad, cy + gr.y * rad, 1.2, 0, 7); ctx.fill(); } }
        ctx.restore();
        if (path.length > 1) { ctx.strokeStyle = 'rgba(120,85,45,.35)'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); path.slice(-8).forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); const q = path[path.length - 1], q0 = path[Math.max(0, path.length - 4)]; Tools.shamoji(ctx, q.x, q.y, Math.atan2(q.y - q0.y, q.x - q0.x) + Math.PI / 2, st.w / 400); }
        const steam = U.clamp((T - 35) / 45, 0, 1);
        if (steam > 0.02) for (let i = 0; i < 3; i++) steamCurl(ctx, cx - 40 + i * 40, cy - rad * 0.2, i * 2, t, 0.6 * steam, fan ? 3 : 0);
        if (fan) uchiwa(ctx, w - 40, 44, Math.sin(t / 90) * 0.4 - 0.3);
      });
    }

    /* ================= SCORE ================= */
    function finish() {
      const clarity = R.lastTurb == null ? 0 : R.lastTurb > 0.32 ? U.ramp(R.lastTurb, 0.32, 0.75) : R.lastTurb < 0.13 ? U.ramp(0.13 - R.lastTurb, 0, 0.12) * 0.4 + 60 : 100;
      const fw = R.firstWater <= 10 ? 100 : U.ramp(R.firstWater, 10, 30);
      const washS = clarity * 0.75 + fw * 0.25;
      const grainS = U.clamp(100 - R.broken * 260 - R.mash * 140, 0, 100);
      const ratioS = U.band(R.ratio, lot.ratio, 0.02, 0.12);
      const soakS = U.band(R.soak, 30, 10, 45);
      const steamS = U.band(R.steam, 12.5, 2.5, 12);
      const mlS = U.band(R.ml, 300 * BATCH, 15 * BATCH, 110 * BATCH);
      const hotS = R.delay <= 18 ? 100 : U.ramp(R.delay, 18, 60);
      const evenS = U.ramp(1 - R.even, 0.12, 0.6);
      const tempS = U.band(R.temp, 37.5, 2.5, 14);
      const glossS0 = U.clamp(R.gloss * 100 - Math.max(0, R.fanSecs - 60) * 2, 0, 100);
      /* Is this rice usable at all? Cooked right, seasoned, evenly, at body heat. If not, the process credits
         (intact grains, quick seasoning, soak, gloss) are worth little: intact grains of unseasoned rice are
         still not shari. A rice with a serious fault cannot go to the counter. */
      const core = U.mean([ratioS, steamS, mlS, evenS, tempS]);
      const q = U.clamp((core - 25) / 45, 0, 1);
      const grainS0 = grainS, hotS0 = hotS, soakS0 = soakS;
      const faults = [];
      if (R.lastTurb == null || R.lastTurb > 0.6) faults.push('barely washed: bran and starch left in');
      if (Math.abs(R.ratio - lot.ratio) > 0.12) faults.push(R.ratio > lot.ratio ? 'cooked to mush with too much water' : 'hard in the middle from too little water');
      if (R.steam < 3 || R.steam > 35) faults.push(R.steam < 3 ? 'lid opened before it steamed' : 'left to sit until it went cold in the pot');
      if (R.ml < 150 * BATCH || R.ml > 480 * BATCH) faults.push(R.ml < 150 * BATCH ? 'hardly any vinegar' : 'drowned in vinegar');
      if (R.even < 0.6) faults.push('the vinegar never got mixed through');
      if (R.temp > 47 || R.temp < 27) faults.push(R.temp > 47 ? 'still steaming hot' : 'stone cold');
      if (R.mash > 0.7 || R.broken > 0.35) faults.push(R.mash > R.broken ? 'stirred to paste' : 'grains scrubbed to pieces');
      const gate = (v) => v * q;
      const items = [
        { label: 'Washing', detail: R.cycles + (R.cycles === 1 ? ' rinse' : ' rinses') + ' · first water drained in ' + (R.firstWater || 0).toFixed(0) + 's', value: R.lastTurb == null ? '—' : R.lastTurb > 0.32 ? 'still milky' : R.lastTurb < 0.13 ? 'over-washed' : 'nearly clear', score: washS, w: 12,
          tip: R.firstWater > 10 ? 'The dry rice drank the first water and its bran smell. Pour it off fast.' : R.lastTurb > 0.32 ? 'The water was still milky. Wash until it is nearly clear.' : 'You washed the flavour away. Nearly clear, not crystal.' },
        { label: 'Grain integrity', detail: 'broken while washing, mashed while mixing', value: Math.round(R.broken * 100) + '% / ' + Math.round(R.mash * 100) + '%', score: gate(grainS0), w: 12,
          tip: q < 0.6 && grainS0 > 70 ? 'Whole grains are no achievement if the rice is not seasoned and cooled. Do the work.' : R.mash > R.broken ? 'You stirred it into paste. Cut and fold. Never stir, never press.' : 'You scrubbed too hard. The grains are cracked; fingertips, gently.' },
        { label: 'Water ratio', detail: lot.jp + ' wants about 1:' + lot.ratio.toFixed(2), value: '1:' + R.ratio.toFixed(2), score: ratioS, w: 12,
          tip: R.ratio > lot.ratio ? 'Too much water. Soft rice cannot hold the vinegar. ' + (lot.jp === '新米' ? 'New rice is already full of water.' : '') : 'Too little water. The centre of the grain is hard.' },
        { label: 'Soak', value: R.soak + ' min', score: gate(soakS0), w: 6, tip: R.soak < 20 ? 'Not soaked enough. The core of the grain will not cook through.' : 'Soaked too long. The grains swell and split in the pot.' },
        { label: 'Steaming', detail: 'lid on after the heat stops', value: Math.floor(R.steam) + ' min', score: steamS, w: 8, tip: R.steam < 10 ? 'You opened the lid too early. The rice was still wet on the outside.' : 'You let it sit too long. It cooled before it ever met the vinegar.' },
        { label: 'Awase-zu', detail: BATCH > 1 ? 'target about 600 ml for 10 gō' : 'target about 300 ml for 5 gō', value: Math.round(R.ml) + ' ml', score: mlS, w: 10, tip: R.ml > 300 * BATCH ? 'Too much vinegar. Wet, sour shari that falls apart.' : 'Not enough vinegar. Flat, sticky rice.' },
        { label: 'Seasoned while hot', detail: 'lid open to vinegar in', value: Math.round(R.delay) + 's', score: gate(hotS0) * U.clamp(mlS / 60, 0, 1), w: 8, tip: mlS < 60 ? 'Fast, but you hardly seasoned it. Quick is only good if the vinegar goes in.' : 'You waited. Hot rice drinks the vinegar; cool rice only gets wet.' },
        { label: 'Even seasoning', value: Math.round(R.even * 100) + '%', score: evenS, w: 14, tip: 'Some grains are sour, some are plain. Cut through every part of the tub.' },
        { label: 'Temperature', detail: 'body temperature, 35–40°C', value: Math.round(R.temp) + '°C', score: tempS, w: 12, tip: R.temp > 40 ? 'Still too hot. Hot shari cooks the fish on top of it.' : 'You let it go cold. Cold shari is hard and tastes of nothing.' },
        { label: 'Gloss', detail: 'fanning once seasoned', value: Math.round(R.gloss * 100) + '%', score: gate(glossS0), w: 6, tip: R.fanSecs > 60 ? 'You fanned it dry.' : 'Fan while you cut. That is where the shine comes from.' },
      ];
      const res = { items, stats: { tempC: Math.round(R.temp), ratio: R.ratio } };
      if (faults.length) {
        res.cap = faults.length >= 2 ? 30 : 55;
        res.capLine = faults.length >= 2 ? 'This is not shari. Throw it out and start again, and this time pay attention at every step.' : 'One mistake and the whole tub is wasted. Rice does not forgive.';
        res.summary = 'This rice cannot go to the counter: ' + faults.join('; ') + '. ' + (faults.length >= 2 ? 'With faults like these it scores 30 at best.' : 'With a fault like that it scores 55 at best.');
      }
      api.finish(res);
    }

    st.onresize = () => {};
    window.__rice = { R, lot, phase: () => phase, BATCH, FEEL };
    wash();
    return { destroy() { cleanup(); st.destroy(); } };
  },
};

/* =====================================================================
   Station 4 — Tamagoyaki (玉子焼き)
   Six layers in a square pan (aluminium, or copper if you buy one). Oil, pour a thin layer, lift the
   roll so egg runs underneath, pop bubbles, and roll when the bottom is
   set but the top is still wet (about 70% cooked). Control heat with
   the flame and by lifting the pan off it.
   ===================================================================== */
GAMES.tamago = {
  levelName(l) { return ['Dashimaki basics', 'Sweet tamago', 'Edomae, with shrimp paste', 'By ear'][l - 1] || ''; },
  levelNote(l) {
    return { 2: 'More sugar in the egg: it browns sooner. Keep the heat honest.', 3: 'The master\'s Edomae recipe with shrimp paste and sugar: cook it low, around 160°C, or it scorches.', 4: 'No heat readout. Listen to the sizzle.' }[l] || '';
  },
  start(api) {
    const LV = api.level || 1;
    const copper = api.kit && api.kit.pan === 'copper';
    const TARGET_T = LV === 3 ? 160 : 185;
    const BROWN_AT = (LV === 3 ? 182 : LV === 2 ? 196 : 205) + (copper ? 8 : 0);
    const LAYERS = 6, TARGET_ML = [60, 50, 50, 50, 50, 50];
    const STEPS = ['Heat the pan'].concat(Array.from({ length: LAYERS }, (_, i) => 'Layer ' + (i + 1)), ['Shape']);
    const box = el('div'); api.stage.append(box);
    const st = Stage(box, { aspect: 0.78, maxVh: 0.42 });
    const font = () => getComputedStyle(document.body).fontFamily;

    let T = 25, flame = 1, lifted = false; // pan temp °C, flame 0 off,1 low,2 medium,3 high
    const FLAME_T = [25, 155, 190, 235];
    let layer = -1, phase = 'preheat';
    let oilCells = [], ml = 0, d = 0, brown = 0, bubbles = [], holes = 0, flowed = false, cookT = [];
    const L = []; // per-layer results
    let shape = 0, pressing = false, pressT = 0, rollAnim = 0;
    let done = false;
    const heatLabel = () => LV >= 4 ? 'listen' : T < 120 ? 'quiet' : T < 165 ? 'faint sizzle' : T < 205 ? 'steady sizzle' : T < 235 ? 'loud sizzle' : 'smoking';
    let hover = null, sizzleT = 0;

    const flameBtns = ['Low', 'Medium', 'High'].map((n, i) => { const b = el('button', { class: 'btn wood', type: 'button' }, n); b.onclick = () => { flame = i + 1; flameBtns.forEach((x, j) => x.classList.toggle('on', j === i)); }; return b; });
    const liftBtn = holdBtn('Lift pan', { cls: 'wood', start: () => { lifted = true; }, end: () => { lifted = false; } });
    const heatChip = el('span', { class: 'chip' }, 'Pan ', el('b', null, 'quiet'));
    const layerChip = el('span', { class: 'chip' }, 'Layer ', el('b', null, '—'));
    const heatRow = el('div', { class: 'row' }, ...flameBtns, liftBtn);
    flameBtns[0].classList.add('on');
    const actRow = el('div', { class: 'row' });

    function pan() { const w = st.w, h = st.h; const pw = Math.min(w * 0.7, h * 0.95), ph = pw * 1.05; return { x: w / 2 - pw / 2, y: h / 2 - ph / 2, w: pw, h: ph }; }
    function rollZone(P) { return { y: P.y, h: P.h * 0.22 }; }

    function setPhase(p) {
      phase = p; actRow.innerHTML = '';
      api.setSteps(STEPS, p === 'preheat' ? 0 : p === 'shape' || p === 'done' ? LAYERS + 1 : layer + 1);
      layerChip.lastChild.textContent = layer < 0 ? '—' : (layer + 1) + ' / ' + LAYERS;
      if (p === 'preheat') {
        api.hint(LV === 3 ? 'Edomae tamago: egg, <em>shrimp paste</em>, sugar and mirin. The sugar scorches easily, so work at a <em>faint, steady sizzle</em>, around 160°C. Low heat is your friend today.' : 'Heat the pan until a drop of egg gives a <em>steady sizzle</em>. Medium heat is the safe choice; high browns the egg, low takes forever and sticks.' + (LV >= 4 ? ' Today there is no readout: <em>listen</em> (turn sound on).' : '') + (copper ? ' Your copper pan holds heat evenly.' : ''));
        const b = el('button', { class: 'btn primary', type: 'button' }, 'Pan is ready, oil it');
        b.onclick = () => { layer = 0; startLayer(); }; actRow.append(b);
      }
      if (p === 'oil') {
        setTimeout(() => { const P = pan(); api.demo && api.demo('oil', [0.15, 0.85, 0.15, 0.85].map((x, i) => ({ x: P.x + x * P.w, y: P.y + (0.3 + i * 0.18) * P.h })), { duration: 1500 }); }, 300);
        api.hint('Wipe the pan with the <em>oiled paper</em>: drag over the open part of the pan' + (layer ? ', and under the roll' : '') + '. Bare spots stick and tear.');
        const b = el('button', { class: 'btn primary', type: 'button' }, 'Pour the egg'); b.onclick = () => setPhase('pour'); actRow.append(b);
      }
      if (p === 'pour') {
        api.hint('Hold to ladle egg into the pan. One <em>thin layer</em>: about ' + TARGET_ML[layer] + ' ml. The ladle ripples as it fills.');
        const ladle = holdBtn('Hold to pour', { cls: 'primary', start: () => { pouringNow = true; }, end: () => { pouringNow = false; if (ml > 5) { setPhase('cook'); } } });
        actRow.append(ladle);
      }
      if (p === 'cook') {
        api.hint((layer ? '<em>Lift the roll</em> right away so egg runs underneath, then ' : '') + 'tap bubbles to pop them. <em>Roll</em> toward you when the bottom has set but the top is still wet.');
        if (layer) { const lb = el('button', { class: 'btn wood', type: 'button' }, 'Lift the roll'); lb.onclick = () => { if (d < 0.35) flowed = true; lb.disabled = true; }; actRow.append(lb); }
        const rb = el('button', { class: 'btn primary', type: 'button' }, 'Roll'); rb.onclick = () => roll(); actRow.append(rb);
      }
      if (p === 'shape') {
        api.hint('Turn the tamago out onto the <em>makisu</em> and press it into a block while it is hot. Hold for a few seconds.');
        const pb = holdBtn('Hold to press in the makisu', { cls: 'primary', start: () => { pressing = true; }, end: () => { pressing = false; if (pressT > 0.5) finish(); } });
        actRow.append(pb);
      }
    }
    let pouringNow = false;

    function startLayer() {
      ml = 0; d = 0; brown = 0; bubbles = []; holes = 0; flowed = false; cookT = [];
      oilCells = []; for (let j = 0; j < 8; j++) for (let i = 0; i < 6; i++) oilCells.push({ i, j, on: false });
      setPhase('oil');
    }

    function roll() {
      if (phase !== 'cook') return;
      const cov = oilCells.filter((c) => c.on).length / oilCells.length;
      const tear = cov < 0.6 || d < 0.35;
      L.push({ d, brown, holes: holes + bubbles.length, ml, flowed: layer === 0 ? true : flowed, oil: cov, tear, temp: U.mean(cookT) });
      rollAnim = 1;
      layer++;
      if (layer >= LAYERS) { setPhase('shape'); }
      else startLayer();
    }

    const off = track(st.c, {
      down(p) { hover = p; hit(p); }, move(p) { hover = p; hit(p); }, up() { hover = null; },
    });
    function hit(p) {
      const P = pan();
      if (phase === 'oil') {
        const cw = P.w / 6, ch = P.h / 8;
        oilCells.forEach((c) => { const x = P.x + (c.i + 0.5) * cw, y = P.y + (c.j + 0.5) * ch; if (Math.abs(x - p.x) < cw * 0.9 && Math.abs(y - p.y) < ch * 0.9) c.on = true; });
      }
      if (phase === 'cook') {
        bubbles.forEach((b) => { if (!b.popped && Math.hypot(b.x * P.w + P.x - p.x, b.y * P.h + P.y - p.y) < 22) { b.popped = true; Sfx.pop(); } });
      }
    }

    function finish() {
      if (done) return; done = true;
      const roll = L.map((x) => x.tear ? 0 : U.band(x.d, 0.72, 0.08, 0.35));
      const timing = U.mean(roll);
      const brownAvg = U.mean(L.map((x) => x.brown));
      // a layer only counts for colour, bond, holes and shape if it actually set and held together
      const cooked = (x) => x.d >= 0.4, whole = (x) => !x.tear;
      const wholeN = L.filter(whole).length, wholeFrac = wholeN / LAYERS, rawN = L.filter((x) => !cooked(x)).length;
      const colorS = U.mean(L.map((x) => cooked(x) ? U.ramp(x.brown, 0.08, 0.6) : 0)); // raw egg is not golden, it is raw
      const holesT = L.reduce((s, x) => s + x.holes, 0);
      const holeS = U.clamp(100 - holesT * 6, 0, 100) * wholeFrac;
      const mlDev = U.mean(L.map((x, i) => Math.abs(x.ml - TARGET_ML[i]) / TARGET_ML[i]));
      const layerS = U.ramp(mlDev, 0.1, 0.6);
      const bondS = U.mean(L.map((x) => whole(x) ? (x.flowed ? 100 : 35) * (x.d > 0.9 ? 0.55 : 1) : 0)); // a torn layer bonds to nothing
      const oilS = U.mean(L.map((x) => U.ramp(1 - x.oil, 0.15, 0.6)));
      const temps = L.map((x) => x.temp);
      const heatS = U.mean(temps.map((t) => U.band(t, TARGET_T, 15, 60)));
      const shapeS = U.band(shape, 1, 0.15, 1) * (0.25 + 0.75 * wholeFrac); // torn egg will not press into a block
      const tears = L.filter((x) => x.tear).length;
      const items = [
        { label: 'Heat control', detail: LV === 3 ? 'low and steady, about 150–175°C' : 'steady sizzle, about 170–200°C', value: Math.round(U.mean(temps)) + '°C avg', score: heatS, w: 15,
          tip: U.mean(temps) > TARGET_T + 15 ? 'Too hot. Lift the pan off the flame; do not wait for it to burn.' : 'Too cold. The egg sat there and stewed.' },
        { label: 'Rolling time', detail: 'bottom set, top still wet' + (tears ? ' · ' + tears + ' torn' : '') + (rawN ? ' · ' + rawN + ' rolled raw' : ''), value: L.map((x) => Math.round(x.d * 100)).join(' '), score: timing, w: 25,
          tip: U.mean(L.map((x) => x.d)) > 0.82 ? 'You waited until it was dry. Dry layers do not stick to each other.' : L.some((x) => x.oil < 0.6) && L.filter((x) => x.d < 0.35).length < tears ? 'You skipped the oil. The egg stuck to the pan and tore when you rolled.' : 'You rolled raw egg. It tore and ran.' },
        { label: 'Layers bond', detail: 'lifting the roll so egg runs under it', value: L.filter((x) => x.flowed && !x.tear).length + '/' + LAYERS, score: bondS, w: 15,
          tip: wholeN < LAYERS ? 'Torn layers do not bond to anything. The block falls apart on the board.' : 'Lift the roll. If the new egg does not run underneath, the layers come apart when I slice it.' },
        { label: 'Even layers', detail: 'ml per layer', value: L.map((x) => Math.round(x.ml)).join(' '), score: layerS, w: 10, tip: 'Thick and thin, thick and thin. Every layer the same.' },
        { label: 'Colour', detail: 'pale gold, no brown spots', value: rawN > LAYERS / 2 ? 'raw' : brownAvg < 0.1 ? 'golden' : brownAvg < 0.35 ? 'some browning' : 'browned', score: colorS, w: 15, tip: rawN > LAYERS / 2 ? 'That is not golden, that is raw. The colour comes from cooking it.' : 'Brown spots. That is burnt egg, not colour.' },
        { label: 'Bubbles', detail: 'unpopped bubbles leave holes', value: holesT + ' holes', score: holeS, w: 10, tip: wholeN < LAYERS / 2 ? 'No holes, because there is barely a tamago. Torn layers do not count.' : 'Holes. Pop the bubbles while the egg is still liquid.' },
        { label: 'Oiling', value: Math.round(U.mean(L.map((x) => x.oil)) * 100) + '% of pan', score: oilS, w: 5, tip: 'You missed spots with the oil. It stuck.' },
        { label: 'Shape', detail: 'pressed in the makisu', value: shape >= 0.85 ? 'square block' : 'loose', score: shapeS, w: 5, tip: 'Press it in the mat while it is hot.' },
      ];
      // a tamago that fell apart or burnt does not go on the counter, however well the rest went
      const res = { items, summary: null, stats: { browning: +brownAvg.toFixed(2), tears } };
      const why = [];
      if (tears >= 3) { res.cap = Math.round(U.clamp(40 - (tears - 3) * 8, 12, 40)); why.push(tears + ' of ' + LAYERS + ' layers tore, so the block falls apart when it is sliced'); res.capLine = rawN >= 3 ? 'You rolled raw egg, again and again. That is scrambled egg in a rectangle. Again.' : 'It fell apart on the board. I cannot slice that. Again.'; }
      if (brownAvg > 0.35) { const c = Math.round(U.clamp(70 - (brownAvg - 0.35) * 110, 12, 70)); if (res.cap == null || c < res.cap) { res.cap = c; res.capLine = 'Burnt. Smell it. That goes in the bin, not on the counter. Lift the pan when it gets loud.'; } why.push('the egg is browned and bitter'); }
      if (res.cap != null) res.summary = 'This tamago cannot be served: ' + why.join(', and ') + '. A tamago like this scores ' + res.cap + ' at best.';
      api.finish(res);
    }

    const stop = Loop((dt, t) => {
      const target = lifted ? 105 : FLAME_T[flame];
      T += (target - T) * dt / (copper ? 1.9 : 2.4) + (copper ? 0 : Math.sin(t / 700) * 6 * dt);
      sizzleT -= dt;
      if (sizzleT <= 0 && T > 120 && (phase === 'cook' || phase === 'pour' || phase === 'preheat' && T > 150)) { sizzleT = 0.12; Sfx.filtered(0.16, U.clamp((T - 120) / 900, 0.01, 0.14) * (phase === 'preheat' ? 0.4 : 1), 2500 + T * 12, 0.7); }
      heatChip.lastChild.textContent = heatLabel();
      heatChip.className = 'chip' + (LV >= 4 ? '' : T > 215 ? ' bad' : T < 150 && phase !== 'preheat' ? ' warn' : '');
      if (phase === 'pour' && pouringNow) ml += dt * 42;
      if (phase === 'cook') {
        cookT.push(T);
        const rate = 0.1 * Math.max(0, (T - 120) / 65) * Math.pow(50 / Math.max(20, ml), 0.7);
        d = Math.min(1.2, d + rate * dt);
        if (T > BROWN_AT) brown += (T - BROWN_AT) / 60 * dt * 0.35;
        if (d < 0.5 && Math.random() < dt * 0.75 * (T / 190)) bubbles.push({ x: U.rand(0.1, 0.9), y: U.rand(0.3, 0.92), r: U.rand(6, 11), age: 0, popped: false });
        bubbles.forEach((b) => { b.age += dt; });
        for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; if (b.popped) { bubbles.splice(i, 1); continue; } if (d > 0.55 && b.age > 0.3) { holes++; bubbles.splice(i, 1); } }
      }
      if (phase === 'shape' && pressing) { pressT += dt; shape = Math.min(1.2, pressT / 3); }
      if (rollAnim > 0) rollAnim = Math.max(0, rollAnim - dt * 2.5);
      draw(t);
    });

    // textures painted once per canvas size: the stove, the pan's body and its lining
    const TX = {};
    function tex(key, w, h, paint) {
      const id = key + ':' + Math.round(w) + 'x' + Math.round(h) + ':' + st.dpr;
      if (!TX[id]) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w * st.dpr)); c.height = Math.max(1, Math.ceil(h * st.dpr)); const x = c.getContext('2d'); x.scale(st.dpr, st.dpr); paint(x, w, h); TX[id] = c; }
      return TX[id];
    }
    const rr = (c, x, y, w, h, r) => { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); };
    const METAL = copper ? { a: '#f4b987', b: '#cf7f49', c: '#a85a2c', d: '#6e3518', wall: '#7a3f20', rim: 'rgba(255,214,170,.75)' } : { a: '#f3f5f6', b: '#c8cdd1', c: '#a3aaaf', d: '#737a80', wall: '#7c8388', rim: 'rgba(255,255,255,.8)' };
    function paintStove(x, w, h, P) {
      const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#24201d'); g.addColorStop(1, '#171412'); x.fillStyle = g; x.fillRect(0, 0, w, h);
      const sp = x.createRadialGradient(w * 0.2, -h * 0.2, 10, w * 0.2, -h * 0.2, h * 1.2); sp.addColorStop(0, 'rgba(255,207,134,.12)'); sp.addColorStop(1, 'rgba(255,207,134,0)'); x.fillStyle = sp; x.fillRect(0, 0, w, h);
      // the burner and its cast-iron trivet
      const cx = w / 2, cy = P.y + P.h * 0.55, R = Math.min(P.w, P.h) * 0.42;
      x.fillStyle = '#0d0b0a'; x.beginPath(); x.arc(cx, cy, R * 1.25, 0, 7); x.fill();
      x.strokeStyle = '#3a3532'; x.lineWidth = 3; x.beginPath(); x.arc(cx, cy, R * 1.25, 0, 7); x.stroke();
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4, L = Math.max(w, h);
        x.save(); x.translate(cx, cy); x.rotate(a);
        x.fillStyle = '#2b2725'; x.fillRect(R * 0.5, -5, L * 0.36, 10);
        x.fillStyle = 'rgba(255,255,255,.12)'; x.fillRect(R * 0.5, -5, L * 0.36, 2);
        x.restore();
      }
      x.fillStyle = 'rgba(255,255,255,.05)'; x.fillRect(0, h - 4, w, 4);
    }
    function paintBody(x, w, h) {
      // the copper (or aluminium) body seen from above: rolled rim, a hint of hammering
      const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, METAL.a); g.addColorStop(0.32, METAL.b); g.addColorStop(0.7, METAL.c); g.addColorStop(1, METAL.d);
      rr(x, 0, 0, w, h, 8); x.fillStyle = g; x.fill();
      const r = Tools._rng(copper ? 17 : 23);
      for (let i = 0; i < 260; i++) { x.fillStyle = r() < 0.5 ? 'rgba(255,255,255,' + (copper ? 0.12 : 0.1) + ')' : 'rgba(0,0,0,' + (copper ? 0.1 : 0.06) + ')'; x.beginPath(); x.ellipse(r() * w, r() * h, copper ? 2.4 : 6, copper ? 1.8 : 0.6, 0, 0, 7); x.fill(); }
      x.lineWidth = 2.2; const rg = x.createLinearGradient(0, 0, w, h); rg.addColorStop(0, METAL.rim); rg.addColorStop(0.5, 'rgba(255,255,255,0)'); rg.addColorStop(1, 'rgba(0,0,0,.35)');
      x.strokeStyle = rg; rr(x, 3, 3, w - 6, h - 6, 6); x.stroke();
    }
    function paintLining(x, w, h) {
      // tin lining in a copper pan is silver and a little mottled; aluminium is brushed grey
      const g = x.createLinearGradient(0, 0, w, h);
      if (copper) { g.addColorStop(0, '#dfe3e5'); g.addColorStop(1, '#a9b0b4'); } else { g.addColorStop(0, '#cfd4d7'); g.addColorStop(1, '#9ea5aa'); }
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      const r = Tools._rng(copper ? 5 : 9);
      if (copper) {
        for (let i = 0; i < 26; i++) { x.fillStyle = 'rgba(255,255,255,.05)'; x.beginPath(); x.ellipse(r() * w, r() * h, 10 + r() * 26, 6 + r() * 14, r() * 3, 0, 7); x.fill(); }
        const sh = x.createLinearGradient(0, 0, w, h); sh.addColorStop(0.25, 'rgba(255,255,255,0)'); sh.addColorStop(0.42, 'rgba(255,255,255,.22)'); sh.addColorStop(0.55, 'rgba(255,255,255,0)'); x.fillStyle = sh; x.fillRect(0, 0, w, h);
      } else {
        for (let i = 0; i < 90; i++) { x.strokeStyle = r() < 0.5 ? 'rgba(255,255,255,.14)' : 'rgba(60,66,72,.08)'; x.lineWidth = 0.6; const y = r() * h; x.beginPath(); x.moveTo(0, y); x.lineTo(w, y + (r() - 0.5) * 2); x.stroke(); }
      }
      const v = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.7); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.18)'); x.fillStyle = v; x.fillRect(0, 0, w, h);
    }
    let FLAME = null;
    function flameSprite() {
      if (FLAME) return FLAME;
      // a soft gas flame: bright blue-white at the burner, fading to nothing, no hard edges
      const c = document.createElement('canvas'); c.width = 32; c.height = 96; const x = c.getContext('2d');
      x.save(); x.translate(16, 92); x.scale(1, 3.2);
      const g = x.createRadialGradient(0, 0, 0, 0, -4, 15); g.addColorStop(0, 'rgba(225,240,255,.95)'); g.addColorStop(0.3, 'rgba(120,175,255,.75)'); g.addColorStop(0.7, 'rgba(70,115,255,.28)'); g.addColorStop(1, 'rgba(60,100,255,0)');
      x.fillStyle = g; x.beginPath(); x.arc(0, -4, 15, 0, 7); x.fill(); x.restore();
      FLAME = c; return c;
    }
    function paintShadow(x, w, h) { for (let i = 0; i < 12; i++) { x.fillStyle = 'rgba(0,0,0,.07)'; rr(x, 4 + i * 1.8, 4 + i * 1.8, w - 8 - i * 3.6, h - 8 - i * 3.6, 16 - i); x.fill(); } }

    function drawCross(ctx, x, y, w, h) {
      // the tamago block, cut end on: rolled layers inside a golden skin
      const sk = ctx.createLinearGradient(0, y, 0, y + h); sk.addColorStop(0, '#f2c35a'); sk.addColorStop(1, '#d9a43c');
      rr(ctx, x - 3, y - 3, w + 6, h + 6, 8); ctx.fillStyle = sk; ctx.fill();
      const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#fbe28a'); g.addColorStop(1, '#f1cd62');
      rr(ctx, x, y, w, h, 6); ctx.fillStyle = g; ctx.fill();
      for (let i = 0; i < L.length; i++) {
        const k = 1 - (i + 1) / (L.length + 1);
        ctx.strokeStyle = L[i].brown > 0.25 ? 'rgba(150,90,30,.75)' : 'rgba(214,166,64,.65)';
        ctx.lineWidth = L[i].d > 0.9 || !L[i].flowed ? 2.6 : 1.2;
        rr(ctx, x + w / 2 - w * k / 2, y + h / 2 - h * k / 2, w * k, h * k, 5 * k + 1); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(ctx, x + 6, y + 4, w * 0.4, 3, 1.5); ctx.fill();
      ctx.strokeStyle = '#2a211c'; ctx.lineWidth = 1.3; rr(ctx, x - 3, y - 3, w + 6, h + 6, 8); ctx.stroke();
    }

    function draw(t) {
      const { ctx, w, h } = st;
      const P = pan();
      ctx.drawImage(tex('stove', w, h, (x) => paintStove(x, w, h, P)), 0, 0, w, h);
      // the flame: a glow around the pan, tongues licking up the sides at high heat
      const cx = w / 2, cy = P.y + P.h * 0.55;
      if (flame > 0) {
        const fl = flame / 3, k = lifted ? 0.55 : 1;
        ctx.drawImage(tex('glow' + flame + (lifted ? 'l' : ''), w, h, (x) => {
          const gr = x.createRadialGradient(cx, cy, Math.min(P.w, P.h) * 0.2, cx, cy, P.w * (0.62 + fl * 0.22));
          gr.addColorStop(0, 'rgba(90,150,255,' + (0.5 * k) + ')'); gr.addColorStop(0.65, 'rgba(70,120,255,' + ((0.12 + fl * 0.22) * k) + ')'); gr.addColorStop(1, 'rgba(255,150,70,0)');
          x.fillStyle = gr; x.fillRect(0, 0, w, h);
        }), 0, 0, w, h);
        // soft tongues of flame licking up both sides of the pan
        const fs = flameSprite();
        const n = 5 + flame * 2;
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (let side = -1; side <= 1; side += 2) for (let i = 0; i < n; i++) {
          const yy = cy + (i - (n - 1) / 2) * (P.h * 0.62 / n) + Math.sin(i * 2.3) * 3;
          const flick = Math.sin(t / 70 + i * 1.9 + side * 0.7) * 0.5 + Math.sin(t / 43 + i * 3.1) * 0.5;
          const len = (5 + flame * 4.5 + flick * 3 + (i % 3) * 2) * k * (flame >= 2 ? 1 : 0.7);

/* =====================================================================
   Station 5 — Slicing neta (柳刃 / そぎ切り sogi-giri)

GAMES.slice = {

    const TARGET_G = ORDER ? ORDER.g : 11, N = 8;
    const byEye = LV >= 3;

    const font = () => getComputedStyle(document.body).fontFamily;

    const info = el('div', { class: 'readout' });

        const wob = Math.sin(i * 1.3) * 2;
        ctx.strokeStyle = toro ? (i % 3 === 0 ? 'rgba(255,244,240,.75)' : 'rgba(255,225,225,.25)') : (i % 4 === 0 ? 'rgba(255,190,195,.28)' : 'rgba(90,10,18,.18)');
        ctx.lineWidth = toro && i % 3 === 0 ? 2.2 + rs() * 1.2 : 0.9;
        ctx.beginPath(); ctx.moveTo(x, baseY + 2); ctx.bezierCurveTo(x - hh * 0.2 + wob, baseY - hh * 0.35, x - hh * 0.35 - wob, baseY - hh * 0.7, x - hh * 0.55, baseY - hh - 4); ctx.stroke();
      }
      // gloss along the top edge, darker toward the board
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(lx, baseY - hl + 2); ctx.lineTo(faceTopX, baseY - hh + 2); ctx.stroke();
      const sh = ctx.createLinearGradient(0, baseY - 8, 0, baseY); sh.addColorStop(0, 'rgba(40,0,5,0)'); sh.addColorStop(1, 'rgba(40,0,5,.25)'); ctx.fillStyle = sh; ctx.fillRect(lx, baseY - 8, faceBotX - lx, 8);
      ctx.restore();
      // the top of the block, seen from just above
      const tp = () => { ctx.beginPath(); ctx.moveTo(lx, baseY - hl); ctx.lineTo(lx + 4, baseY - hl - 5); ctx.lineTo(faceTopX + 4, baseY - hh - 5); ctx.lineTo(faceTopX, baseY - hh); ctx.closePath(); };
      tp(); ctx.fillStyle = fdShade(C.top, 0.18); ctx.fill();
      ctx.save(); tp(); ctx.clip(); ctx.strokeStyle = toro ? 'rgba(255,246,242,.8)' : 'rgba(255,200,205,.35)'; ctx.lineWidth = toro ? 1.4 : 0.8; for (let x = lx; x < faceTopX + 6; x += toro ? 7 : 6) { ctx.beginPath(); ctx.moveTo(x, baseY - hl + 1); ctx.lineTo(x + 6, baseY - hh - 6); ctx.stroke(); } ctx.restore();
      ctx.strokeStyle = 'rgba(42,33,28,.5)'; ctx.lineWidth = 1; tp(); ctx.stroke();
      // the fresh cut face shines
      if (trimmed) {
        ctx.save(); ctx.beginPath(); ctx.moveTo(faceTopX, baseY - hh); ctx.lineTo(faceBotX, baseY); ctx.lineTo(faceBotX - 5, baseY); ctx.lineTo(faceTopX - 5, baseY - hh); ctx.closePath();
        const fg = ctx.createLinearGradient(faceTopX - 5, 0, faceBotX, 0); fg.addColorStop(0, 'rgba(255,255,255,0)'); fg.addColorStop(1, 'rgba(255,230,232,.45)'); ctx.fillStyle = fg; ctx.fill(); ctx.restore();
      }
      ctx.strokeStyle = 'rgba(42,33,28,.6)'; ctx.lineWidth = 1.3; ctx.lineJoin = 'round'; block(); ctx.stroke();
      // guide for next cut
      if (!done) {
        const gx = trimmed ? faceTopX - t / Math.sin(rad()) * ppc : faceTopX;
        ctx.strokeStyle = '#27211c'; ctx.setLineDash([5, 4]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(gx, baseY - hh - 14); ctx.lineTo(gx + (hh + 14) / sl, baseY); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#27211c'; ctx.font = '600 12px ' + font();
        ctx.fillText(trimmed ? 'next cut' : 'trim line', gx - 20, baseY - hh - 18);
      }
      ctx.restore();
      // a steel ruler along the board
      const ry0 = baseY + 7;
      const rg = ctx.createLinearGradient(0, ry0, 0, ry0 + 14); rg.addColorStop(0, '#eef1f2'); rg.addColorStop(0.5, '#c9cfd3'); rg.addColorStop(1, '#aeb6bb');
      ctx.fillStyle = 'rgba(40,30,20,.18)'; ctx.fillRect(view.x + 1, ry0 + 2, faceTopX - view.x + 4, 14);
      ctx.fillStyle = rg; ctx.fillRect(view.x, ry0, faceTopX - view.x + 4, 14);
      ctx.strokeStyle = 'rgba(42,33,28,.35)'; ctx.lineWidth = 1; ctx.strokeRect(view.x + 0.5, ry0 + 0.5, faceTopX - view.x + 3, 13);
      ctx.strokeStyle = 'rgba(39,33,28,.7)'; ctx.fillStyle = 'rgba(39,33,28,.75)'; ctx.font = '10px ' + font();
      for (let c = 0; c <= 9; c++) { const x = faceTopX - c * ppc; if (x < view.x) break; ctx.beginPath(); ctx.moveTo(x, ry0); ctx.lineTo(x, ry0 + (c % 5 ? 6 : 10)); ctx.stroke(); }
      for (let m = 1; m < 30; m++) { const x = faceTopX - m * ppc / 10; if (x < view.x) break; if (m % 10) { ctx.beginPath(); ctx.moveTo(x, ry0); ctx.lineTo(x, ry0 + 3); ctx.stroke(); } }
      ctx.fillText('cm from the cut face', view.x + 2, ry0 + 27);
      // the plate: white porcelain with an indigo rim
      const px0 = view.x + view.w / 2, py = view.y + view.h + 44;
      fdShadow(ctx, px0 + 3, py + 38, view.w / 2 + 4, 34, 0.3);
      const pg = ctx.createRadialGradient(px0 - view.w * 0.15, py + 20, 6, px0, py + 32, view.w / 2);
      pg.addColorStop(0, '#ffffff'); pg.addColorStop(0.85, '#f1ede4'); pg.addColorStop(1, '#ddd6c8');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.ellipse(px0, py + 32, view.w / 2, 38, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(38,52,99,.75)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(px0, py + 32, view.w / 2 - 6, 33, 0, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(38,52,99,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(px0, py + 32, view.w / 2 - 11, 29, 0, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(42,33,28,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(px0, py + 32, view.w / 2, 38, 0, 0, 7); ctx.stroke();
      pieces.forEach((pc, i) => {
        const x = view.x + 22 + i * (view.w - 44) / Math.max(1, N - 1), y = py + 30;
        const len = pc.face * 5.5, wid = Math.min(14, 3 * 5.5 * (0.55 + pc.t) / 2);
        ctx.save(); ctx.translate(x, y); ctx.rotate(-0.55);
        const leaf = () => { ctx.beginPath(); ctx.moveTo(-len / 2, 0); ctx.bezierCurveTo(-len * 0.3, -wid * 1.25, len * 0.3, -wid * 1.15, len / 2, 0); ctx.bezierCurveTo(len * 0.3, wid * 1.15, -len * 0.3, wid * 1.2, -len / 2, 0); ctx.closePath(); };
        ctx.fillStyle = 'rgba(40,20,20,.18)'; ctx.save(); ctx.translate(1.5, 2); leaf(); ctx.fill(); ctx.restore();
        leaf();
        const lg = ctx.createLinearGradient(0, -wid, 0, wid); lg.addColorStop(0, fdShade(C.face, 0.12)); lg.addColorStop(1, C.bot);
        ctx.fillStyle = lg; ctx.fill();
        ctx.save(); leaf(); ctx.clip();
        ctx.strokeStyle = toro ? 'rgba(255,244,240,.7)' : 'rgba(255,195,200,.28)'; ctx.lineWidth = toro ? 1.4 : 0.8;
        for (let k = -4; k <= 4; k++) { ctx.beginPath(); ctx.moveTo(k * len * 0.12 - 4, wid); ctx.quadraticCurveTo(k * len * 0.12, 0, k * len * 0.12 + 5, -wid); ctx.stroke(); }
        if (pc.surf < 70) { ctx.strokeStyle = 'rgba(255,220,220,.65)'; ctx.lineWidth = 1; for (let k = -3; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(k * 5, -wid); ctx.lineTo(k * 5 + 2, -wid * 0.2); ctx.lineTo(k * 5 - 1, wid * 0.4); ctx.lineTo(k * 5 + 3, wid); ctx.stroke(); } }
        else { ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(-len * 0.08, -wid * 0.4, len * 0.26, wid * 0.18, 0, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(-len * 0.18, -wid * 0.45, len * 0.07, wid * 0.08, 0, 0, 7); ctx.fill(); }
        ctx.restore();
        ctx.strokeStyle = 'rgba(42,33,28,.55)'; ctx.lineWidth = 1; leaf(); if (pc.surf < 70) { ctx.setLineDash([2, 1.5]); } ctx.stroke(); ctx.setLineDash([]);
        ctx.restore();
        if (!byEye || done) { ctx.fillStyle = Math.abs(pc.g - TARGET_G) <= 1 ? '#27211c' : '#b23a22'; ctx.font = '11px ' + font(); ctx.fillText(pc.g.toFixed(1), x - 9, py + 62); }
      });
      drawLaneKnife(ctx, lane);
      ctx.fillStyle = 'rgba(39,33,28,.8)'; ctx.font = '600 11px ' + font(); ctx.textAlign = 'center';
      ctx.fillText('heel', lane.x + lane.w / 2, lane.y + lane.h * 0.17 + 10); ctx.fillText('tip', lane.x + lane.w / 2, lane.y + lane.h * 0.9);

      const drawS = (s, a) => { if (s.length < 2) return; ctx.strokeStyle = 'rgba(208,68,42,' + a + ')'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); s.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); };

    }

    /* the yanagiba laid along the lane, heel at the top: ho-wood handle, horn ferrule, polished blade */
    function drawLaneKnife(ctx, lane) {
      const dpr = fdDpr(ctx);
      const img = fdCache('lane|' + Math.round(lane.w) + 'x' + Math.round(lane.h) + '|' + dpr, lane.w, lane.h + 8, dpr, (x, W, H0) => {
        const Hh = H0 - 8, y0 = 4;
        const hx = W * 0.31, hw = W * 0.38, hy = y0 - 4, hh2 = Hh * 0.1;
        // handle
        const hg = x.createLinearGradient(hx, 0, hx + hw, 0); hg.addColorStop(0, '#c9ae7a'); hg.addColorStop(0.45, '#e6d3a8'); hg.addColorStop(1, '#b0915e');

        x.strokeStyle = 'rgba(120,85,45,.3)'; x.lineWidth = 0.7; for (let i = 1; i < 4; i++) { x.beginPath(); x.moveTo(hx + hw * i / 4, hy + 2); x.lineTo(hx + hw * i / 4 + 1, hy + hh2 - 2); x.stroke(); }
        x.strokeStyle = 'rgba(42,33,28,.6)'; x.lineWidth = 1; x.beginPath(); x.roundRect ? x.roundRect(hx, hy, hw, hh2, 3) : x.rect(hx, hy, hw, hh2); x.stroke();
        // buffalo-horn ferrule
        const fy = hy + hh2, fh = Hh * 0.025;
        const fgr = x.createLinearGradient(hx, 0, hx + hw, 0); fgr.addColorStop(0, '#1d1b1c'); fgr.addColorStop(0.4, '#4a4446'); fgr.addColorStop(1, '#151314');
        x.fillStyle = fgr; x.fillRect(hx - 0.5, fy, hw + 1, fh); x.strokeStyle = 'rgba(42,33,28,.7)'; x.strokeRect(hx - 0.5, fy, hw + 1, fh);

        const by = fy + fh, l0 = W * 0.2, r0 = W * 0.8;
        const blade = () => { x.beginPath(); x.moveTo(l0, by); x.lineTo(r0, by); x.lineTo(r0 - W * 0.03, y0 + Hh * 0.9); x.quadraticCurveTo(W * 0.62, y0 + Hh * 0.985, W * 0.5, y0 + Hh); x.quadraticCurveTo(l0 + W * 0.02, y0 + Hh * 0.93, l0 + W * 0.02, y0 + Hh * 0.82); x.closePath(); };
        const sg = x.createLinearGradient(l0, 0, r0, 0); sg.addColorStop(0, '#f6f8f9'); sg.addColorStop(0.32, '#cfd5d9'); sg.addColorStop(0.34, '#a9b2b8'); sg.addColorStop(0.7, '#dfe4e7'); sg.addColorStop(1, '#9aa3a9');
        blade(); x.fillStyle = sg; x.fill();
        x.save(); blade(); x.clip();
        // kasumi haze on the bevel, a mirror streak on the flat
        x.fillStyle = 'rgba(255,255,255,.25)'; x.fillRect(l0, by, (r0 - l0) * 0.3, Hh);
        x.fillStyle = 'rgba(255,255,255,.55)'; x.fillRect(l0 + (r0 - l0) * 0.55, by + Hh * 0.05, 2, Hh * 0.8);
        x.restore();
        // shinogi line and the bright edge
        x.strokeStyle = 'rgba(80,90,98,.55)'; x.lineWidth = 0.8; x.beginPath(); x.moveTo(l0 + (r0 - l0) * 0.33, by); x.lineTo(l0 + (r0 - l0) * 0.36, y0 + Hh * 0.86); x.stroke();
        x.strokeStyle = 'rgba(255,255,255,.95)'; x.lineWidth = 1.2; x.beginPath(); x.moveTo(l0 + 0.8, by + 2); x.lineTo(l0 + W * 0.02 + 0.8, y0 + Hh * 0.82); x.stroke();

        x.fillText('鶴', W * 0.62, by + Hh * 0.26); x.fillText('岡', W * 0.62, by + Hh * 0.26 + W * 0.18);
      });

    }

    function finish() {
      done = true; draw();
      const n = pieces.length;
      const ws = pieces.map((p) => p.g);
      const accS = n ? U.mean(ws.map((x) => U.band(x, TARGET_G, 0.7, 4.5))) : 0;
      const sdS = n > 1 ? U.ramp(U.sd(ws), 0.45, 2.2) : 0;
      const faceAvg = n ? U.mean(pieces.map((p) => p.face)) : faceLen();
      const faceS = n ? U.mean(pieces.map((p) => U.band(p.face, 7.25, 0.75, 3.5))) : 0;
      const surfS = n ? U.mean(pieces.map((p) => p.surf).concat(pieces.trim ? [pieces.trim.sc] : [])) : 0;

      const okW = (p) => Math.abs(p.g - TARGET_G) <= 1.5, okF = (p) => p.face >= 6 && p.face <= 8.5, okS = (p) => p.surf >= 50;

      const useS = 100 * usable / N;
      const q = U.clamp(usable / N / 0.75, 0, 1); // clean pulls and an even spread only matter on slices you can serve
      const badW = pieces.filter((p) => !okW(p)).length, badF = pieces.filter((p) => !okF(p)).length, badS = pieces.filter((p) => !okS(p)).length;
      const whyNot = [badF ? badF + ' face ' + (faceAvg < 6.5 ? 'too short' : 'too long') : null, badW ? badW + ' off weight' : null, badS ? badS + ' torn or stepped' : null].filter(Boolean).join(' · ');
      const worstNote = pieces.slice().sort((a, b) => a.surf - b.surf)[0];
      const items = [
        { label: 'Pull stroke', detail: worstNote ? 'worst slice: ' + worstNote.note : '', value: Math.round(surfS), score: surfS * (0.3 + 0.7 * q), w: 30,
          tip: q < 0.6 && surfS >= 70 ? 'A clean pull on a slice I cannot serve is still a slice I cannot serve.' : worstNote && /sawed/.test(worstNote.note) ? 'You are sawing. This is not a bread knife. One pull, heel to tip.' : worstNote && /stepped/.test(worstNote.note) ? 'You stopped halfway. Every stop leaves a step in the face.' : 'Use the whole blade. Start at the heel and let the weight of the knife do it.' },
        { label: 'Weight', detail: 'target ' + TARGET_G + ' g per slice' + (byEye ? ', cut by eye' : ''), value: n ? U.fmt1(U.mean(ws)) + ' g avg' : '—', score: accS, w: 20,
          tip: n && U.mean(ws) > TARGET_G ? 'Too thick. Heavy neta buries the rice.' : 'Too thin. The guest tastes rice, not fish.' },
        { label: 'Consistency', detail: 'spread between slices', value: n > 1 ? '±' + U.fmt1(U.sd(ws)) + ' g' : '—', score: sdS * (0.3 + 0.7 * q), w: 20, tip: q < 0.6 && sdS >= 70 ? 'All the same size, and all the wrong size. Even is only good when it is right.' : 'Every piece a different size. A guest sitting next to another guest will notice.' },
        { label: 'Face length', detail: 'blade at ' + angle + '°; the saku thins toward the tail', value: U.fmt1(faceAvg) + ' cm avg', score: faceS, w: 10, tip: faceAvg < 6.5 ? 'Too steep. The slice is short and stubby; lay the blade down.' : 'Too flat. The slice hangs off the rice.' },
        { label: 'Usable pieces', detail: 'within 1.5 g, a 6–8.5 cm face and a clean surface; offcuts go to rolls' + (whyNot ? ' · ' + whyNot : ''), value: usable + ' / ' + N, score: useS, w: 20,
          tip: badS > N / 2 ? 'Torn, stepped faces. Nobody pays for that at the counter; it goes in the rolls.' : badF > N / 2 ? (faceAvg < 6.5 ? 'Stubby slices. Lay the blade down, around 17 to 20 degrees, so the face covers the rice.' : 'Too flat. The slice hangs off the rice.') : 'Half of this goes into maki. Nigiri pieces are where the money is.' },

      if (usable <= 2) {
        res.cap = 30 + usable * 6;
        res.capLine = usable ? 'Only ' + usable + ' of these can go on rice. The rest goes into rolls. Again.' : 'Not one slice I can put on rice. That whole saku goes into rolls now. Again.';
        res.summary = (usable ? 'Only ' + usable + ' of ' + N + ' slices are' : 'None of the ' + N + ' slices is') + ' good enough for nigiri' + (whyNot ? ' (' + whyNot + ')' : '') + '. The rest of the saku goes into rolls, so this scores ' + res.cap + ' at best.';
      }

    }

    st.onresize = draw;
    hintNow(); draw();
    setTimeout(() => { const { lane } = L(); const x = lane.x + lane.w / 2; api.demo && api.demo('pull', [{ x, y: lane.y + lane.h * 0.15 }, { x, y: lane.y + lane.h * 0.2 }, { x, y: lane.y + lane.h * 0.6 }, { x, y: lane.y + lane.h * 0.95 }], { duration: 1400 }); }, 400);
    window.__slice = { L, canvas: st.c, faceLen, hAt, sliceWeight, rad, get used() { return used; }, get t() { return t; }, get angle() { return angle; }, get trimmed() { return trimmed; }, pieces, SAKU, TARGET_G };
    return { destroy() { off(); st.destroy(); } };
  },
};

/* =====================================================================
   Station 6 — Nigiri (握り)
   Five pieces of madai. Wet the hands with tezu, take a 16 g shari ball
   by feel, a dab of wasabi, then shape in a few moves: press, turn,
   pinch the sides, press. Firm enough to lift, loose enough to fall
   apart in the mouth, and fast, before your hands warm the fish.
   ===================================================================== */
GAMES.nigiri = {
  levelName(l) { return ['Madai with a scale', 'Four neta, four weights', 'No scale', 'Seven pieces, no help'][l - 1] || ''; },
  levelNote(l) {
    return { 2: 'Each neta takes its own shari: kohada 14 g, anago 13 g, madai and akami 16 g.', 3: 'The training scale goes away. Your hand is the scale now.', 4: 'Seven pieces, no pressure band, and the fish warms after 6 seconds.' }[l] || '';
  },
  start(api) {
    const LV = api.level || 1;
    const NETA = {
      madai: { n: 'madai', t: 16, c: '#f2d2c8', e: 'rgba(212,100,108,.85)' },
      kohada: { n: 'kohada', t: 14, c: '#dfe3e6', e: 'rgba(70,80,92,.8)', spots: true },
      akami: { n: 'akami zuke', t: 16, c: '#9e1f2a', e: 'rgba(70,8,14,.85)' },
      anago: { n: 'anago', t: 13, c: '#b07a4a', e: 'rgba(70,35,15,.9)' },
    };
    const N = LV >= 4 ? 7 : 5;
    const SEQ = LV >= 2 ? U.shuffle(['madai', 'kohada', 'akami', 'anago']).concat(U.shuffle(['madai', 'kohada', 'akami'])).slice(0, N) : Array(N).fill('madai');
    const SCALE = LV < 3, BAND = LV < 4, WARM = LV >= 4 ? 6 : 7;
    let TARGET = 16;
    const feelW = (d) => Math.abs(d) < 1 ? 'about right' : d >= 3 ? 'heavy' : d > 0 ? 'a touch heavy' : d <= -3 ? 'light' : 'a touch light';
    const box = el('div'); api.stage.append(box);
    const st = Stage(box, { aspect: 0.72, maxVh: 0.42 });
    const font = () => getComputedStyle(document.body).fontFamily;
    const steps = Array.from({ length: N }, (_, i) => 'Piece ' + (i + 1));
    const done = [];
    let P = null, phase = 'tezu', gauge = 0, gaugeKind = null, finished = false;

    const chipW = el('span', { class: 'chip' }, 'Scale ', el('b', null, '—'));
    const chipM = el('span', { class: 'chip' }, 'Moves ', el('b', null, '—'));
    const chipH = el('span', { class: 'chip' }, 'In hand ', el('b', null, '0.0s'));
    const actions = el('div', { class: 'controls' });
    api.controls.append(el('div', { class: 'readout' }, chipW, chipM, chipH), actions);

    function newPiece() {
      const nk = SEQ[done.length]; TARGET = NETA[nk].t;
      P = { tezu: 0, w: 0, tau: 1.5 * U.rand(0.86, 1.14), grabT: 0, wasabi: 0, moves: [], start: null, adjust: 0, neta: NETA[nk], target: TARGET };
      chipW.lastChild.textContent = SCALE ? '—' : 'no scale'; chipM.lastChild.textContent = '—'; chipH.lastChild.textContent = '0.0s';
      api.setSteps(steps, done.length);
      setPhase('tezu');
    }
    const handT = () => P.start ? (performance.now() - P.start) / 1000 : 0;

    function setPhase(p) {
      phase = p; actions.innerHTML = '';
      if (p === 'tezu') {
        api.hint('Dip your fingertips in the <em>tezu</em> (vinegar water). A quick dip: too wet and the shari turns soggy, too dry and it sticks to you.');
        actions.append(holdBtn('Hold to dip in tezu', { cls: 'wood', start: () => { gaugeKind = 'tezu'; }, end: () => { gaugeKind = null; if (P.tezu > 0) setPhase('grab'); } }));
        const skip = el('button', { class: 'btn ghost', type: 'button' }, 'Skip the tezu'); skip.onclick = () => setPhase('grab'); actions.append(skip);
      }
      if (p === 'grab') {
        api.hint((LV >= 2 ? 'Next: <b>' + P.neta.n + '</b>. ' : '') + 'Take the shari from the ohitsu <em>by feel</em>: hold, and let go when the ball in your hand is about <em>' + TARGET + ' g</em>. Every handful comes up a little differently.');
        actions.append(holdBtn('Hold to take shari', { cls: 'primary', start: () => { if (!P.start) P.start = performance.now(); gaugeKind = 'grab'; }, end: () => { gaugeKind = null; if (P.w > 1) { if (SCALE) chipW.lastChild.textContent = P.w.toFixed(1) + ' g'; setPhase('adjust'); } } }));

        // the guests sit behind the counter
        guests.forEach((g, i) => { const cx = W * (i + 0.5) / n, r = Math.min(H * 0.11, W / n * 0.2); face(ctx, cx, H * 0.24, r, g, ct + 6); });
        // hinoki counter edge
        const cg = ctx.createLinearGradient(0, ct - 6, 0, ct + 12); cg.addColorStop(0, '#f6e7c6'); cg.addColorStop(0.45, '#e4cb98'); cg.addColorStop(1, '#b99662');

      function finish() {

        const firm = U.mean(served.map((s) => s.fS));

        }
        api.finish(res);

      { id: 'omakase', en: 'Omakase counter', seats: 10, turns: 2, nights: 5, check: 165, premium: 0.55, cost: 550000, rent: 60000, food: 0.36, labor: 0.27, other: 0.12, need: 0.62 },

const ROAD_EVENTS = [
  { d: { rep: 5 }, t: 'A food writer sat at your end of the counter and wrote about your kohada.', need: (s) => s.road.job && ROAD.jobs.find((j) => j.id === s.road.job).rep >= 3 },
  { d: { net: 6 }, t: 'A regular who owns three restaurants asked for your card.', need: (s) => s.road.job && ROAD.jobs.find((j) => j.id === s.road.job).rep >= 6 },
  { d: { cash: -4000 }, t: 'Your knife hand needed stitches. Three weeks off without pay.' },
  { d: { cash: -3000 }, t: 'Family needed help with bills.' },
  { d: { rep: -2 }, t: 'A guest got sick after eating elsewhere and blamed your counter online.' },
  { d: { skill: 1 }, t: 'A fishmonger at the market started setting aside his best fish for you.' },
  { d: {}, t: 'Fish prices jumped after a bad season. Everyone\'s margins thinned.' },
];

function roadLineage(s) {
  if (s.path === 'apprentice') {
    if (s.stations.omakase.approved) return 'master';
    if (s.ended && s.ended.how === 'quit' && !s.stations.market.approved) return 'quit';
    return 'left';
  }
  const passed = STATIONS.filter((x) => s.stations[x.id].tries.some((t) => t.score >= RULES.academy.bar)).length;
  return passed === STATIONS.length ? 'academy' : 'academyPartial';
}
const LINEAGE_TEXT = {
  master: 'Trained to the counter under Oyakata Tsuruoka',
  left: 'Left Sushi Tsuruoka before finishing',
  quit: 'Quit an apprenticeship early',
  academy: 'Sushi academy graduate',
  academyPartial: 'Sushi academy, not every module passed',
  retrained: 'Retrained under a master after school',
};

function trainingQuality(s) {
  const sk = (id) => { const t = s.stations[id].tries; return t.length ? U.mean(t.slice(-3).map((x) => x.score)) : 0; };
  return Math.round(sk('rice') * 0.25 + sk('nigiri') * 0.2 + sk('slice') * 0.15 + sk('fillet') * 0.1 + sk('tamago') * 0.1 + sk('market') * 0.1 + sk('omakase') * 0.1);
}

function startRoad(s) {
  const lin = roadLineage(s);
  const st = ROAD.start[lin] || ROAD.start.quit;
  let rep = st.rep, net = st.net;
  if (lin === 'left') { const n = STATIONS.filter((x) => s.stations[x.id].approved).length; rep += n * ROAD.start.leftPerStation.rep; net += n * ROAD.start.leftPerStation.net; }
  // Hands learn from volume: twelve weeks of school is not ten years of service, whatever the scores say.
  const exp = s.path === 'apprentice' ? U.clamp(0.72 + (s.months / 12) * 0.028, 0.72, 1) : 0.82;
  s.road = { year: 0, loc: 'tokyo', lineage: lin, rep, net, skill: Math.round(trainingQuality(s) * exp), exp, job: null, jobYears: {}, hired: {}, offers: [], log: [], opened: null, retrained: false, worked: 0 };
  s.road.log.push({ at: 'Start', text: LINEAGE_TEXT[lin] + '. Reputation ' + rep + ', connections ' + net + ', skill ' + s.road.skill + (exp < 1 ? ' (your training scores × ' + exp.toFixed(2) + ' for hours behind a real counter)' : '') + '.' });
  return s.road;
}

function jobMeets(s, j) {
  const r = s.road, q = j.req || {};
  const lin = r.retrained ? 'retrained' : r.lineage;
  if (j.loc !== r.loc) return { ok: false, why: 'in ' + (j.loc === 'tokyo' ? 'Tokyo' : 'Seattle') };
  if (q.lineage && !q.lineage.includes(lin)) return { ok: false, why: q.lineage.includes('master') ? 'only for the master\'s own apprentices' : 'only if you have not trained under a master' };
  const waived = j.lineageWaives && (lin === 'master' || lin === 'retrained');
  if (!waived && q.rep && r.rep < q.rep) return { ok: false, why: 'needs reputation ' + q.rep + (j.lineageWaives ? ', or a master\'s lineage' : '') };
  if (q.skill && r.skill < q.skill) return { ok: false, why: 'needs skill ' + q.skill };
  if (!waived && q.net && r.net < q.net) return { ok: false, why: 'needs connections ' + q.net + ' (someone to vouch for you)' + (j.lineageWaives ? ', or a master\'s lineage' : '') };
  if (q.cash && s.savings < q.cash) return { ok: false, why: 'needs ' + U.usd(q.cash) + ' of your own capital' };
  if (j.audition && !waived && !r.hired[j.id]) return { ok: false, audition: true, why: 'audition: ' + STATIONS.find((x) => x.id === j.audition.station).en.toLowerCase() + ' ' + j.audition.need + '+' };
  if (j.audition && waived && j.id.endsWith('nibante')) return { ok: true, why: 'your lineage opens this door' };
  return { ok: true };
}

/* one year of work */
function workYear(s, jobId, rnd = Math.random) {
  { const ROLLJOBS = { s_casual: 9, s_grocery: 5, s_franchise: 6, s_bar: 6, t_kaiten: 6, t_machi: 3 }; if (ROLLJOBS[jobId]) s.road.rolls = Math.min(92, (s.road.rolls != null ? s.road.rolls : s.rolls != null ? s.rolls : 30) + ROLLJOBS[jobId]); }
  const r = s.road, j = ROAD.jobs.find((x) => x.id === jobId);
  const out = { lines: [], offers: [] };
  r.year++; r.worked++; r.job = jobId;
  r.jobYears[jobId] = (r.jobYears[jobId] || 0) + 1;
  const pay = j.payRange ? Math.round(j.payRange[0] + (j.payRange[1] - j.payRange[0]) * rnd() / 1000) * 1000 : Math.min(j.max || j.pay, j.pay + (j.grow || 0) * (r.jobYears[jobId] - 1));
  let take = pay * (1 - ROAD.tax[r.loc]) - ROAD.living[r.loc];
  if (j.upfront && r.jobYears[jobId] === 1) take -= j.upfront;
  s.savings += take;
  const skillF = U.clamp(0.5 + r.skill / 200, 0.5, 1);
  const dRep = j.rep > 0 ? j.rep * skillF : j.rep;
  r.rep = U.clamp(r.rep + dRep, 0, 100);
  r.net = U.clamp(r.net + j.net, 0, 100);
  if (j.skill < 0 && r.skill > 60) r.skill = Math.max(60, r.skill + j.skill);
  if (j.skill > 0 && r.skill < (j.skillCap || 96)) r.skill = Math.min(j.skillCap || 96, r.skill + j.skill);
  out.lines.push('Paid ' + U.usd(pay) + '; saved ' + U.usd(take) + ' after tax and living costs. Reputation ' + (dRep >= 0 ? '+' : '') + dRep.toFixed(1) + ', connections ' + (j.net >= 0 ? '+' : '') + j.net + '.');
  if (j.id === 't_junior' && r.jobYears[j.id] >= 4 && !r.retrained) { r.retrained = true; r.rep = Math.max(r.rep, 20); out.lines.push('Four years in, the master calls you one of his own. Your background now counts as master-trained.'); }
  // the master's noren-wake offer
  if (j.id === 't_master' && r.jobYears[j.id] >= 2 && !r.offers.some((o) => o.kind === 'noren') && rnd() < 0.35 + 0.1 * (r.jobYears[j.id] - 2)) {
    const o = { kind: 'noren', loc: 'tokyo', format: 'omakase', share: 0.5, equity: 0, text: 'Oyakata Tsuruoka grants you noren-wake: open under the Tsuruoka name. He introduces his landlord and suppliers and puts up half the money as a gift to the lineage.' };
    r.offers.push(o); out.offers.push(o);
  }
  // investor offers. US deal terms (estimates from restaurant-deal guides): a chef with no cash gets
  // 10–20% sweat equity; a chef who puts in a quarter of the cash owns 35–50%. Investors are paid
  // back first. Japan-trained lineage is what makes backers call.
  const lin = r.retrained ? 'retrained' : r.lineage;
  const pull = r.rep / 100 * 0.5 + r.net / 100 * 0.5 + (lin === 'master' ? 0.15 : lin === 'retrained' ? 0.07 : 0);
  const pInv = U.clamp((pull - 0.42) * 1.2, 0, 0.55) * (j.id === 's_head' || j.id === 't_owner' ? 1.5 : 1);
  if (rnd() < pInv) {
    const share = U.clamp(0.75 + (pull - 0.42) * 0.6, 0.75, 1);       // share of the money they put up
    const equity = U.clamp(0.6 + (share - 0.75), 0.6, 0.85);           // what they take for it
    const o = { kind: 'investor', loc: r.loc, format: 'omakase', share: +share.toFixed(2), equity: +equity.toFixed(2), text: 'A regular wants to back your own omakase counter in ' + (r.loc === 'tokyo' ? 'Tokyo' : 'Seattle') + ': ' + Math.round(share * 100) + '% of the money for ' + Math.round(equity * 100) + '% of the business, paid back before you take profit.' };
    r.offers = r.offers.filter((x) => x.kind !== 'investor');
    r.offers.push(o); out.offers.push(o);
  }
  // a random event
  const pool = ROAD_EVENTS.filter((e) => !e.need || e.need(s));
  if (rnd() < 0.55 && pool.length) {
    const e = pool[Math.floor(rnd() * pool.length)];
    if (e.d.rep) r.rep = U.clamp(r.rep + e.d.rep, 0, 100);
    if (e.d.net) r.net = U.clamp(r.net + e.d.net, 0, 100);
    if (e.d.skill) r.skill = Math.min(96, r.skill + e.d.skill);
    if (e.d.cash) s.savings += e.d.cash;
    out.lines.push(e.t);
  }
  r.hired = {}; // auditions count for the year they are won
  r.log.push({ at: 'Year ' + r.year, text: j.en + ' (' + (r.loc === 'tokyo' ? 'Tokyo' : 'Seattle') + '). ' + out.lines.join(' ') });
  out.offers.forEach((o) => r.log.push({ at: 'Year ' + r.year, text: 'Offer: ' + o.text }));
  return out;
}

function moveCity(s) {
  const r = s.road; const to = r.loc === 'tokyo' ? 'seattle' : 'tokyo';
  s.savings -= ROAD.moveCost[to];
  r.loc = to; r.year++;
  r.net = Math.round(r.net * 0.5); // connections mostly stay behind
  r.offers = r.offers.filter((o) => o.loc === to);
  r.hired = {};
  s.savings -= ROAD.living[to] * 0.25; // a few months finding work
  r.log.push({ at: 'Year ' + r.year, text: 'Moved to ' + (to === 'tokyo' ? 'Tokyo' : 'Seattle') + '. Half your connections stay behind; a season goes to finding work.' });
}

/* the opening projection
   fame: reputation plus how much your lineage alone puts bums on seats
   quality: skill; connections: regulars and word of mouth
   A famous lineage fills the counter in year one; an unknown chef takes
   two or three years to fill up (Japan research, estimate). */
function fameOf(s, offer) {
  const r = s.road, lin = r.retrained ? 'retrained' : r.lineage;
  const lf = offer && offer.kind === 'noren' ? ROAD.lineageFame.noren : ROAD.lineageFame[lin] || 0;
  return U.clamp(r.rep / 100 + lf, 0, 1.3);
}
function demandIndex(s, fmt, offer) {
  const r = s.road;
  return 0.45 * fameOf(s, offer) + 0.35 * r.skill / 100 + 0.2 * r.net / 100;
}
function project(s, loc, fmtId, plan) {
  const fmt = ROAD.formats[loc].find((f) => f.id === fmtId);
  const offer = plan.offer || null;
  const fame = fameOf(s, offer);
  const D = demandIndex(s, fmt, offer);
  const occ = U.clamp(0.2 + 0.78 / (1 + Math.exp(-(D - fmt.need) / 0.09)), 0.15, 0.97);
  const ramp = U.clamp(0.6 + 0.5 * fame, 0.6, 1);
  const occ1 = occ * ramp;
  const check = fmt.check * (1 + (fmt.premium ? Math.min(fmt.premium, Math.max(0, fame - 0.5) * fmt.premium * 2) : 0));
  const capacity = fmt.seats * fmt.turns * fmt.nights * 52;
  const cost = offer && offer.kind === 'noren' ? fmt.cost * 0.85 : fmt.cost;
  const loan = plan.loan || 0;
  const L = ROAD.loan[loc];
  const debtService = loan > 0 ? loan * L.rate / (1 - Math.pow(1 + L.rate, -L.years)) : 0;
  const contrib = 1 - fmt.food - fmt.labor - fmt.other;
  const yearProfit = (o) => capacity * o * check * contrib - fmt.rent - debtService;
  const revenue = capacity * occ * check, revenue1 = capacity * occ1 * check;
  const profit = yearProfit(occ), profit1 = yearProfit(occ1);
  const ownerShare = 1 - (offer ? offer.equity : 0);
  const margin = revenue > 0 ? profit / revenue : -1;
  const breakEvenOcc = (fmt.rent + debtService) / (capacity * check * contrib);
  const buffer = plan.buffer || 0;
  let p5 = ROAD.baseFiveYear + 1.4 * (margin - 0.08);
  if (profit1 + buffer < 0) p5 -= 0.18;
  if (offer && offer.kind === 'noren') p5 += 0.05;
  p5 = U.clamp(p5, 0.05, 0.92);
  return { fmt, cost, D, fame, occ, occ1, check, covers: Math.round(capacity * occ), revenue, revenue1, debtService, profit, profit1, ownerTake: profit * ownerShare, margin, breakEvenOcc, p5 };
}
function maxLoan(s, equity, loc) {
  const r = s.road, L = ROAD.loan[loc || r.loc];
  if (r.worked < ROAD.loan.minYearsWorked && r.lineage !== 'master') return 0;
  return Math.max(0, Math.min(L.cap, equity * L.multiple));
}

if (typeof module !== 'undefined') module.exports = { ROAD, startRoad, workYear, moveCity, project, maxLoan, jobMeets, roadLineage, demandIndex };

function screenOpen(offer) {
  clearView();
  const r = S.road;
  const a = app();
  a.append(roadTopbar());
  const loc = offer ? offer.loc : r.loc;
  const fmts = ROAD.formats[loc];
  let fmtId = offer ? offer.format : fmts[0].id;
  a.append(el('div', { class: 'card', style: 'margin-bottom:14px' },
    el('h2', null, offer && offer.kind === 'noren' ? 'Noren-wake: Sushi Tsuruoka, your branch' : 'Plan your own counter in ' + CITY[loc]),
    el('p', { style: 'font-size:13.5px;color:var(--sumi-dim)' }, offer ? offer.text : 'Choose what to open and how to pay for it. The projection uses your reputation, connections, skill and background.')));
  const fmtBox = el('div', { class: 'ladder' });
  const own = sliderCtl('own', 'Your savings in', 0, Math.max(0, Math.round(S.savings / 1000) * 1000), 1000, Math.max(0, Math.round(S.savings * 0.8 / 1000) * 1000), (v) => U.usd(v), 'What you keep back covers your own rent while the place finds its feet.');
  const loanS = sliderCtl('loan', 'Bank loan', 0, 1, 1000, 0, (v) => U.usd(v), 'Banks lend against what you put in.');
  const outBox = el('div', { class: 'card' });
  const go = el('button', { class: 'btn primary', type: 'button' }, 'Sign the lease and open');
  let loanTouched = false;
  loanS.input.addEventListener('input', () => { loanTouched = true; });
  function plan() {
    const fmt = fmts.find((f) => f.id === fmtId);
    const ownIn = own.value();
    const max = Math.round(maxLoan(S, ownIn, loc) / 1000) * 1000;
    const LN = ROAD.loan[loc];
    loanS.input.max = String(max);
    if (!loanTouched) { const costNow = offer && offer.kind === 'noren' ? fmt.cost * 0.85 : fmt.cost; const gap = costNow - ownIn - (offer ? costNow * offer.share : 0); loanS.input.value = String(Math.min(max, Math.max(0, Math.ceil(gap / 1000) * 1000))); }
    if (+loanS.input.value > max) loanS.input.value = String(max);
    loanS.querySelector('.top .mono').textContent = U.usd(+loanS.input.value);
    loanS.querySelector('.help').textContent = max ? LN.name + ': up to ' + LN.multiple + '× what you put in, at ' + (LN.rate * 100).toFixed(1) + '% over ' + LN.years + ' years.' : 'No lender will talk to you yet: they want ' + ROAD.loan.minYearsWorked + ' years of work history after training.';
    const loan = loanS.value();
    const pj = project(S, loc, fmtId, { loan, offer, buffer: Math.max(0, S.savings - ownIn) });
    // run the same season model the shop uses, so the plan matches what will happen
    try {
      const tmp = JSON.parse(JSON.stringify(S));
      tmp.road.opened = { loc, fmt: fmtId, ownIn, loan, offer, pj, year: tmp.road.year };
      const sh = openShop(tmp, tmp.road.opened, 'plan');
      const sim = sh.vol ? simVolSeason : simSeason;
      const y1 = sim(tmp, sh, () => 0.5, { dry: true });
      sh.rating = y1.rSeason; sh.regulars = Math.max(sh.regulars, sh.vol ? 120 : 150); sh.buzz = 0.3;
      const known = sim(tmp, sh, () => 0.5, { dry: true });
      pj.occ1 = y1.occ; pj.occ = known.occ; pj.profit1 = y1.profit * 4; pj.profit = known.profit * 4;
      pj.revenue = (known.foodRev + known.bevRev) * 4; pj.margin = pj.revenue > 0 ? pj.profit / pj.revenue : -1;
      pj.ownerTake = pj.profit * (1 - (offer ? offer.equity : 0));
      let p5 = ROAD.baseFiveYear + 1.4 * (pj.margin - 0.08);
      if (pj.profit1 + Math.max(0, S.savings - ownIn) < 0) p5 -= 0.18;
      if (offer && offer.kind === 'noren') p5 += 0.05;
      pj.p5 = U.clamp(p5, 0.05, 0.92);
      pj.check = sh.vol ? y1.check : sh.price;
    } catch (e) { /* fall back to the simple projection */ }
    const fromOffer = offer ? pj.cost * offer.share : 0;
    const have = ownIn + loan + fromOffer;
    const short = pj.cost - have;
    outBox.innerHTML = '';
    outBox.append(el('h2', null, fmt.en),
      el('dl', { class: 'kv' },
        el('dt', null, 'To open'), el('dd', null, U.usd(pj.cost)),
        el('dt', null, 'Your money'), el('dd', null, U.usd(ownIn)),
        el('dt', null, 'Bank loan'), el('dd', null, U.usd(loan)),
        offer ? el('dt', null, offer.kind === 'noren' ? 'The master\'s gift' : 'Investor (' + Math.round(offer.equity * 100) + '% stake)') : null, offer ? el('dd', null, U.usd(fromOffer)) : null,
        el('dt', null, short > 0 ? 'Still short' : 'Covered'), el('dd', null, short > 0 ? U.usd(short) : 'yes'),
        el('dt', null, 'Seats'), el('dd', null, fmt.seats + ' × ' + fmt.turns + ' turns × ' + fmt.nights + ' nights'),
        el('dt', null, 'Price per head'), el('dd', null, U.usd(pj.check) + (loc === 'tokyo' ? ' (¥' + (Math.round(pj.check * ROAD.fx / 100) * 100).toLocaleString('en-US') + ')' : '')),
        el('dt', null, 'Seats filled, year one'), el('dd', null, Math.round(pj.occ1 * 100) + '%'),
        el('dt', null, 'Seats filled, once known'), el('dd', null, Math.round(pj.occ * 100) + '%'),
        el('dt', null, 'Break-even'), el('dd', null, Math.round(pj.breakEvenOcc * 100) + '% of seats'),
        el('dt', null, 'Profit, year one'), el('dd', null, U.usd(pj.profit1)),
        el('dt', null, 'Profit once known'), el('dd', null, U.usd(pj.profit) + ' a year'),
        offer && offer.equity ? el('dt', null, 'Your share of that') : null, offer && offer.equity ? el('dd', null, U.usd(pj.ownerTake)) : null,
        el('dt', null, 'Odds of being open in 5 years'), el('dd', null, Math.round(pj.p5 * 100) + '% (average 55%)')));
    go.disabled = short > 0 || null;
    go.textContent = short > 0 ? 'Not enough money yet' : 'Sign the lease and open';
    go.onclick = () => { r.opened = { loc, fmt: fmtId, ownIn, loan, offer, pj, year: r.year }; S.savings -= ownIn; save(); window.go(() => screenNameShop(r.opened)); };
  }
  fmts.forEach((f) => {
    if (offer && f.id !== offer.format) return;
    const b = el('button', { class: 'path', type: 'button', style: 'text-align:left' },
      el('span', { class: 'pfront', html: (f.kind === 'volume' ? volStorefrontSVG(S.name.split(' ').slice(-1)[0] + ' Sushi', f.id) : storefrontSVG('Sushi ' + S.name.split(' ').slice(-1)[0])).replace(/xMidYMax slice/, 'xMidYMid slice') }),
      el('h3', null, f.en), el('span', { class: 'lede', style: 'font-size:13px' }, U.usd(f.cost) + ' to open, ' + f.seats + ' seats, ' + U.usd(f.check) + ' a head' + (f.kind === 'volume' ? '. Volume: menu, line and rent matter more than your knife.' : '. A chef\'s counter: your name and skill fill the seats.')));
    b.onclick = () => { fmtId = f.id; [...fmtBox.children].forEach((x) => x.classList.remove('on')); b.classList.add('on'); plan(); };
    if (f.id === fmtId) b.classList.add('on');
    fmtBox.append(b);
  });

  a.append(fmtBox, el('div', { class: 'controls', style: 'margin-top:12px' }, own, loanS), el('div', { style: 'margin-top:12px' }, outBox),
    el('div', { class: 'ladder-foot' }, go, el('button', { class: 'btn ghost', type: 'button', onclick: () => screenRoad() }, 'Not yet, back to work')));
  plan();
}
