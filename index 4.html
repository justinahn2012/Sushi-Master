  x.restore();
}
/* shari in three-quarter view: a rounded block of rice, half-length rx, side height hs,
   top-surface half-depth dz; grains show all over and stand proud at the edges */
function fdShari(x, cx, cy, rx, hs, dz, seed, tint, round) {
  const r = seeded(seed || 9), top = cy - hs / 2, bot = cy + hs / 2;
  const path = round ? () => { x.beginPath(); x.ellipse(cx, cy, rx, hs / 2 + dz * 0.9, 0, 0, 7); } : () => { x.beginPath(); x.ellipse(cx, top, rx, dz, 0, Math.PI, 0); x.lineTo(cx + rx * 0.97, bot); x.ellipse(cx, bot, rx * 0.97, dz, 0, 0, Math.PI); x.closePath(); };
  x.save();
  fdShadow(x, cx + rx * 0.06, bot + dz * 0.4, rx * 1.1, dz * 1.1, 0.28);
  const base = tint || '#f6f0e3';
  path();
  const g = x.createLinearGradient(cx - rx, top - dz, cx + rx * 0.6, bot + dz);
  g.addColorStop(0, fdShade(base, 0.6)); g.addColorStop(0.6, fdShade(base, 0.15)); g.addColorStop(1, fdShade(base, -0.12));
  x.fillStyle = g; x.fill();
  x.save(); path(); x.clip();
  const gl = Math.max(2.2, Math.min(rx, hs + dz) * 0.26);
  const n = Math.round(rx * (hs + dz * 2) / (gl * gl) * 1.7);
  for (let i = 0; i < n; i++) { const px = cx + (r() * 2 - 1) * rx, py = top - dz + r() * (hs + dz * 2); fdGrain(x, px, py, gl, r() * 3.14, fdShade(base, 0.2 + r() * 0.5 - (py > cy ? 0.12 : 0)), py < cy && r() < 0.5 ? 0.75 : 0); }
  const sh = x.createLinearGradient(0, top, 0, bot + dz); sh.addColorStop(0, 'rgba(120,100,70,0)'); sh.addColorStop(1, 'rgba(120,100,70,.14)');
  x.fillStyle = sh; x.fillRect(cx - rx, top - dz, rx * 2, hs + dz * 2);
  x.restore();
  if (round) { for (let i = 0; i < 22; i++) { const a = i / 22 * 6.283; fdGrain(x, cx + Math.cos(a) * rx * 0.98, cy + Math.sin(a) * (hs / 2 + dz * 0.9) * 0.98, gl, a + 1.57 + (r() - 0.5), fdShade(base, 0.2), Math.sin(a) < 0 ? 0.75 : 0.25); } }
  else {
    for (let i = 0; i < 18; i++) { const a = Math.PI + i / 17 * Math.PI; fdGrain(x, cx + Math.cos(a) * rx * 0.99, top + Math.sin(a) * dz * 0.99, gl, a + 1.57 + (r() - 0.5), fdShade(base, 0.2), 0.75); }
    for (let i = 0; i < 6; i++) { const t = (i + 0.5) / 6; [-1, 1].forEach((sgn) => fdGrain(x, cx + sgn * rx * (0.99 - t * 0.03), top + t * hs, gl, 1.57 + (r() - 0.5), base, 0.3)); }
  }
  x.restore();
}
/* a nigiri piece in three-quarter view: rice below, neta draped on top.
   s: size (shari half-width at rest), prog: how shaped it is, fishTop: neta up (after the turn), showNeta */
function fdNigiri(x, kind, cx, cy, s, prog, fishTop, showNeta, seed, tint) {
  const rx = s * (0.9 + 0.3 * prog), hs = s * (0.56 + 0.12 * prog), dz = s * (0.52 - 0.08 * prog);
  if (showNeta && !fishTop) fdNeta(x, kind, cx, cy + hs * 0.55, rx * 1.28, dz * 1.2, seed, hs * 0.05);
  fdShari(x, cx, cy, rx, hs, dz, seed, tint, prog < 0.3 && !fishTop);
  if (showNeta && fishTop) fdNeta(x, kind, cx, cy - hs / 2 - dz * 0.15, rx * 1.24, dz * 1.25, seed, hs * 0.3);
}

/* =====================================================================
   Station 1 — Market run (仕入れ)
   Level 1: two lots, red stall lamps that make tired gills look fresh.
   Level 2: seasons (shun) move prices and quality; hidden defects
     (thawed fish sold as fresh, bursting bellies, bruising); typhoons.
   Level 3: plus the tuna wholesaler: read three tail cross-sections
     with a flashlight and your fingertip, and watch for yake.
   Level 4: everything, a tighter clock, and a regular's special request.
   ===================================================================== */
GAMES.market = {
  levelName(l) { return ['Two lots', 'Seasons and defects', 'Tuna tail cuts', 'Full morning'][l - 1]; },
  levelNote(l) {
    return {
      2: 'Prices and quality now follow the season, some fish hide defects, and a typhoon can empty the market',
      3: 'The master sends you to the tuna wholesaler too: judge the tail cut by colour, fat and sheen, and do not get fooled by yake',
      4: 'A full morning: four lots, less time, and a regular\'s request to fill',
    }[l] || '';
  },
  start(api) {
    const LV = api.level, month = api.month || 0;
    const TOOL_COST = 4;
    const SEASON = { madai: [2, 3, 4], aji: [5, 6, 7], saba: [9, 10, 11, 0, 1], hirame: [11, 0, 1], kohada: [6, 7, 8, 9] };
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const inSeason = (k) => (SEASON[k] || []).includes(month);
    const stallNames = U.shuffle(['Maruichi', 'Yamasan', 'Kanemasa', 'Daisho', 'Ichimaru', 'Yamako', 'Marusei', 'Hokuyo', 'Kitamura', 'Uoshin', 'Tsukiji Kaneharu', 'Maruhide']);
    let sn = 0;
    const typhoon = LV >= 2 && Math.random() < (LV >= 4 ? 0.5 : 0.35);
    const uses = { madai: 'for tonight\'s sashimi and nigiri', aji: 'for the hikarimono course', saba: 'to cure as shime-saba', kohada: 'for Ito-san, who always asks for kohada' };

    // decide the lots
    let kinds;
    if (LV === 1) kinds = U.shuffle(['madai', 'aji', 'saba']).slice(0, 2);
    else { const pool = U.shuffle(['madai', 'aji', 'saba']); const inS = pool.filter(inSeason); kinds = inS.length ? [inS[0]].concat(pool.filter((k) => k !== inS[0])).slice(0, 2) : pool.slice(0, 2); }
    if (LV >= 4) kinds.push('kohada');
    const lots = kinds.map((k) => roundLot(k));
    if (LV >= 3) lots.push(tunaLot());

    function roundLot(k) {
      const sp = SPECIES[k] || SPECIES.aji;
      const seasonal = LV >= 2 ? (inSeason(k) ? 'in' : 'out') : 'n/a';
      const mid = (sp.kg[0] + sp.kg[1]) / 2;
      const shift = seasonal === 'in' ? 0.04 : seasonal === 'out' ? -0.05 : 0;
      const pm = (seasonal === 'in' ? 0.85 : seasonal === 'out' ? 1.2 : 1) * (typhoon ? 1.35 : 1);
      /* Every fish has its own history, and each check reads a different part of it, so one good sign
         proves nothing. Eyes cloud with age, but also on the side that has lain in meltwater. Gills
         brown with age and warmth, and a bled (ikejime) fish has lighter, cleaner gills. Warmth and a
         full gut break down the belly within hours in small oily fish. Thawed fish weep when pressed.
         Bruises hide under firm flesh. Red lamps flatter gills and skin, nothing else. */
      const ARCH = {
        ike: { f: [0.92, 0.97], m: [1.4, 1.55], age: [6, 14], warm: 0, ike: true },
        fresh: { f: [0.82, 0.9], m: [1.05, 1.25], age: [10, 22], warm: 0 },
        cheap: { f: [0.78, 0.84], m: [0.84, 0.94], age: [18, 26], warm: 0 },
        iceeye: { f: [0.8, 0.88], m: [0.8, 0.9], age: [10, 22], warm: 0, iceEye: true },
        warm: { f: [0.5, 0.62], m: [1.1, 1.25], age: [12, 22], warm: 1 },
        old: { f: [0.55, 0.68], m: [0.66, 0.78], age: [42, 62], warm: 0 },
        thawed: { f: [0.45, 0.55], m: [1.05, 1.2], age: [24, 40], warm: 0, defect: 'thawed' },
        burst: { f: [0.45, 0.6], m: [0.95, 1.1], age: [14, 24], warm: 0.5, defect: 'burst' },
        bruised: { f: [0.62, 0.72], m: [1.0, 1.15], age: [10, 20], warm: 0, defect: 'bruised' },
      };
      const oily = k !== 'madai';
      const good = U.pick(LV >= 2 || Math.random() < 0.5 ? ['ike', 'fresh'] : ['fresh']);
      const bargain = U.pick(['iceeye', 'iceeye', 'cheap']);
      const traps = LV >= 2 ? ['warm', 'thawed', 'bruised', 'redold'].concat(oily ? ['burst'] : []) : ['warm', 'redold'];
      const trap = U.pick(traps);
      const tired = U.pick(trap === 'redold' ? ['old', 'warm'] : ['old', 'old', 'redold']);
      const picks = typhoon ? [good, bargain, U.pick([trap, tired])] : [good, bargain, trap, tired];
      const fish = U.shuffle(picks).map((pk, i) => {
        const redLamp = pk === 'redold';
        const A = ARCH[redLamp ? 'old' : pk];
        const kg = pk === 'ike' || pk === 'fresh' ? U.rand(mid, sp.kg[1]) : pk === 'cheap' || pk === 'iceeye' ? U.rand(sp.kg[0], mid) : U.rand(sp.kg[0], sp.kg[1]);
        const f = U.clamp(U.rand(A.f[0], A.f[1]) + shift, 0.3, 0.97);
        const ppk = Math.round(sp.ppk * U.rand(A.m[0], A.m[1]) * (redLamp ? 1.45 : 1) * pm / 10) * 10;
        return { sp, kind: k, role: pk, f, kg, ppk, price: Math.round(ppk * kg / 10) * 10, stall: stallNames[sn++ % stallNames.length], redLamp, defect: A.defect || null,
          age: U.rand(A.age[0], A.age[1]), warm: A.warm, ike: !!A.ike, iceEye: !!A.iceEye, seed: U.irand(1, 9999), checks: new Set() };
      });
      return { type: 'round', kind: k, sp, fish, use: uses[k] || '', seasonal, bought: null };
    }
    function tunaLot() {
      const roles = U.shuffle(['great', 'good', 'yake']);
      const fish = roles.map((role) => {
        const c = {
          great: { color: U.rand(0.86, 0.95), fat: U.rand(0.7, 0.9), yake: 0, f: 0.93, ppk: U.irand(16, 20) * 1000 },
          good: { color: U.rand(0.74, 0.84), fat: U.rand(0.45, 0.65), yake: 0, f: 0.82, ppk: U.irand(9, 12) * 1000 },
          yake: { color: U.rand(0.8, 0.9), fat: U.rand(0.55, 0.75), yake: U.rand(0.5, 0.8), f: 0.45, ppk: U.irand(11, 14) * 1000 },
        }[role];
        const kg = 2;
        const ppk = Math.round(c.ppk * (typhoon ? 1.15 : 1) / 100) * 100;
        return { kind: 'tuna', role, f: c.f, color: c.color, fat: c.fat, yake: c.yake, kg, ppk, price: ppk * kg, stall: ['Ishiji', 'Yamayuki', 'Fujita'][roles.indexOf(role)], seed: U.irand(1, 9999), checks: new Set() };
      });
      return { type: 'tuna', kind: 'tuna', fish, use: 'a 2 kg block for akami and chūtoro', bought: null };
    }

    // budget: halfway between "premium everywhere" and "premium in one lot, bargain in the others"
    const premT = lots.map((l) => Math.max(...l.fish.map((f) => f.price)));
    const goodT = lots.map((l) => { const g = l.fish.filter((f) => f.f >= 0.75); return Math.min(...g.map((f) => f.price)); });
    const mixed = Math.max(...lots.map((l, i) => premT[i] + goodT.reduce((s, v, j) => s + (j === i ? 0 : v), 0)));
    const budget = Math.round((premT.reduce((s, v) => s + v, 0) + mixed) / 2 / 100) * 100;
    const TOTAL = (LV >= 4 ? 105 : 120) + (lots.length - 2) * 40;

    let lotIdx = 0, timeLeft = TOTAL, spent = 0, done = false, view = 'grid', sel = null, anim = null, inspSt = null;
    const steps = lots.map((l, i) => 'Lot ' + (i + 1) + ': ' + (l.type === 'tuna' ? 'Tuna' : l.sp.en));
    const timerChip = el('span', { class: 'chip' }, 'Market ', el('b', null, TOTAL + 's'));
    const budgetChip = el('span', { class: 'chip' }, 'Budget left ', el('b', null, U.yen(budget)));
    const monthChip = el('span', { class: 'chip' }, el('b', null, MONTHS[month]), typhoon ? ' · typhoon' : '');

    function header() {
      const lot = lots[lotIdx];
      api.setSteps(steps, lotIdx);
      const name = lot.type === 'tuna' ? 'bluefin tuna' : lot.sp.en.toLowerCase();
      const season = lot.seasonal === 'in' ? ' In season now.' : lot.seasonal === 'out' ? ' Out of season.' : '';
      return el('div', { class: 'slip' },
        el('div', { class: 't' }, 'Order ' + (lotIdx + 1) + ' of ' + lots.length + ': ' + (lot.type === 'tuna' ? 'tuna from the wholesaler ' : 'one ' + name + ' '), el('span', { class: 'jp' }, lot.type === 'tuna' ? '鮪' : lot.sp.jp)),
        el('div', { class: 's' }, (lot.type === 'tuna' ? 'Tail cuts from three fish, ' : lot.sp.note + ', ') + lot.use + '.' + season + (typhoon && lotIdx === 0 ? ' A typhoon kept boats in port: fewer fish, higher prices.' : '') + ' Budget ' + U.yen(budget) + ' for everything.'));
    }

    function iceBg(ctx, w, h, seed) { fdIce(ctx, w, h, seed); }
    function drawTail(ctx, cx, cy, R, t, light) { fdTunaTail(ctx, cx, cy, R, t, light); }
    /* stall lighting: warm bulbs, or the red lamps some stalls use to flatter tired fish */
    function stallLight(ctx, w, h, red, noBox) {
      const lg = ctx.createRadialGradient(w * 0.5, -h * 0.2, 0, w * 0.5, -h * 0.2, h * 1.3);
      lg.addColorStop(0, red ? 'rgba(255,70,40,.35)' : 'rgba(255,226,170,.28)'); lg.addColorStop(1, 'rgba(255,200,150,0)');
      ctx.fillStyle = lg; ctx.fillRect(0, 0, w, h);
      if (red) { ctx.fillStyle = 'rgba(255,50,30,.18)'; ctx.fillRect(0, 0, w, h); }
      if (noBox) return;
      // the styrofoam box edge
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 6; ctx.strokeRect(3, 3, w - 6, h - 6);
      ctx.strokeStyle = 'rgba(120,150,170,.35)'; ctx.lineWidth = 1; ctx.strokeRect(6.5, 6.5, w - 13, h - 13);
    }
    function drawCard(cv, fsh) {
      const w = 320, h = 170;
      cv.width = w * 2; cv.height = h * 2;
      const ctx = cv.getContext('2d'); ctx.setTransform(2, 0, 0, 2, 0, 0);
      if (fsh.kind === 'tuna') { slate(ctx, w, h); drawTail(ctx, w / 2, h / 2, h * 0.42, fsh, false); stallLight(ctx, w, h, false, true); return; }
      iceBg(ctx, w, h, fsh.seed);
      const sizeL = w * (0.62 + 0.26 * ((fsh.kg - fsh.sp.kg[0]) / (fsh.sp.kg[1] - fsh.sp.kg[0])));
      const g = fishGeom(w / 2, h / 2, Math.min(sizeL, w * 0.9), fsh.sp.depth);
      drawFish(ctx, g, fsh.sp, { fresh: cues(fsh).eyeLook, seed: fsh.seed, sheenBoost: fsh.redLamp ? 1.5 : 1 });
      stallLight(ctx, w, h, fsh.redLamp);
    }
    /* a dark wet slab for tuna cuts */
    function slate(ctx, w, h) {
      const g2 = ctx.createLinearGradient(0, 0, 0, h); g2.addColorStop(0, '#3e3734'); g2.addColorStop(1, '#2a2422');
      ctx.fillStyle = g2; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1; for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.moveTo(0, i * h / 12 + 3); ctx.lineTo(w, i * h / 12 - 2); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.beginPath(); ctx.ellipse(w * 0.3, h * 0.2, w * 0.3, h * 0.08, -0.1, 0, 7); ctx.fill();
    }

    const TOOLS_ROUND = (k) => [['eyes', 'Eyes'], ['gills', 'Gills'], ['press', 'Press flesh']].concat(LV >= 2 && k !== 'madai' ? [['belly', 'Belly']] : []).concat([['smell', 'Smell']]);
    const TOOLS_TUNA = [['light', 'Flashlight'], ['fat', 'Rub the fat'], ['color', 'Colour in daylight']];

    function render() {
      api.clearControls(); api.stage.innerHTML = '';
      if (inspSt) { inspSt.destroy(); inspSt = null; }
      if (done) return;
      const lot = lots[lotIdx];
      api.stage.append(header());
      if (view === 'grid') {
        api.hint(lot.type === 'tuna' ? 'Tap a tail cut to inspect it. The best tuna is not always the reddest.' : 'Tap a fish to inspect it. Each check costs <em>' + TOOL_COST + ' seconds</em>, and the good fish go fast. <em>No single check tells you everything</em>: a fish can have clear eyes and a sour belly.');
        const grid = el('div', { class: 'stalls', style: 'margin-top:8px' });
        lot.fish.forEach((fsh, i) => {
          const cv = el('canvas', { width: 320, height: 170, 'aria-label': (fsh.kind === 'tuna' ? 'Tuna tail cut' : fsh.sp.en) + ' at ' + fsh.stall });
          drawCard(cv, fsh);
          grid.append(el('button', { class: 'stall' + (fsh.checks.size ? ' checked' : ''), type: 'button', onclick: () => { sel = i; view = 'inspect'; render(); } },
            cv, el('span', { class: 'n' }, fsh.stall + (fsh.redLamp ? ' · red lamps' : '')),
            el('span', { class: 'p' }, fsh.kg.toFixed(2) + ' kg · ' + U.yen(fsh.ppk) + '/kg'),
            el('span', { class: 'p' }, U.yen(fsh.price) + (fsh.checks.size ? ' · checked ' + fsh.checks.size : ''))));
        });
        api.stage.append(grid);
      } else {
        const fsh = lot.fish[sel];
        const box = el('div', { style: 'margin-top:8px' });
        api.stage.append(box);
        const st = Stage(box, { aspect: 0.55, maxVh: 0.34 });
        inspSt = st;
        const drawBig = () => drawInspect(st, fsh);
        st.onresize = drawBig; drawBig();
        api.hint(fsh.stall + ': ' + fsh.kg.toFixed(2) + ' kg at ' + U.yen(fsh.ppk) + '/kg = <em>' + U.yen(fsh.price) + '</em>. Budget left ' + U.yen(budget - spent) + '.');
        const tools = el('div', { class: 'row' });
        (fsh.kind === 'tuna' ? TOOLS_TUNA : TOOLS_ROUND(fsh.kind)).forEach(([k, label]) => {
          tools.append(el('button', { class: 'btn wood', type: 'button', disabled: fsh.checks.has(k) || null, onclick: () => useTool(fsh, k, st) }, label));
        });
        const finds = el('div', { class: 'findings' });
        fsh.checks.forEach((k) => finds.append(finding(fsh, k)));
        const buy = el('button', { class: 'btn primary', type: 'button', onclick: () => buyFish(fsh) }, 'Buy for ' + U.yen(fsh.price));
        const back = el('button', { class: 'btn ghost', type: 'button', onclick: () => { view = 'grid'; render(); } }, 'Back to stalls');
        api.controls.append(tools, finds, el('div', { class: 'row' }, back, buy));
      }
    }

    /* what the fish shows, check by check, from its history */
    function cues(fsh) {
      const age = fsh.age || 20, warm = fsh.warm || 0, d = fsh.defect;
      const rot = age / 70 + warm * 0.38;
      return {
        eye: d === 'thawed' ? 'frost' : fsh.iceEye ? 'melt' : age < 30 ? 'clear' : age < 45 ? 'hazy' : 'sunk',
        eyeLook: d === 'thawed' ? 0.56 : fsh.iceEye ? 0.5 : age < 30 ? 0.92 : age < 45 ? 0.7 : 0.48,
        gill: d === 'thawed' ? 'dark' : fsh.ike ? 'bled' : rot < 0.4 ? 'bright' : rot < 0.68 ? 'brick' : 'brown',
        press: d === 'thawed' ? 'weep' : d === 'bruised' ? 'spots' : fsh.ike ? 'rigor' : age / 80 + warm * 0.42 < 0.4 ? 'spring' : age / 80 + warm * 0.42 < 0.72 ? 'slow' : 'stays',
        belly: d === 'burst' ? 'split' : warm >= 1 ? 'warm' : age > 40 ? 'soft' : 'firm',
        smell: d === 'thawed' ? 'freezer' : d === 'burst' ? 'guts' : warm >= 1 || age > 54 ? 'sour' : age > 36 ? 'faint' : 'clean',
      };
    }
    function findingText(fsh, k) {
      if (fsh.kind === 'tuna') {
        if (k === 'light') return fsh.yake ? 'Under the light, cloudy grey patches show in the red: the flesh looks cooked from the inside.' : fsh.color > 0.85 ? 'Clear, glossy red right through. It shines back at the light.' : 'Even red, a little matte.';
        if (k === 'fat') return fsh.fat > 0.7 ? 'Your fingertip comes away slick and sticky: plenty of fat.' : fsh.fat > 0.5 ? 'A light, clean film of fat.' : 'Dry to the touch. Lean fish.';
        if (k === 'color') return fsh.color > 0.85 ? 'Deep, bright red.' : fsh.color > 0.75 ? 'Good red, slightly darker at the core.' : 'Dull, brownish red.';
      }
      const c = cues(fsh);
      if (k === 'eyes') return { frost: 'Whitish and frosted-looking, though still domed.', melt: 'Milky white, but still full and domed, not sunken. It has been lying in meltwater.', clear: 'Clear and domed, black pupil.', hazy: 'A little hazy and flattening.', sunk: 'Cloudy and sunken.' }[c.eye];
      if (k === 'gills') return (fsh.redLamp ? 'Bright, wet red, by the look of it. The stall\'s red lamps are shining on it.' : { bled: 'Clean and light red, no slime: this one was bled.', bright: 'Bright, wet red.', brick: 'Dull brick red, a little slime.', brown: 'Brown-grey and sticky.', dark: 'Dark red and dry at the edges.' }[c.gill]);
      if (k === 'press') return { weep: 'Soft, and water seeps out where you pressed.', spots: 'Firm, but there are dark blood spots under the skin near the shoulder.', rigor: 'Hard and tight, still in rigor.', spring: 'Springs straight back.', slow: 'Comes back slowly.', stays: 'Your fingerprint stays in it.' }[c.press];
      if (k === 'belly') return { split: 'The belly is soft and has started to split: the guts are breaking down.', warm: 'Soft and slack, and not as cold as the ice around it.', soft: 'A little soft.', firm: 'Firm, tight belly.' }[c.belly];
      if (k === 'smell') return { freezer: 'Faintly of the freezer.', guts: 'Sour around the belly.', sour: 'A sour, fishy note.', faint: 'A faint fishy note.', clean: 'Clean, like seawater.' }[c.smell];
      return '';
    }
    function finding(fsh, k) { const lab = { eyes: 'Eyes', gills: 'Gills', press: 'Flesh', belly: 'Belly', smell: 'Smell', light: 'Flashlight', fat: 'Fat', color: 'Colour' }[k]; return el('div', null, el('b', null, lab), findingText(fsh, k)); }

    function useTool(fsh, k, st) {
      if (anim || fsh.checks.has(k)) return;
      timeLeft -= TOOL_COST;
      fsh.checks.add(k);
      anim = { k, t: 0, fsh, st };
      setTimeout(() => { anim = null; if (!done) render(); }, 1100);
    }

    function drawInspect(st, fsh) {
      const { ctx, w, h } = st;
      const a = anim && anim.fsh === fsh ? anim : null;
      const t = a ? Math.min(1, a.t / 0.9) : 0;
      if (fsh.kind === 'tuna') {
        slate(ctx, w, h);
        const lit = fsh.checks.has('light') || (a && a.k === 'light');
        drawTail(ctx, w / 2, h / 2, h * 0.44, fsh, lit);
        if (a && a.k === 'light') {
          const bx = w / 2 - h * 0.62, by = h * 0.16;
          const bm = ctx.createLinearGradient(bx, by, w / 2, h / 2); bm.addColorStop(0, 'rgba(255,255,225,.5)'); bm.addColorStop(1, 'rgba(255,255,225,0)');
          ctx.fillStyle = bm; ctx.beginPath(); ctx.moveTo(bx + 6, by + 4); ctx.lineTo(w / 2 + h * 0.2, h / 2 - h * 0.3); ctx.lineTo(w / 2 - h * 0.15, h / 2 + h * 0.3); ctx.closePath(); ctx.fill();
          ctx.save(); ctx.translate(bx, by); ctx.rotate(-0.85); ctx.fillStyle = '#2b2b2e'; ctx.fillRect(-26, -5, 26, 10); ctx.fillStyle = '#a5abb1'; ctx.fillRect(0, -7, 8, 14); ctx.fillStyle = '#fff8d8'; ctx.fillRect(7, -5, 2, 10); ctx.restore();
        }
        if (a && a.k === 'fat') { const x = w / 2 + h * 0.36, y = h / 2 - h * 0.1 + Math.sin(t * 12) * 6; fingertip(ctx, x, y); }
        stallLight(ctx, w, h, false, true);
        return;
      }
      iceBg(ctx, w, h, fsh.seed + 3);
      const g = fishGeom(w / 2, h / 2, w * 0.86, fsh.sp.depth);
      drawFish(ctx, g, fsh.sp, { fresh: cues(fsh).eyeLook, seed: fsh.seed, sheenBoost: fsh.redLamp ? 1.5 : 1 });
      stallLight(ctx, w, h, fsh.redLamp);
      if (fsh.defect === 'bruised' && fsh.checks.has('press')) { ctx.fillStyle = 'rgba(110,30,40,.5)'; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(g.xGill + 0.05 * g.L + i * 6, g.cy - 0.1 * g.H + (i % 2) * 6, 3, 0, 7); ctx.fill(); } }
      if (a && a.k === 'eyes') zoom(ctx, g.eye.x, g.eye.y, Math.min(w, h) * 0.2, () => drawEye(ctx, g.eye.x, g.eye.y, g.L * fsh.sp.eyeR, cues(fsh).eyeLook), 3, t);
      if (a && a.k === 'gills') {
        const gx = g.xGill + 0.01 * g.L, gy = g.cy;
        zoom(ctx, gx, gy, Math.min(w, h) * 0.2, () => {
          const gl = cues(fsh).gill, lvl = fsh.redLamp ? 0 : { bled: 0, bright: 0, brick: 1, brown: 2, dark: 1 }[gl];
          const p = lvl <= 0 ? 0.9 : lvl === 1 ? 0.6 : 0.4;
          const col = gl === 'bled' && !fsh.redLamp ? '#e0626a' : gl === 'dark' ? '#7e2a2c' : p >= 0.75 ? '#c8202a' : p >= 0.55 ? '#a4493a' : '#7a6a5c';
          ctx.fillStyle = '#3b2a2a'; ctx.fillRect(gx - 30, gy - 30, 60, 60);
          for (let i = 0; i < 5; i++) {
            const ax = gx - 8 + i * 4.2, len = 22 - Math.abs(i - 2) * 3;
            ctx.fillStyle = fdShade(col, -0.25); ctx.beginPath(); ctx.ellipse(ax + 0.6, gy + 0.6, 3.4, len, 0, 0, 7); ctx.fill();
            ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(ax, gy, 3.2, len, 0, 0, 7); ctx.fill();
            ctx.strokeStyle = fdShade(col, -0.35, 0.6); ctx.lineWidth = 0.5; for (let k = -len + 2; k < len - 1; k += 1.6) { ctx.beginPath(); ctx.moveTo(ax - 2.6, gy + k); ctx.lineTo(ax + 2.6, gy + k + 0.6); ctx.stroke(); }
            if (p >= 0.75) { ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(ax - 1, gy - len * 0.3, 0.8, len * 0.35, 0, 0, 7); ctx.fill(); }
          }
          ctx.fillStyle = 'rgba(240,235,225,.9)'; ctx.beginPath(); ctx.ellipse(gx + 14, gy, 4, 26, 0, 0, 7); ctx.fill();
          if (fsh.redLamp) { ctx.fillStyle = 'rgba(255,50,30,.25)'; ctx.fillRect(gx - 30, gy - 30, 60, 60); }
        }, 2.6, t);
      }
      if (a && (a.k === 'press' || a.k === 'belly')) {
        const px = a.k === 'belly' ? g.cx - 0.05 * g.L : g.cx + 0.05 * g.L, py = a.k === 'belly' ? g.cy + 0.3 * g.H : g.cy - 0.05 * g.H;
        const press = t < 0.4 ? t / 0.4 : 1, rec = t < 0.4 ? 0 : (t - 0.4) / 0.6;
        const pc = a.k === 'belly' ? { split: 0.1, warm: 0.3, soft: 0.45, firm: 1 }[cues(fsh).belly] : { weep: 0.15, spots: 1, rigor: 1.2, spring: 1, slow: 0.45, stays: 0.08 }[cues(fsh).press];
        const speed = pc;
        const depth = press * (1 - Math.min(1, rec * speed * 1.5));
        ctx.fillStyle = 'rgba(120,70,60,' + (0.45 * depth) + ')'; ctx.beginPath(); ctx.ellipse(px, py, g.L * 0.03, g.L * 0.022, 0, 0, 7); ctx.fill();
        if (fsh.defect === 'thawed' && a.k === 'press' && t > 0.4) { ctx.fillStyle = 'rgba(180,210,230,.8)'; ctx.beginPath(); ctx.arc(px + 4, py + 6 + rec * 10, 2.5, 0, 7); ctx.fill(); }
        if (fsh.defect === 'burst' && a.k === 'belly' && t > 0.3) { ctx.strokeStyle = 'rgba(120,40,40,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px - 12, py + 4); ctx.lineTo(px + 12, py + 6); ctx.stroke(); }
        if (t < 0.55) fingertip(ctx, px, py - g.L * 0.05 * (1 - press * 0.6), g.L * 0.032);
      }
      if (a && a.k === 'smell') {
        ctx.strokeStyle = 'rgba(39,33,28,.35)'; ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) { ctx.beginPath(); for (let k = 0; k < 20; k++) { const x = g.cx - 0.1 * g.L + i * 0.1 * g.L + Math.sin(k * 0.6 + t * 6 + i) * 6; const y = g.cy - 0.2 * g.H - k * 4 * t; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }

    }
    function fingertip(ctx, x, y, r) {
      r = r || 10;
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = 'rgba(40,25,20,.2)'; ctx.beginPath(); ctx.ellipse(2, 3, r, r * 1.9, 0.15, 0, 7); ctx.fill();
      const sg = ctx.createLinearGradient(-r, 0, r, 0); sg.addColorStop(0, '#e9b893'); sg.addColorStop(0.5, '#f8dcc2'); sg.addColorStop(1, '#dca57e');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(-r, -r * 3.2); ctx.lineTo(-r, r * 0.4); ctx.ellipse(0, r * 0.4, r, r * 1.1, 0, Math.PI, 0, true); ctx.lineTo(r, -r * 3.2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(42,33,28,.6)'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,238,228,.95)'; ctx.beginPath(); ctx.ellipse(0, -r * 0.2, r * 0.6, r * 0.75, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(180,120,95,.5)'; ctx.lineWidth = 0.8; ctx.stroke();
      ctx.restore();
    }
    function zoom(ctx, x, y, R, drawFn, s, t) {
      if (t <= 0) return;
      const k = 1 + (s - 1) * Math.min(1, t * 1.6);
      ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.clip();
      ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-x, -y); drawFn();
      ctx.restore();
      ctx.strokeStyle = '#27211c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.stroke();
    }

    function buyFish(fsh) {
      const lot = lots[lotIdx];
      lot.bought = fsh; spent += fsh.price;
      budgetChip.lastChild.textContent = U.yen(budget - spent);
      if (budget - spent < 0) budgetChip.className = 'chip bad';
      Sfx.ok();
      if (lotIdx < lots.length - 1) { lotIdx++; view = 'grid'; sel = null; render(); }
      else finish();
    }

    /* The master grades judgment, not luck. A fish bought without looking at it earns little even when it
       happens to be good, and a fish that cannot go on the counter (tired, thawed, bruised, split, yake)
       is close to worthless to the shop, however cheap it was. */
    function lotScore(lot) {
      const f = lot.bought;
      if (!f) return { fresh: 0, value: 0, dil: 0, judged: 0, blind: false, bad: true };
      const best = Math.max(...lot.fish.map((x) => x.f));
      const flawed = f.redLamp || f.defect || f.yake || f.warm >= 1;
      const raw = f.f >= 0.75 ? 85 + 15 * (f.f - 0.75) / Math.max(0.01, best - 0.75) : U.clamp((f.f - 0.45) / 0.3 * 40, 0, flawed ? 15 : 40);
      const grade = lot.fish.filter((x) => x.f >= 0.75);
      const vbest = Math.max(...grade.map((x) => x.f / x.ppk));
      const need = lot.type === 'tuna' ? 2 : 3, n = f.checks.size;
      const judged = n === 0 ? 0.35 : n === 1 ? 0.7 : 1; // how much of a good outcome was your doing
      const value = (f.f >= 0.75 ? U.clamp(100 * (f.f / f.ppk) / vbest, 0, 100) : 0) * judged;
      const dil = U.clamp(100 * n / need, 0, 100);
      return { fresh: raw * judged, value, dil, judged, blind: n === 0, bad: f.f < 0.75 };
    }

    function finish() {
      if (done) return;

      const per = lots.map(lotScore);
      // one bad fish ruins a course: the worst lot weighs as much as the average
      const fr = per.map((p) => p.fresh), fresh = 0.5 * U.mean(fr) + 0.5 * Math.min(...fr);
      const value = U.mean(per.map((p) => p.value)), dil = U.mean(per.map((p) => p.dil));
      const boughtN = lots.filter((l) => l.bought).length, blindN = per.filter((p) => p.blind).length;
      const q = U.clamp((fresh - 30) / 50, 0, 1); // staying cheap and quick only counts if you came back with fish worth serving
      const over = spent - budget;
      const budgetS = (over <= 0 ? 100 : U.clamp(100 - (over / budget) * 600, 0, 100)) * (boughtN / lots.length) * (0.4 + 0.6 * q);
      const allBought = lots.every((l) => l.bought);
      const speed = (!allBought ? 0 : timeLeft >= 30 ? 100 : U.clamp(40 + 60 * timeLeft / 30, 0, 100)) * q;
      const desc = (l) => (l.type === 'tuna' ? 'Tuna' : l.sp.en) + (l.bought ? ' from ' + l.bought.stall + (l.bought.redLamp ? ' (red lamps)' : l.bought.defect ? ' (' + l.bought.defect + ')' : l.bought.warm >= 1 ? ' (left out warm)' : l.bought.yake ? ' (yake)' : l.bought.iceEye ? ' (meltwater eye, a bargain)' : l.bought.ike ? ' (ikejime)' : '') : ': none');
      const fooled = lots.map((l) => l.bought).filter((b) => b && (b.redLamp || b.defect || b.yake || b.warm >= 1));
      const tip = blindN ? (blindN === boughtN ? 'You never looked at a single fish. Buying blind is gambling with the shop\'s money, and even a lucky pick teaches you nothing.' : 'You bought ' + (blindN === 1 ? 'one fish' : blindN + ' fish') + ' without looking. A good one bought blind is luck, not judgment.') : fooled.length ? ({
        red: 'Red lamps make tired gills look bright. Press the flesh. The fingerprint does not lie.',
        thawed: 'That fish was frozen and thawed, sold as fresh. Frosted eyes, water when you press. Look closer.',
        burst: 'The belly was already splitting. Press the belly on small fish before you pay.',
        bruised: 'Bruised under the skin. Those blood spots spoil the sashimi.',
        yake: 'Yake. That tuna was cooked from the inside by its own struggle. Shine a light into the cut: grey cloud in the red means soft, sour meat.',
        warm: 'Clear eyes, and still a bad fish: it sat out in the warm. The eyes are the last to tell you. Smell it and press the belly.',
      })[fooled[0].redLamp ? 'red' : fooled[0].defect || (fooled[0].warm >= 1 ? 'warm' : 'yake')] : lots.some((l) => l.bought && l.bought.f < 0.75) ? 'You bought a tired fish. No single check tells you everything: eyes, gills and flesh together.' : 'Good buying. Cloudy-but-domed eyes are meltwater; cloudy-and-sunken is age.';
      const items = [
        { label: 'Quality', detail: lots.map(desc).join(' · '), value: lots.map((l) => l.bought ? Math.round(l.bought.f * 100) + '%' : '—').join(' / '), score: fresh, w: 45, tip },
        { label: 'Value for money', detail: LV >= 2 ? 'in-season fish are cheaper and better' : 'best sushi-grade fish for the price', value: Math.round(value) + '%', score: value, w: 15,
          tip: 'The most expensive fish is not always the right fish. ' + (LV >= 2 ? 'Buy what is in season.' : 'A good fish at a fair price keeps the shop open.') },
        { label: 'Stayed in budget', detail: q < 0.85 ? 'cheap is no saving if the fish cannot be served' : null, value: U.yen(spent) + ' / ' + U.yen(budget), score: budgetS, w: 15, tip: over > 0 ? 'You spent money the shop does not have. Know the prices before you reach for your wallet.' : 'Money saved on fish nobody can serve is money thrown away.' },
        { label: 'Checked before buying', detail: 'checks on the fish you bought', value: lots.map((l) => l.bought ? l.bought.checks.size : 0).join(' / '), score: dil, w: 15, tip: 'You paid for a fish you never looked at properly. Every time.' },
        { label: 'Speed', detail: 'the good fish go early' + (allBought && q < 0.85 ? ' · fast means nothing with the wrong fish' : ''), value: allBought ? Math.max(0, Math.round(timeLeft)) + 's left' : 'ran out of time', score: speed, w: 10, tip: !allBought ? 'Too slow. By the time you decide, the other buyers have taken the best fish.' : 'Quick, and wrong. A fast bad decision is still a bad decision.' },
      ];
      const res = { items, stats: { freshness: Math.round(fresh) } };
      const badN = per.filter((p, i) => lots[i].bought && p.bad).length;
      if (boughtN && blindN === boughtN) { res.cap = 30; res.capLine = 'You did not look at one fish. Not one. Tomorrow you go again, and this time you use your eyes.'; }
      if (blindN) res.summary = 'You paid for ' + (blindN === 1 ? 'a fish' : blindN + ' fish') + ' without a single check. Whatever ' + (blindN === 1 ? 'it' : 'they') + ' turned out to be, that was luck, and the master grades judgment.' + (res.cap ? ' A morning of blind buying scores ' + res.cap + ' at best.' : '');
      else if (badN) res.summary = badN === boughtN ? 'Nothing you bought can go on the counter.' : (badN === 1 ? 'One fish' : badN + ' fish') + ' you bought cannot go on the counter, and a course is only as good as its worst piece.';
      if (!allBought) res.summary = 'The market closed before you bought everything. Tonight\'s menu has a hole in it.' + (res.summary ? ' ' + res.summary : '');
      api.finish(res);
    }

    const stop = Loop((dt) => {
      if (done) return;
      timeLeft -= dt;
      if (anim) { anim.t += dt; drawInspect(anim.st, anim.fsh); }
      timerChip.lastChild.textContent = Math.max(0, Math.ceil(timeLeft)) + 's';
      timerChip.className = 'chip' + (timeLeft < 20 ? ' bad' : timeLeft < 45 ? ' warn' : '');
      if (timeLeft <= 0) finish();
    });

    current = { destroy() { stop(); if (inspSt) inspSt.destroy(); } };
    api.steps.after(el('div', { class: 'readout' }, timerChip, budgetChip, LV >= 2 ? monthChip : null));
    window.__market = { lots, lot: () => lotIdx, budget, spent: () => spent, time: () => timeLeft };
    render();
    return current;
  },
};

/* =====================================================================
   Station 2 — Fish breakdown (おろし)
   Level 1 aji: scutes (zeigo), head, gut, then sanmai-oroshi or the
     fast daimyo-oroshi, then pin bones.
   Level 2 madai: scales, head, gut, bloodline, hara-se-se-hara, ribs.
   Level 3 saba: soft flesh that tears if you dawdle, ribs, pin bones,
     and anisakis to find in the belly.
   Level 4 hirame: flatfish, five-piece filleting (gomai-oroshi) with
     the engawa (fin muscle) to protect.
   Past level 1 the spine guide fades: you read the knife by feel —
   ticks, sound and vibration when it rides the bone, a crunch when it
   cuts into it, silence when it drifts away.
   ===================================================================== */
GAMES.fillet = {
  levelName(l) { return ['Aji', 'Madai', 'Saba', 'Hirame'][l - 1]; },
  levelNote(l) {
    return {
      2: 'A deep-bodied sea bream with heavy scales. The spine guide fades after the first cut; listen and feel for the bone',
      3: 'Saba is soft: slow strokes tear it. No guide at all, pin bones to find by touch, and anisakis to catch before a guest does',
      4: 'A flatfish. Five-piece filleting along the centre line and fin edges, keeping the engawa that regulars ask for',
    }[l] || '';
  },
  start(api) {
    const LV = api.level;
    const KF = api.knife || { tear: 1, sharp: 80 };
    const SPECIES_BY_LV = ['aji', 'madai', 'saba', 'hirame'];
    const kind = SPECIES_BY_LV[LV - 1];
    const CONF = {
      aji: { sp: SPECIES.aji, depth: 0.28, yieldSanmai: 47, yieldDaimyo: 41, tempo: 110, flesh: '#f2cbbf', soft: 1, orders: [
        { text: 'Tonight\'s hikarimono: aji nigiri. Clean fillets, every gram counts.', pri: 'yield' },
        { text: 'Staff meal: aji fry for six. Speed matters more than yield.', pri: 'speed' }] },
      madai: { sp: SPECIES.madai, depth: 0.40, yieldSanmai: 46, tempo: 170, flesh: '#f3d9d0', soft: 1, orders: [
        { text: 'Madai sashimi for a table of four. Yield and a clean belly.', pri: 'yield' }] },
      saba: { sp: SPECIES.saba, depth: 0.24, yieldSanmai: 50, tempo: 140, flesh: '#e9b3a6', soft: 2.2, orders: [
        { text: 'Shime-saba for the weekend. Saba softens fast: work quickly, and check the belly for anisakis.', pri: 'speed' }] },
      hirame: { flat: true, yieldGomai: 40, tempo: 210, flesh: '#f6ece6', soft: 1, orders: [
        { text: 'Hirame for usuzukuri, and keep the engawa: the regulars ask for it.', pri: 'yield' }] },
    }[kind];
    const order = U.pick(CONF.orders);
    const guide = LV === 1 ? 'full' : LV === 2 ? 'first' : 'none';
    const box = el('div'); api.stage.append(box);
    const st = Stage(box, { aspect: CONF.flat ? 0.62 : 0.6, maxVh: 0.5 });
    const t0 = performance.now();
    const rnd = seeded(U.irand(1, 99999));
    // fish shape varies every time; the spine wanders a little more at higher levels
    const lenF = U.rand(0.84, 0.92), depth = CONF.depth ? CONF.depth * U.rand(0.92, 1.08) : 0;
    const wob = { a: [0, 0.008, 0.024, 0.02][LV - 1], f: U.rand(1.2, 2.2), p: U.rand(0, 6.28) };
    let g, F; // round-fish geometry / flatfish geometry
    const geo = () => {
      if (CONF.flat) {
        const L = st.w * 0.86, H = L * 0.5;
        F = { cx: st.w * 0.5, cy: st.h * 0.5, L, H, l: st.w * 0.5 - L / 2 };
      } else g = fishGeom(st.w * 0.5, st.h * 0.52, st.w * lenF, depth);
    };
    geo();

    /* ---------- coordinate helpers (u along the fish, v across, in fish units) ---------- */
    let flipped = false;
    const GX = () => CONF.flat ? F : g;
    const N = {
      x: (u) => { const G = GX(); const x = G.l + u * G.L; return flipped ? 2 * G.cx - x : x; },
      y: (v) => GX().cy + v * GX().H,
      u: (x) => { const G = GX(); return ((flipped ? 2 * G.cx - x : x) - G.l) / G.L; },
      v: (y) => (y - GX().cy) / GX().H,
    };
    const R = {}; // round-fish anatomy in u,v
    if (!CONF.flat) {
      R.top = (u) => (g.topY(g.l + u * g.L) - g.cy) / g.H;
      R.bot = (u) => (g.botY(g.l + u * g.L) - g.cy) / g.H;
      R.spine = (u) => (g.spineY(g.l + u * g.L) - g.cy) / g.H + wob.a * Math.sin(u * Math.PI * 2 * wob.f + wob.p);
    }
    const U_GILL = 0.22, U_TAIL = 0.86, U_VENT = 0.58;
    let cutU = null;

    /* ---------- the sequence of operations ---------- */
    const ops = [];
    let technique = 'sanmai';
    const CLEAR = 0.035;
    function addRoundOps() {
      if (kind === 'aji') ops.push({ type: 'scrape', id: 'zeigo', label: 'Zeigo', hint: 'Slice off the <em>zeigo</em>, the hard scutes along the tail half of the lateral line. Work from the tail toward the head (drag right to left) along the line; a little back-and-forth is fine here.', region: (u, v) => u > 0.5 && u < U_TAIL && Math.abs(v - (R.spine(u) + 0.02)) < 0.07, dir: -1 });
      else ops.push({ type: 'scrape', id: 'scale', label: 'Scales', hint: 'Scrape the scales with the back of the deba, <em>tail to head</em> (drag right to left). The other way just presses them flat.' + (kind === 'saba' ? ' Saba has few scales: a quick pass.' : ''), region: (u, v) => u > U_GILL && u < U_TAIL && v > R.top(u) + 0.02 && v < R.bot(u) - 0.02, dir: -1, light: kind === 'saba' });
      ops.push({ type: 'cut', id: 'head', label: 'Head', hint: 'Take the head in <em>one firm cut</em> just behind the gill plate and the pectoral fin, top to belly. Too far back wastes the shoulder; too far forward cuts through the gills.', path: (t) => ({ u: 0.235 + 0.025 * t + 0.01, v: U.lerp(-0.5, 0.5, t) }), away: 1, single: true, lossK: 55 });
      ops.push({ type: 'cut', id: 'slit', label: 'Belly', hint: 'Open the belly from the <em>vent</em> forward, just inside the edge.', path: (t) => { const u = U.lerp(U_VENT, (cutU || 0.25) + 0.01, t); return { u, v: R.bot(u) - 0.07 }; }, away: 1, vent: true });
      ops.push({ type: 'scrub', id: 'blood', label: 'Bloodline', hint: 'Scrub out the dark <em>bloodline</em> along the spine. Blood left here makes the fish smell by evening.' + (kind === 'saba' ? ' Saba bleeds a lot.' : ''), cells: () => { const c = []; const n = kind === 'saba' ? 24 : 18; for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) { const u = U.lerp((cutU || 0.25) + 0.02, 0.55, (i + 0.5) / n); c.push({ u, v: R.spine(u) + 0.03 + j * 0.05, clean: false }); } return c; } });
      if (kind === 'aji') ops.push({ type: 'choose', id: 'tech', label: 'Technique', hint: 'How will you fillet it? <em>Sanmai-oroshi</em>: four cuts riding the spine, best yield. <em>Daimyo-oroshi</em>: one stroke per side straight down the spine, fast but leaves more meat on the bone.' });
    }
    function addFilletCuts() {
      const u0 = () => (cutU || 0.25) + 0.01;
      const ride = (kind2, side, label) => ({ type: 'ride', id: 'cut_' + side + '_' + kind2, side, label, kind2,
        hint: label + ': draw the knife from the head end to the tail in long strokes, riding ' + (kind2 === 'hara' ? 'just <em>under</em>' : kind2 === 'se' ? 'just <em>over</em>' : '<em>straight along</em>') + ' the spine.' + (guide === 'none' ? ' No guide now: feel for the ticks of the bone.' : ''),
        path: (t) => { const u = U.lerp(u0(), U_TAIL, t); return { u, v: R.spine(u) + (kind2 === 'hara' ? CLEAR : kind2 === 'se' ? -CLEAR : 0) }; },
        away: kind2 === 'hara' ? 1 : -1, bone: true, sym: kind2 === 'daimyo' });
      if (technique === 'daimyo') {
        ops.push(ride('daimyo', 1, 'Side 1, one stroke'));
        ops.push({ type: 'flip', id: 'flip', label: 'Turn over' });
        ops.push(ride('daimyo', 2, 'Side 2, one stroke'));
      } else {
        ops.push(ride('hara', 1, 'Side 1, belly (hara)'));
        ops.push(ride('se', 1, 'Side 1, back (se)'));
        ops.push({ type: 'flip', id: 'flip', label: 'Turn over' });
        ops.push(ride('se', 2, 'Side 2, back (se)'));
        ops.push(ride('hara', 2, 'Side 2, belly (hara)'));
      }
      if (kind !== 'aji') {
        ops.push({ type: 'ribs', id: 'ribs1', label: 'Ribs', side: 1, hint: 'Fillet 1: shave off the <em>rib bones</em> in one thin cut along their ends. Deeper wastes flesh; shallower leaves bones in.' });
        ops.push({ type: 'ribs', id: 'ribs2', label: 'Ribs', side: 2, hint: 'Fillet 2: the same on the other fillet.' });
      }
      if (kind === 'aji' || kind === 'saba') ops.push({ type: 'pins', id: 'pins', label: 'Pin bones', hint: LV >= 3 ? 'Run your fingertip down the middle of the fillet to <em>feel</em> the pin bones, then pull each one <em>toward the head</em> (swipe left) with the tweezers. Pulling the other way tears the flesh.' : 'Pull each <em>pin bone</em> with the tweezers: press on it and swipe <em>toward the head</em> (left). The other way tears the flesh.' });
      if (kind === 'saba' || (kind === 'aji' && rnd() < 0.3)) ops.push({ type: 'worms', id: 'worms', label: 'Anisakis', hint: 'Check the belly flap for <em>anisakis</em>: small white coils in the flesh. Tap each one to pick it out. Miss one and a guest could be in hospital.' });
    }
    function addFlatOps() {
      ops.push({ type: 'scrape', id: 'scale', label: 'Scales', hint: 'Hirame scales are tiny: lay the yanagiba almost flat and shave them off <em>tail to head</em> (sukibiki, drag right to left). Fast and hard cuts the skin.', region: (u, v) => u > 0.22 && u < 0.88 && Math.abs(v) < 0.46, dir: -1, skinCut: true });

      ops.push({ type: 'scrub', id: 'gut', label: 'Guts', hint: 'Scrape out the small belly cavity behind the head and rinse the blood.', cells: () => { const c = []; for (let i = 0; i < 8; i++) for (let j = 0; j < 3; j++) c.push({ u: U.lerp(0.24, 0.32, (i + 0.5) / 8), v: 0.12 + j * 0.1, clean: false }); return c; } });

        if (side === 2) ops.push({ type: 'flip', id: 'flip', label: 'Turn over' });
        const nm = side === 1 ? 'Dark side' : 'White side';
        ops.push({ type: 'ride', id: 'center' + side, side, label: nm + ': centre', hint: nm + ': cut down the <em>centre line</em> to the backbone, head end to tail, riding the bone.', path: (t) => ({ u: U.lerp(0.24, 0.88, t), v: wob.a * 0.6 * Math.sin(t * 6 + wob.p) }), away: 1, bone: true, sym: true });
        ops.push({ type: 'cut', id: 'edgeT' + side, side, label: nm + ': top edge', hint: 'Cut along the <em>top fin base</em>. Stay just outside the line of the body to keep the engawa; too far out and you are in the fin rays.', path: (t) => { const u = U.lerp(0.25, 0.86, t); return { u, v: -flatEdge(u) }; }, away: 1, engawa: true });
        ops.push({ type: 'sweep', id: 'sweepT' + side, side, label: nm + ': top fillet', dir: -1, hint: 'Release the <em>top fillet</em>: long strokes from the centre line out to the edge, the blade flat on the bones. Cover its whole length.' });
        ops.push({ type: 'cut', id: 'edgeB' + side, side, label: nm + ': bottom edge', hint: 'Now the <em>bottom fin base</em>, the same way.', path: (t) => { const u = U.lerp(0.25, 0.86, t); return { u, v: flatEdge(u) }; }, away: -1, engawa: true });
        ops.push({ type: 'sweep', id: 'sweepB' + side, side, label: nm + ': bottom fillet', dir: 1, hint: 'Release the <em>bottom fillet</em> with long strokes from the centre out.' });

    }
    function flatEdge(u) { const x = (u - 0.55) / 0.36; return 0.44 * Math.sqrt(Math.max(0, 1 - Math.min(1, x * x * 0.85))) + 0.02; }

    if (CONF.flat) addFlatOps(); else addRoundOps();
    let opIdx = 0;
    const cur = () => ops[opIdx];

    /* ---------- per-op state ---------- */
    function initOp(op) {
      op.t0 = performance.now(); op.strokes = 0; op.devs = []; op.pts = []; op.bins = new Array(30).fill(false); op.hits = 0; op.tears = 0; op.wrong = 0; op.gash = 0; op.hacks = op.hacks || 0;
      if (op.type === 'scrape') { op.cells = []; for (let r = 0; r < 12; r++) for (let c = 0; c < 28; c++) { const u = (CONF.flat ? 0.2 : U_GILL) + (c + 0.5) / 28 * ((CONF.flat ? 0.88 : U_TAIL) - (CONF.flat ? 0.2 : U_GILL)); const v = -0.5 + (r + 0.5) / 12; if (op.region(u, v)) op.cells.push({ u, v, on: true }); } op.total = op.cells.length; op.removed = 0; op.skin = 0; op.withT = 0; op.against = 0; }

      if (op.type === 'sweep') { op.cover = new Array(16).fill(0); }
      if (op.type === 'pins') { const u0 = (cutU || 0.25) + 0.06; op.items = []; const n = kind === 'saba' ? 11 : 9; for (let i = 0; i < n; i++) { const u = u0 + i * 0.028 + U.rand(-0.004, 0.004); op.items.push({ u, v: R.spine(u) + U.rand(-0.015, 0.015), shown: LV < 3, done: false }); } op.pulled = 0; op.clean = 0; }
      if (op.type === 'worms') { const n = kind === 'saba' ? U.irand(1, 4) : 1; op.items = []; for (let i = 0; i < n; i++) { const u = U.rand((cutU || 0.25) + 0.04, 0.52); op.items.push({ u, v: U.lerp(R.spine(u) + 0.12, R.bot(u) - 0.06, rnd()), r: U.rand(0, 6.28), done: false }); } op.found = 0; op.misses = 0; }

    /* ---------- UI ---------- */
    const STEP_LABELS = () => ops.map((o) => o.label);
    const nextBtn = el('button', { class: 'btn primary', type: 'button' }, 'Next');
    const feel = { state: 'idle', at: 0, sparks: [] };
    function showOp() {
      const op = cur();
      api.clearControls(); api.setSteps(STEP_LABELS(), opIdx);
      initOp(op);
      api.hint((opIdx === 0 ? '<em>Order:</em> ' + order.text + '<br>' : '') + (op.hint || ''));
      if (op.type === 'scrape' || op.type === 'scrub' || op.type === 'pins' || op.type === 'worms') {
        nextBtn.textContent = op.type === 'pins' ? 'All pin bones out' : op.type === 'worms' ? 'Belly is clean' : 'Done, next step';

        api.controls.append(fb);
      }
      if (op.type === 'choose') {
        const a = el('button', { class: 'btn wood', type: 'button' }, 'Sanmai-oroshi');
        const b = el('button', { class: 'btn wood', type: 'button' }, 'Daimyo-oroshi');
        a.onclick = () => { technique = 'sanmai'; advance(); };
        b.onclick = () => { technique = 'daimyo'; advance(); };
        api.controls.append(el('div', { class: 'row' }, a, b));

    }
    function demoFor(op) {
      let pts = null;
      if (op.path) { pts = [0, 0.25, 0.5, 0.75, 1].map((k) => { const q = op.path(k); return { x: N.x(q.u), y: N.y(q.v) }; }); }
      else if (op.type === 'scrape') { const yv = CONF.flat ? 0 : R.spine(0.6) + 0.02; pts = [0.8, 0.65, 0.5, 0.38].map((u) => ({ x: N.x(u), y: N.y(op.id === 'scale' ? yv + 0.15 : yv) })); }

      else if (op.type === 'pins' && op.items[0]) { const b = op.items[0]; pts = [{ x: N.x(b.u), y: N.y(b.v) }, { x: N.x(b.u), y: N.y(b.v) }, { x: N.x(b.u - 0.06), y: N.y(b.v) }]; }
      else if (op.type === 'sweep') { pts = [0.3, 0.3].map((u, k) => ({ x: N.x(0.5), y: N.y(k ? op.dir * 0.4 : 0.02) })); }

    function advance() {

      showOp();

    /* ---------- path maths ---------- */

    /* ---------- knife damage: steel on flesh where no cut belongs ---------- */

    function onBody(u, v) {

    function drawGashes(ctx) {

        const line = (dy) => { ctx.beginPath(); pts.forEach((q, i) => { const x = N.x(q.u), y = N.y(q.v) + dy; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); };

    /* ---------- pointer ---------- */
    let last = null, strokeDx = 0, strokeLen = 0, pinGrab = null;
    const off = track(st.c, {
      down(p) { last = p; strokeDx = 0; strokeLen = 0; const op = cur(); if (!op) return; op.strokeHad = false; if (op.type === 'cut' && op.single) op.pts = []; if (op.type === 'pins') pinGrab = pinAt(p); if (op.type === 'worms') tapWorm(p); if (op.type === 'sweep') op.stroke = [{ u: N.u(p.x), v: N.v(p.y), t: p.t, x: p.x, y: p.y }]; handle(p, true); },
      move(p) { handle(p, false); last = p; },
      up(p) {

    let hover = null, hoverAng = 0;
    // a quick swipe only reports the finger every 20-30 px; fill in the path between reports
    function seg(q, p, step = 4) {

      const d = U.dist(p, q), n = Math.max(1, Math.ceil(d / step)), out = [];
      for (let i = 1; i <= n; i++) out.push({ x: q.x + (p.x - q.x) * i / n, y: q.y + (p.y - q.y) * i / n, t: q.t + (p.t - q.t) * i / n });

    }
    function handle(p, isDown) {
      const op = cur(); if (!op) return;
      if (last && U.dist(p, last) > 2) hoverAng = U.lerp(hoverAng, Math.atan2(p.y - last.y, p.x - last.x), 0.25);
      hover = p;
      const u = N.u(p.x), v = N.v(p.y);

          else if (Math.abs(dev) <= 0.03) { feel.state = 'on'; Sfx.tick(); if (rnd() < 0.5) feel.sparks.push({ x: p.x, y: p.y, vx: U.rand(-30, 30), vy: U.rand(-40, 0), life: 0.3, c: 'rgba(255,255,255,' }); }

        }
      } else if (op.type === 'pins' && LV >= 3) {
        op.items.forEach((b) => { if (!b.shown && !b.done && Math.hypot(N.x(b.u) - p.x, N.y(b.v) - p.y) < 22) { b.shown = true; Sfx.pop(); Sfx.buzz(8); } });

    }
    function ribPath(u) { const u0 = (cutU || 0.25) + 0.03, u1 = 0.56; const t = U.clamp((u - u0) / (u1 - u0), 0, 1); const a = R.spine(u) + 0.06, b = R.bot(u) - 0.07; return U.lerp(a, b, Math.pow(t, 0.8)); }
    function pinAt(p) { const op = cur(); return op.items.find((b) => b.shown && !b.done && Math.hypot(N.x(b.u) - p.x, N.y(b.v) - p.y) < 20) || null; }
    function releasePin(p) {

    function tapWorm(p) {

    function endSweep() {

    /* ================= WASH ================= */
    function wash() {

      const info = el('div', { class: 'readout' });

      api.controls.append(info, el('div', { class: 'row' }, addBtn, drainBtn), doneBtn);

      };

      setTimeout(() => { const cx = st.w / 2, cy = st.h / 2, r = Math.min(st.w, st.h) * 0.25; api.demo && api.demo('scrub', [0, 1, 2, 3, 4, 5, 6].map((k) => ({ x: cx + Math.cos(k) * r, y: cy + Math.sin(k) * r })), { duration: 1600 }); }, 400);

        down(p) { last = p; hand = p; },
        move(p) {

    /* ================= SOAK & WATER ================= */

    /* ================= COOK & STEAM ================= */

        }
        // the hagama: an iron pot with a flange, under a heavy wooden lid
        fdShadow(ctx, cx + 6, cy + ph * 0.5, pw * 0.55, ph * 0.18, 0.4);
        const pot = () => { ctx.beginPath(); ctx.moveTo(cx - pw * 0.42, cy - ph * 0.15); ctx.bezierCurveTo(cx - pw * 0.46, cy + ph * 0.5, cx + pw * 0.46, cy + ph * 0.5, cx + pw * 0.42, cy - ph * 0.15); ctx.closePath(); };
